<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciprofloxacin model preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #eceeee; color: #0e1c24; font: 14px/1.4 "Helvetica Neue", Arial, sans-serif; }
  #v { position: fixed; inset: 0; }
  .bar { position: fixed; left: 16px; top: 14px; right: 16px; display: flex; gap: 6px 16px; align-items: baseline; flex-wrap: wrap; }
  .bar b { font-size: 16px; margin-right: 6px; }
  button { font: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid #0e1c24; padding: 2px 0; cursor: pointer; }
  button[aria-pressed="true"] { font-weight: 700; border-bottom-width: 2px; }
  #say { position: fixed; left: 16px; bottom: 14px; right: 16px; max-width: 62ch; margin: 0; font-size: 15px; }
  .key { position: fixed; right: 16px; bottom: 14px; margin: 0; padding: 0; list-style: none; font-size: 12px; color: #3a4a54; }
  .key i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 1px solid #0e1c24; }
</style>
</head>
<body>
<div id="v"></div>
<div class="bar"><b>Ciprofloxacin, 10 mm = 1 Å</b>
  <button id="b-h" aria-pressed="true">Cipro (H cap on)</button>
  <button id="b-cl" aria-pressed="false">After chlorine (Cl cap on)</button>
  <button id="b-one" aria-pressed="false">One colour, as printed</button>
  <button id="b-spin" aria-pressed="true">Spin</button>
</div>
<p id="say"></p>
<ul class="key">
  <li><i style="background:#3b4045"></i>carbon</li><li><i style="background:#f4f4f2"></i>hydrogen</li>
  <li><i style="background:#2f5fd0"></i>nitrogen</li><li><i style="background:#d2372c"></i>oxygen</li>
  <li><i style="background:#8fd05a"></i>fluorine</li><li><i style="background:#1fa34a"></i>chlorine</li>
</ul>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script>
(async function () {
  const box = document.getElementById('v');
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); box.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0xeceeee);
  const cam = new THREE.PerspectiveCamera(30, 1, 1, 5000); cam.up.set(0, 0, 1); cam.position.set(40, -300, 200);
  const ctl = new THREE.OrbitControls(cam, renderer.domElement); ctl.enableDamping = true; ctl.target.set(0, 0, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x80868c, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(150, -250, 400); scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-300, 150, -100); scene.add(fill);
  const COL = { C: 0x3b4045, H: 0xf4f4f2, N: 0x2f5fd0, O: 0xd2372c, F: 0x8fd05a, Cl: 0x1fa34a };
  const mat = (c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.45, metalness: 0.02 });
  const loader = new THREE.STLLoader();
  const load = (f) => new Promise((ok, no) => loader.load('out/' + f + '.stl', (g) => { g.computeVertexNormals(); ok(g); }, undefined, no));
  const meshes = {};
  for (const e of ['C', 'H', 'N', 'O', 'F']) { meshes[e] = new THREE.Mesh(await load('colour_' + e), mat(COL[e])); scene.add(meshes[e]); }
  meshes.capH = new THREE.Mesh(await load('cap_H_in_place'), mat(COL.H)); scene.add(meshes.capH);
  meshes.capCl = new THREE.Mesh(await load('cap_Cl_in_place'), mat(COL.Cl)); scene.add(meshes.capCl);
  const say = document.getElementById('say');
  const press = (id, on) => document.getElementById(id).setAttribute('aria-pressed', on ? 'true' : 'false');
  let spin = true, one = false;
  function show(cl) {
    meshes.capH.visible = !cl; meshes.capCl.visible = cl; press('b-h', !cl); press('b-cl', cl);
    say.textContent = cl
      ? 'N-chloro-ciprofloxacin. One hydrogen on the piperazine nitrogen is now a chlorine. The other 41 atoms have not moved.'
      : 'Ciprofloxacin, 42 atoms. The white cap on the blue nitrogen at the end is the hydrogen that free chlorine replaces.';
  }
  function paint() {
    for (const e of ['C', 'H', 'N', 'O', 'F']) meshes[e].material.color.setHex(one ? 0x2a2d30 : COL[e]);
    meshes.capH.material.color.setHex(one ? 0xe8e8e4 : COL.H);
  }
  document.getElementById('b-h').onclick = () => show(false);
  document.getElementById('b-cl').onclick = () => show(true);
  document.getElementById('b-one').onclick = () => { one = !one; press('b-one', one); paint(); };
  document.getElementById('b-spin').onclick = () => { spin = !spin; press('b-spin', spin); };
  const q = new URLSearchParams(location.search);
  show(q.has('cl')); if (q.has('one')) document.getElementById('b-one').click(); if (q.has('still')) document.getElementById('b-spin').click();
  if (q.has('top')) cam.position.set(0, -40, 370);
  function size() { const w = box.clientWidth, h = box.clientHeight; renderer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  addEventListener('resize', size); size();
  (function loop() { ctl.autoRotate = spin; ctl.autoRotateSpeed = 1.0; ctl.update(); renderer.render(scene, cam); requestAnimationFrame(loop); })();
})().catch((e) => { document.getElementById('say').textContent = 'Could not load the preview: ' + e.message; });
</script>
</body>
</html>
