# Antibacterial activity prediction review

**Project:** *Removed Is Not Safe* · **Date:** 28 September 2026 · **Sources:** PubMed (via the PubMed connector) and web search.

**How to read the source notes:** after each source, **[full text]** means the whole paper or page was read; **[abstract]** means only the PubMed abstract was read; **[snippet]** means only a search-result snippet or summary page was seen. Nothing is quoted that wasn't read.

---

## 1. Bottom line

1. **The core idea is still novel, but only as a combination.** No study was found that (a) uses a chemistry model to predict *remaining antibacterial activity* over time, (b) uses that prediction to pick the cheapest reactor settings, and (c) tests the prediction blind. Every *piece* exists separately.
2. **The literature points to a sharper, stronger version of the project.** For ozone and hydroxyl radicals, antibacterial activity usually disappears along with the drug (the "removed = safe" case). For sulfamethoxazole in particular, ozone removes activity one-for-one. The open gap is **sulfate-radical treatment (persulfate)**. Sulfate radicals preferentially turn sulfamethoxazole into a **nitro product**, and a separate study found that nitro product inhibits bacteria **more** than the original drug. Nobody appears to have connected those two findings, measured the result in a reactor, or modeled it.
3. **One honest problem with the target drug.** Sulfamethoxazole's estimated resistance-selection threshold is **16 µg/L**, about 250 times higher than ciprofloxacin's (**0.06 µg/L**). At the tiny levels found in recycled water, sulfamethoxazole is far below the resistance threshold. It is a good *regulatory* example (California names it), but a weak *resistance* example.
4. **Recommended revised research question:**
   > **Can a chemistry-based computer model find the lowest-cost persulfate reactor settings that remove sulfamethoxazole without leaving antibacterial byproducts behind?**

---

## 2. Terms used

- **Oxidation / advanced oxidation process (AOP):** treatment that breaks molecules apart with very reactive chemicals. Ozone, UV light plus hydrogen peroxide (UV/H₂O₂), UV plus chlorine, chlorine, Fenton (iron plus peroxide) and persulfate are all examples.
- **Radical:** a short-lived, extremely reactive molecule. The **hydroxyl radical (•OH)** comes from ozone and UV/H₂O₂. The **sulfate radical (SO₄•⁻)** comes from persulfate activated by iron, heat or UV.
- **Transformation product (TP):** a piece the drug breaks into.
- **Residual antibacterial activity:** how strongly the treated water still slows or kills bacteria.
- **Potency / equivalents:** activity expressed as "this much of the original drug would have the same effect."
- **QSAR (quantitative structure–activity relationship):** a formula that predicts a molecule's effect from its structure.
- **MIC (minimum inhibitory concentration):** the lowest drug concentration that stops bacteria growing.
- **PNEC (predicted no-effect concentration):** the level below which no effect is expected. **PNEC-resistance** is the level below which the drug shouldn't push bacteria toward resistance.
- **Bioassay:** a test that uses living organisms, here bacteria, to measure an effect.

---

## 3. What is already known: activity after oxidation

**Pattern:** it depends on the oxidant and the drug. The table is sorted by oxidant.

| Oxidant | Drug(s) | Finding | Source |
|---|---|---|---|
| Ozone and •OH | 13 antibiotics incl. sulfamethoxazole, trimethoprim, ciprofloxacin, tetracycline | Nearly all cases: activity lost one-for-one with the drug. Exceptions: penicillin G and cephalexin | Dodd et al. 2009, *ES&T* [abstract] [doi](https://doi.org/10.1021/es8025424) |
| Ozone and •OH | Penicillin G, cephalexin | Ozone forms still-active sulfoxides (penicillin version ~15% as potent, ~55% yield; cephalexin version 83% as active). Hydroxyl radicals destroy them; ozone alone doesn't | Dodd et al. 2010, *ES&T* [abstract] [doi](https://doi.org/10.1021/es101061w) |
| Ozone kinetics | 14 antibacterials | Reaction speeds show whether ozone hits the part of each molecule that makes it work. For sulfamethoxazole and trimethoprim, it does | Dodd, Buffle & von Gunten 2006, *ES&T* [abstract] [doi](https://doi.org/10.1021/es051369x) |
| Ozone | Ciprofloxacin in hospital effluent | Activity loss tracked drug loss for *E. coli* and *P. fluorescens*, but breakdown products drove activity against *Bacillus coagulans*. **The test strain matters** | De Witte et al. 2010, *Chemosphere* [abstract] [doi](https://doi.org/10.1016/j.chemosphere.2009.12.026) |
| Ozone | Oxytetracycline factory effluent | Activity vanished when the drug was fully removed; 657 mg/L ozone for 96% removal | Zheng et al. 2010, *Chemosphere* [abstract] [doi](https://doi.org/10.1016/j.chemosphere.2010.08.058) |
| UV and UV/H₂O₂ | 6 antibiotics, pure water and 2 effluents | No active products for 4 of 6 | Keen & Linden 2013, *ES&T* [abstract] [doi](https://doi.org/10.1021/es402472x) |
| UV/H₂O₂ | Amoxicillin | Activity **rose** early in treatment, then disappeared after 20 min at 10 mM H₂O₂ | *Sci. Total Environ.* 2012 [abstract] [doi](https://doi.org/10.1016/j.scitotenv.2011.12.011) |
| Fenton | Ampicillin, doxycycline, tylosin | Too little reagent left active derivatives; too much left toxic peroxides. **A precise dose was needed** | *Chemosphere* 2023 [abstract] [doi](https://doi.org/10.1016/j.chemosphere.2023.139854) |
| Permanganate | Ciprofloxacin, lincomycin, trimethoprim | Products kept negligible activity | *ES&T* 2011 [abstract] [doi](https://doi.org/10.1021/es104234m) |
| Ferrate | Penicillins, cephalexin | Cephalexin products ~24% as potent; others <5% | Karlesa et al. 2014, *ES&T* [abstract] [doi](https://doi.org/10.1021/es5028426) |
| Cold plasma (•OH + ozone) | Ciprofloxacin, ofloxacin | In one test, ciprofloxacin showed **higher** activity after treatment | Sarangapani et al. 2019, *Sci Rep* [abstract] [doi](https://doi.org/10.1038/s41598-019-40352-9) |
| H₂O₂, persulfate, percarbonate | Sulfapyridine (a sulfonamide) | >90% drug removed but only 38–57% of activity; several pieces **more** active than the drug; QSAR predicted piece activity; mixtures showed synergy and antagonism | Yao & You 2023, *Ecotoxicol. Environ. Saf.* [full text] [doi](https://doi.org/10.1016/j.ecoenv.2023.114656) |
| (Pieces tested directly) | Sulfamethoxazole, 11 pieces | Pieces changed at the amino end still work against bacteria; **4-nitro-SMX and 4-OH-SMX inhibit growth more than SMX** (*Vibrio fischeri*) | Majewsky et al. 2014, *Chem. Res. Toxicol.* [abstract] [doi](https://doi.org/10.1021/tx500267x) |
| Antiviral comparison | Oseltamivir (Tamiflu) | Activity temporarily **doubled** up to 50% drug removal | Mestankova et al. 2011, *Environ. Pollut.* [abstract] [doi](https://doi.org/10.1016/j.envpol.2011.09.018) |

**Key link nobody seems to have made:**

- With persulfate, sulfate radicals preferentially attack sulfamethoxazole's amino group, producing a **nitro derivative** and dimers.
- Bicarbonate (common in real water) increases this. Predicted and measured toxicity was higher for sulfate- and carbonate-radical products than for hydroxyl-radical products (Yang et al. 2017, *Water Research*, [abstract], [doi](https://doi.org/10.1016/j.watres.2017.03.054)).
- Majewsky (2014) found 4-nitro-SMX inhibits bacteria more than SMX itself.

Put together, **persulfate treatment of sulfamethoxazole is exactly where "removed" may not mean "safe."** Related chemistry: Ji et al. 2014 ([doi](https://doi.org/10.1016/j.scitotenv.2013.11.008)) and Ji et al. 2015 ([doi](https://doi.org/10.1016/j.watres.2015.09.005)) found the aniline (amino) group is the main sulfate-radical target, including in iron-activated persulfate [abstracts].

**Salty water:** in chloride-rich water, persulfate-type systems form reactive chlorine species and chlorinated sulfamethoxazole products. One 2026 study rated these less toxic by computer prediction and a wheat test, but ran no antibacterial test (*J. Hazard. Mater.* [abstract] [doi](https://doi.org/10.1016/j.jhazmat.2026.142702)).

## 5. Novelty verdict

**Not new:** measuring activity after oxidation; QSAR for pieces; kinetic models of iron-persulfate; ML/Bayesian optimization of oxidation; real-time ozone control; kinetic prediction of a biological endpoint (estrogenicity, resistance genes).

**New, if done:**
1. A kinetic model that tracks sulfamethoxazole *and its active pieces* (especially the nitro product) under **sulfate-radical** treatment and converts that into one number, remaining antibacterial activity.
2. Using that number as a **constraint in a cost optimization**, including staged dosing and iron amount.
3. A **blind prediction test** of the activity number in a flow reactor.

**Strongest short claim:** *For ozone, removing sulfamethoxazole removes its antibacterial activity. For persulfate, the chemistry predicts it may not. We built a model that predicts when, and uses that to pick the cheapest safe settings.*

**Main risk to novelty:** a 2025–2026 paper outside PubMed (for example in *Chem. Eng. J.* or *ACS ES&T Engineering*) could have done part of this. Google Scholar and Web of Science weren't available here. Do one 30-minute Google Scholar search on "sulfamethoxazole persulfate antibacterial activity nitro" before the project is locked.

## 6. Recommended topic revisions

1. **Sharpen the hypothesis to the sulfate-radical gap.** Compare persulfate (sulfate radicals) against a hydroxyl-radical control. UV/H₂O₂, or persulfate with the sulfate radicals blocked by a scavenger chemical, would both work. The prediction is that activity can stay behind with persulfate but not with •OH.
2. **Model the nitro product explicitly.** Include 4-nitro-SMX and hydroxylated SMX as tracked species with published or measured potencies. Include bicarbonate, which boosts nitro formation.
3. **Deal with the resistance-threshold problem honestly.** Either:
   - keep sulfamethoxazole as the *regulatory* example and add **trimethoprim**, which is usually paired with it in medicine and has a resistance threshold of 0.5 µg/L; or
   - state plainly that the resistance argument is strongest for drugs like ciprofloxacin and trimethoprim, and that sulfamethoxazole is the test case for the *method*.
4. **Test design matters:**
   - Sulfonamides need a medium low in thymidine, or they look inactive.
   - Results depend on the test strain (De Witte 2010), so pick *E. coli* and state it.
   - Quench leftover oxidant with thiosulfate before every test, because Fenton overdosing produced toxicity from leftover peroxide.
5. **Revised research question (no "and"):**
   > Can a chemistry-based computer model find the lowest-cost persulfate reactor settings that remove sulfamethoxazole without leaving antibacterial byproducts behind?

---

## 7. Measuring residual activity cheaply

- **Real-time growth-curve method:** *S. aureus* with results as "drug equivalents." It gave better repeatability than fixed-time reading (1.08% vs 5.62–11.29% variation). Quantification limits were **0.20–24 µg/L** depending on the antibiotic. Breakdown products contributed 13–23% of remaining potency in factory wastewater (Zhang et al. 2015 [abstract] [doi](https://doi.org/10.1039/c5em00228a)).
- **Effect-based panels (2026):** three antibacterial bioassays on water extracts. They detected activity in every wastewater effluent tested, and they often found activity when chemical tests found no antibiotics (and the reverse). A simple *E. coli* test was recommended for screening (de Schepper et al. 2026, *Environ. Toxicol. Chem.* [abstract] [doi](https://doi.org/10.1093/etojnl/vgag207)).
  - **This strongly supports the project's "measure activity, not just the drug" argument.** It also shows that concentrating samples is usually needed at real-world levels.
- **Regulatory status:** California's recycled-water policy panel recommended two screening bioassays, estrogen receptor and aryl hydrocarbon receptor. **No antibacterial endpoint** (SCCWRP, 2018 [full text of news page] [link](https://www.sccwrp.org/news/cec-panel-informs-proposed-update-recycled-water-policy/)).
- **Implication:** our resazurin test will work at lab (µg/L to mg/L) concentrations, not at real-world ng/L without concentrating the sample. Say this plainly.

---

## 8. How water residues connect to resistance (verified numbers)

- **Very low levels can select resistance.** For three clinically important antibiotics, concentrations up to several hundred times below the MIC enriched resistant bacteria (Gullberg et al. 2011, *PLoS Pathogens* [abstract] [doi](https://doi.org/10.1371/journal.ppat.1002158)).
- **Resistance thresholds span a wide range.** Estimated resistance-selection PNECs for 111 antibiotics range from 8 ng/L to 64 µg/L (Bengtsson-Palme & Larsson 2016 [abstract] [doi](https://doi.org/10.1016/j.envint.2015.10.015)).
- **Industry table** (AMR Industry Alliance, rev. Feb 2026 [table rows read] [link](https://www.amrindustryalliance.org/wp-content/uploads/PNEC-Table-1-AMRIA-Feb-2026.pdf)):

  | Antibiotic | Resistance PNEC | Ecotoxicity PNEC | Target |
  |---|---|---|---|
  | Sulfamethoxazole | 16 µg/L | 6.6 µg/L | 6.6 µg/L |
  | Ciprofloxacin | 0.06 µg/L | 0.45 µg/L | 0.06 µg/L |
  | Trimethoprim | 0.5 µg/L | 928 µg/L | 0.5 µg/L |

- **People do pick up resistant bacteria from water.** 6.3% of surfers vs 1.5% of non-surfers carried a resistant *E. coli* type, risk ratio 4.09 (95% CI 1.02–16.4) (Leonard et al. 2018 [abstract] [doi](https://doi.org/10.1016/j.envint.2017.11.003)). **Correction:** this is about four times, not three as stated earlier, and the confidence range is wide.
- **Still unmeasured:** how much water residues contribute to resistant infections in people overall.

---

## 9. Impact and money (carried from earlier research, sources in the project doc)

- **Global AMR burden:** Lancet GRAM 2024 forecasts 39 million deaths from 2025 to 2050, rising to 1.91 million a year by 2050.
- **US AMR burden (CDC):** 2.8 million resistant infections and 35,000 deaths a year; $4.6 billion a year for six pathogens.
- **California DPR rules:** adopted by the State Water Board on 19 Dec 2023, approved by the Office of Administrative Law in August 2024 (ACWA [full text] [link](https://www.acwa.com/news/office-of-administrative-law-approves-direct-potable-reuse-regulations/)). The ozone/BAC stage must achieve a 1-log reduction of indicators including sulfamethoxazole.
- **EU wastewater law:** producers pay ≥80% of the cost of extra treatment, split partly by hazard; about €1.2 billion a year by 2040 (JRC).
- **Swiss program:** CHF 1.2 billion; operating costs of 0.02–0.09 CHF per m³.
- **US plants:** Phoenix plans 60 MGD by 2030; El Paso's plant is 10 MGD.
- **Overdosing:**
  - A UV-chlorine review says fixed-dose control is almost always overdosing to some extent [snippet].
  - UV/H₂O₂ uses only about 10% of the peroxide added [abstract].
  - A 2026 full-scale vs lab comparison found ozone dose was the main driver of remaining toxicity. Estrogenic activity removal was 100% at 0.7 vs 62% at 0.1 mg O₃/mg DOC. The authors call for optimized ozone dosing (Trejos-Delgado et al. 2026 [abstract] [doi](https://doi.org/10.1080/10934529.2026.2711513)).
- **The $0.2–1.6 million/year per-plant savings figure remains our own rough estimate, not a published number.**

---

## 10. Limits of this review

- Mostly abstracts. Only Yao & You 2023 and a few web pages were read in full. Numbers from abstracts are as stated there.
- PubMed covers environmental science well, but not every engineering journal. Google Scholar, Web of Science and patent databases weren't searched directly.
- Majewsky's "more active" finding used *Vibrio fischeri*, not *E. coli*. Activity against *E. coli* in a thymidine-low medium should be checked in the lab.

# Velocity sweep: cipro removal in the contact-chamber tube (5 Oct 2026)

Interactive model: https://claude.ai/artifact/2sWHY9oaTPDk2KJU1dsVDW (code is self-contained in the page; also kept as `model.js`).

## Model
- Species: free Cl (HOCl/OCl⁻), free NH₃, NH₂Cl, NHCl₂, cipro. pH speciation: HOCl 7.54, NH₄⁺ 9.25, cipro N4 8.7.
- HOCl + NH₃ 3.07e6 (Qiang & Adams 2004); HOCl + NH₂Cl 150; NH₂Cl hydrolysis 2.1e-5 s⁻¹; disproportionation per Jafvert & Valentine 1992 (C_T 2 mM).
- HOCl + cipro 7.6e5 M⁻¹s⁻¹ apparent at pH 7 (Dodd 2005, **from memory — verify against the paper**). NH₂Cl + cipro: **placeholder 1 M⁻¹s⁻¹**, get Dodd's combined-chlorine value.
- Hydraulics: laminar convective RTD, Taylor dispersion, or Levenspiel turbulent dispersion → segregated-flow average. Dosing points mix instantly (not true in laminar flow without a static mixer).
- Defaults: 10 m × 6.35 mm tube, 3 mg/L Cl₂, Cl₂:N 4:1, 100 µg/L cipro, pH 7.

## Findings
1. **Free chlorine present → removal ~100% and independent of velocity.** HOCl–cipro half-life ≈ 0.02 s at 3 mg/L; chloramine formation takes ~1 s, so cipro is gone first. Holds for simultaneous dosing and for staged dosing with > ~0.1 s free-chlorine contact.
2. **Pre-formed NH₂Cl → velocity is the lever.** Removal ≈ 86% at 0.003 m/s, 34% at 0.03, 5% at 0.3 (10 m tube). Most of it comes from HOCl released by NH₂Cl hydrolysis, not direct NH₂Cl attack (kCC 0→10 changes 33.0→39.6% at 0.03 m/s). More excess ammonia → less removal (Cl₂:N 4→2: 34%→14%).
3. Laminar RTD costs ~1–4 points vs plug flow. Lab coils at mL/min are always laminar.
4. High chlorine demand lowers free-chlorine removal but it stays flat with velocity (competition is over in the first second).

## Implications for experiments
- To see a velocity/contact-time effect, the chloramine arm should use **pre-formed** monochloramine.
- Injection mixing in laminar flow is an unmodelled risk: add a static mixer after each dosing point, or the tracer test will show it.
- The hydrolysis pathway depends on k_hydrolysis and excess NH₃ — measure free NH₃ in the chloramine stock.

# Final scope decision: antibiotic removal project

*Decided 2026-09-25 after deep research (4 research streams) and an advisor panel (utility engineer, AMR microbiologist, science-fair judge, devil's advocate). Full research: "Most impactful antibiotic removal setting.md".*

## Decision

**Setting: Valley Water's purified-water program. Specifically, the reverse-osmosis (RO) concentrate from the Silicon Valley Advanced Water Purification Center (SVAWPC) and the future Pure Water Silicon Valley and Palo Alto RO plants.**

**Product: a low-cost test for *residual antibacterial activity*, meaning whether treated water still kills or slows bacteria, not just whether the drug molecule is gone. The existing persulfate reactor and Bayesian optimizer become the case study the test is proven on.**

## Why this setting

- **It exists, and it's local.** SVAWPC produces up to 8 MGD. RO at about 85% recovery leaves roughly 1.4 MGD of concentrate (our estimate), and more is coming with the potable-reuse expansion (about 24,000 AFY by around 2035) and Palo Alto's $66.8M RO plant (2027).
- **The utility has named the problem itself.** Valley Water says the concentrate carries "the same contaminants as typical treated wastewater but at … approximately six times greater" concentration. It also says discharging it without further treatment "poses regulatory and environmental challenges, particularly in the Lower South Bay, where mixing and dilution are limited." Its nature-based pilots, such as wetland cells and horizontal levees, only "reduced some pharmaceuticals."
- **Antibiotic levels exceed resistance thresholds.** Bay Area effluent median ciprofloxacin is about 119 ng/L. Multiplied by 6, that is about 0.7 µg/L in the concentrate, against a resistance-selection threshold (PNEC) of 64 ng/L.
- **Nobody measures residual antibacterial activity.** Standard monitoring uses LC-MS, at $47–88 or more per sample, and only sees the parent drug. Effect-based bioassay panels have no antibacterial endpoint. California's direct potable reuse rules require a 1-log (90%) reduction of sulfamethoxazole and monthly pharmaceutical monitoring, so there is a regulatory hook.

## What the council changed (important)

1. **Valley Water's concentrate problem is mainly nutrients, metals and toxicity, not antibiotics** (utility engineer, from BACWA 2025). So the project should present antibiotics as a tracer inside a toxicity question, not claim the utility is spending money on antibiotics.
2. **Persulfate in salty concentrate can make things worse.** At high chloride, sulfate radicals form chlorinated byproducts, and toxicity rose in a 2020 study (Chem. Eng. J.) even while organic carbon fell (devil's advocate). Selling the reactor as the fix would be weak. Measuring whether this happens is exactly what the activity test is for, and it proves the "removed ≠ safe" thesis with real stakes.
3. **Concentrate is an efficient place to act, not a new source.** RO moves antibiotic into a smaller stream; it doesn't add any (microbiologist). Present it as "most grams removed per m³," not as a hotspot.
4. **At full scale, persulfate dosing looks like about $1M/yr** (engineer's rough estimate). The team should not claim the reactor should be deployed. The claim is: here is a cheap way to know whether any concentrate treatment actually removed antibacterial activity.

Split: 3 of 4 advisors picked RO concentrate with the reactor as the core. The devil's advocate picked a measurement tool instead. The final decision combines them: the tool is the product, and concentrate is the setting. The combination survives every advisor's main objection.

## Scoped project statement

> Silicon Valley's purified-water program sends RO concentrate, about six times as concentrated as wastewater, into the poorly flushed Lower South Bay, and current pilots remove pharmaceuticals only partially. Utilities track antibiotics with $50–100+ LC-MS tests that see only the parent drug, not whether the water is still antibacterial. We develop a low-cost residual-antibacterial-activity test (solid-phase extraction concentration, then an E. coli MG1655 broth-dilution assay read on our DIY photometer and calibrated in ciprofloxacin-equivalents), validate it against LC-MS through SCU, and use it to evaluate a Bayesian-optimized iron-persulfate treatment of synthetic concentrate matched to Valley Water's reported composition. Headline results: (1) the gap between chemical removal and loss of activity; (2) whether chloride-driven byproducts make treated concentrate more toxic; (3) cost per sample compared with LC-MS, and cost per m³ for treatment.

## What changes versus the current plan

| Keep | Change | Cut |
|---|---|---|
| Iron-persulfate reactor, Bayesian optimizer | Matrix: distilled water → synthetic RO concentrate (6x salts, chloride, organic carbon); plus 1 real sample if Valley Water provides one | Hospital, aquaculture and runoff framings |
| Ciprofloxacin (the photometer can read it) | Add sulfamethoxazole (named in California's DPR rules); needs a thymidine-free medium | Manufacturing effluent as its own arm (one context slide only) |
| E. coli bioassay | Upgrade to 96-well broth dilution, MG1655, cipro standard curve on every plate, quench and matrix controls | Biochar and extra compounds, unless ahead of schedule by week 14 |
| Radish assay | Becomes a secondary endpoint (non-target toxicity) | Culturing any real wastewater microbes (BSL-2) |
| Open-source toolkit | Toolkit now leads with the activity-test protocol | |

## Week-1 actions

1. **Email Valley Water's purified-water / concentrate team** (use the mini-grant contact). Ask for a concentrate composition sheet (TDS, chloride, DOC, ammonia and nitrate, Cu, Ni, any pharmaceutical data) and, if possible, a 1-L sample. Without the sheet, the synthetic recipe is a guess.
2. **Ask SCU about 5–12 LC-MS runs** for validation, and price SPE cartridges to set a realistic cost-per-sample target.
3. **Check with your SRC** that a filter-sterilized utility sample used only as a chemical matrix, plus the MG1655 assay, fits the no-preapproval tier.
4. **Reframe the mini-grant** under "prevent pollution in waterways."

## Honest limits

- The claim to make is "reviewed by a Valley Water engineer," not "adopted." Adoption within 23 weeks is unrealistic.
- The assay works at µg/L. Reaching the 64 ng/L threshold depends on SPE concentration working, which is the main technical risk. It is easier in concentrate, which is already about 6x.
- No source put a dollar figure on over-dosing waste. The money argument rests on monitoring cost (LC-MS) and on avoiding a treatment that makes the water more toxic.

## 3. The Week-2 instrument gate

This is the most important structural feature of v3. The ciprofloxacin fluorimeter (~280 nm excitation, ~450 nm emission) is the single largest line item at 30 h, it is the thing neither partner has built before, and it sits in Weeks 3–6 where a slip propagates through everything.

So it gets a gate with three off-ramps, checked in order, **decided by Friday of Week 2**:

| Off-ramp | Test | Fluorimeter cost | Plan total | Utilisation |
|---|---|---|---|---|
| **1. Borrowed instrument** | Any confirmed access to a spectrofluorometer or scanning UV-Vis | 0 h | 333 h | 80 % |
| **2. 365 nm excitation works** | Can a 365 nm LED + plastic cuvettes + 450 nm emission filter detect cipro at 20 mg/L? Cipro's main excitation is ~275–280 nm, but if a longer-wavelength shoulder gives usable signal, plastic cuvettes are fine above 300 nm and the build collapses to roughly the tetracycline photometer plus 90° geometry | ~14 h | 347 h | 84 % |
| **3. Full deep-UV build** | Deep-UV LED, quartz cuvettes, 90° geometry, emission filter, stray-light baffling | 30 h | 363 h | 88 % |
| **Fallback: tetracycline** | Triggered if 1 and 2 both fail and you judge 3 too expensive | ~14 h | 347 h | 84 % |

**Pre-committed rule:** if off-ramps 1 and 2 have both failed by Friday of Week 2, switch the target to tetracycline. Deciding this now is the entire point — by Week 5 you will have 20 h sunk in the build and will not want to walk away. The gate is worthless if it's evaluated after the money is spent.

Off-ramp 2 is worth an hour of Week 1: it is cheap to test and it would save 16 h. I'm reasoning from ciprofloxacin's absorbance structure rather than a measured excitation spectrum, so treat it as a hypothesis to test, not a fact.

| **1** | Does radish root elongation respond to untreated 20 mg/L drug, above the noise, at ionic strengths you'll actually be dosing? | Raise starting concentration; if still flat, *E. coli* becomes the in-loop objective (the Week-1 Form 6A is what makes this possible) |
| **2** | Instrument off-ramp 1 or 2 secured? | **Switch target to tetracycline.** Pre-committed |
| **4** | Do tracked hours match estimates? | Re-run the balance; start the cut ladder at item 1 if over by >20 % |
| **6** | Fluorimeter drift under 1 % over 30 min, LOD under 1 mg/L? | Extend into the W12–13 absorb weeks; if still failing at W8, tetracycline + simple photometer |
| **8** | Does the full dress-rehearsal run complete in the estimated time? | Recompute the run-hours rate and re-plan Weeks 9–21 against the measured figure |
| **13** | Does the map show *any* structure in toxicity vs. removal? | A flat toxicity axis is itself the answer to the primary question — say so plainly and shift weight to the mechanism and cost story |
| **19** | Did the searches diverge? | Either answer is the result. The pre-registration protects you; write the headline sentence both ways in advance |

## 8. What v3 does not fix

**The measurement confound is contained, not solved.** Off-ramp 3 or the tetracycline fallback both leave you with a single-wavelength readout that cannot distinguish parent drug from core-retaining fragments (audit §2.1). The spectral transformation evidence (Week 16) is a partial defence; borrowed HPLC on 10–15 samples is the real one. That ask goes out in Week 1 because it expires on lead time, and it is the difference between a fourth award and a second.

**Utilisation is 88 %, not 75 %.** With the deep-UV build this plan uses 363 of your 414 available person-hours. That is workable but it is not comfortable, and the comfort comes entirely from the off-ramps: any of them lands you at 80–84 %. If you want genuine slack, the honest lever is still the one CLAUDE.md already names — two years, with March 2027 as a partial-data entry.

**The hour estimates are still estimates.** They come from the v2 task list, which was never validated against a stopwatch. The Week-4 checkpoint is the only thing standing between these numbers and a February surprise. Track actual hours from day one.

**No mentor is confirmed.** Nothing in this plan works without a Designated Supervisor in writing, and *E. coli* additionally needs the SRC's position on Form 6A. Both are Week-1 items and neither is under your control, which is exactly why they're in Week 1.

## 1. Words used in this doc

- **The antibiotic.** **Ciprofloxacin** is the target; **tetracycline** is the pre-committed fallback if the instrument gate fails. Wherever this doc says "the antibiotic," it means whichever you ended up with.
- **Flow reactor — not a filter.** Nothing is trapped. The channels are 3.4 mm; the drug molecule is about a nanometre. Every molecule that enters leaves. It leaves *broken*. Never write "filter" anywhere.
- **Advanced oxidation.** Making radicals on purpose to tear a molecule apart.
- **Persulfate** (sodium persulfate). White powder oxidiser. Does almost nothing alone; on contact with iron it turns into radicals.
- **Radicals.** Very reactive, very short-lived. Two matter here: the **sulfate radical** and the **hydroxyl radical**.
- **Activation.** What iron does to persulfate to make radicals.
- **Transformation products.** The pieces left after the drug breaks up. Harmless or harmful — unknown without testing. This is the whole point of the project.
- **Quenching.** Killing leftover persulfate in a sample with sodium thiosulfate, so the reaction stops at the moment you sampled. Skip it and every number is wrong.
- **Fluorescence.** Some molecules glow when hit with the right light. Ciprofloxacin lit at ~280 nm glows blue at ~450 nm, and the brightness tracks concentration. Tetracycline is read by **absorbance** at ~365 nm instead.
- **Core integrity.** What a single-wavelength reading actually measures: how much of the light-active part of the molecule survives. Not the same as how much intact parent drug survives. Read §12.
- **Residence time (τ).** How long water spends inside the reactor in one pass. Measured void volume ÷ flow rate.
- **Conversion per pass (X).** The fraction of drug destroyed in one trip through the reactor. `(C_in − C_out) ÷ C_in`. This is the project's headline measurement.
- **Rate constant (k).** One number for how fast the reaction goes. From conversion and residence time: `k = −ln(1 − X) ÷ τ`.
- **Bioassay.** A test on something alive. Radish root length, and *E. coli* growth.
- **Toxicity index.** Average root length in treated water ÷ average root length in clean water. 1.0 = harmless. 0.5 = roots half as long.
- **Iron leaching.** Iron dissolving off the lattice into the water. Measured to prove the catalyst stays put.
- **Optimizer.** A program that looks at every run so far and proposes the next one.
- **Surrogate.** A model fitted to your real runs that predicts what an unrun setting would give. Lets you rehearse thousands of searches for free.
- **Pareto front.** The set of settings where you cannot improve removal without making toxicity worse. Reporting the front means never having to defend a weighting between the two.
- **Run.** One reactor experiment at one setting. Numbered R-001, R-002, …

## 2. Ground rules [BOTH]

1. One shared bound notebook lives in the lab; each partner also keeps their own. Every run gets a number used in the notebook, the spreadsheet, and on every tube.
2. One master spreadsheet is the single source of truth. **[A]** enters settings and raw readings; **[B]** enters calculated values, bioassay scores and model output. Never two copies.
3. A GitHub repo owned by **[B]**: `data/`, `notebooks/`, `hardware/`, `figures/`, `paper/`. **[A]** commits lattice files and photos.
4. A 45-minute sync the same day every week.
5. Runs happen Monday–Wednesday in batches of three or four. Bioassay dishes go in Wednesday, roots are scored the following Monday. **Hard ceiling of 5 reactor runs a week** — that is what 3 lab days allows.
6. The hypothesis and *both* possible conclusions go in writing before the first run. "If the two searches differ, removal is a misleading number for this chemistry. If they agree, removal is a valid safety proxy here." This is what makes a null result respectable instead of a disappointment.
7. Failed runs stay in the spreadsheet marked `failed` with the reason, and get redone under a new number. **Never delete data.**
8. Every optimizer proposal is committed to the repo with a timestamp **before** it is run.

## 4. The standard run — read this before any other protocol

Every experiment follows this unless a protocol says otherwise. **This is the step that changed most**, because samples now come from the reactor outlet rather than the reservoir.

### Why it changed

The old recipe recirculated 500 mL and watched the concentration fall over 30 minutes. The problem: at a 20-minute residence time the pump only moves ~53 mL in half an hour, so **90 % of the batch never enters the reactor at all**. Measured "removal" would then be capped at about 10 % for plumbing reasons, and 65 % at the fastest setting — a 6.5-fold swing across the residence axis that has nothing to do with chemistry. The optimizer would have learned that short residence times work well, which would have looked like a result and been an artifact.

Sampling the outlet measures **how much is destroyed in one pass through the reactor**, which is a real property of the reactor and does not depend on batch size or how long you let it run.

### The recipe

1. **Prepare the feed.** 500 mL distilled water in the reservoir. Add the antibiotic to 20 mg/L. Adjust pH with drops of dilute HCl or NaOH to this run's value. Record the **measured** pH, not the intended one.
2. **Install the lattice** with the standard iron loading. Record `lattice_id` and its mass.
3. **Set the pump** to the speed giving this run's residence time, from your flow table. `residence_min = void_volume_mL_measured ÷ flow_mL_min`.
4. **Take the inlet zero sample** — 3 mL from the reservoir tap, before any persulfate. Quench, filter, read. This is C₀.
5. **Start.** Add the persulfate (10 mM = 1.19 g per 500 mL; 0.5 mM = 0.06 g). Swirl until dissolved. Start the pump and the timer.
6. **Let it reach steady state.** Wait **three residence times** before the first real sample. At τ = 2 min that's 6 minutes; at τ = 20 min it's an hour. Plan the day around the slow settings.
7. **Take paired samples** at three time points after steady state, roughly 5 minutes apart: one from the **reservoir tap (inlet)** and one from the **reactor outlet tap**, as close to simultaneous as you can manage. Quench and filter both. Six tubes per run.
8. **Conversion per pass** `X = (C_in − C_out) ÷ C_in` for each pair. The three values should agree within a few percent. If they drift downward, the catalyst is deactivating during the run — write that down, it's a real observation.
9. **Iron sample.** At the end, 5 mL from the outlet for the leaching test (every third run, and every durability run).
10. **Bioassay sample.** The **outlet** sample is the treated water. That is what goes on the radish dishes and into the bacteria tubes. Never the reservoir — at low flow the reservoir is mostly untreated water, and testing it would report dilution as safety.
11. **Shut down.** Pump the reservoir into the already-quenched waste carboy. Rinse the loop twice with tap water. Remove, rinse, dry and label the lattice.
12. **Record everything**, including anything odd — leak, colour change, bubbles, pump noise.

**Calculations [B]:** convert every reading to concentration from the calibration line; `X` per pair, then the run's mean X; `k = −ln(1 − X) ÷ τ`; toxicity index after five days.

## 5. Build protocols

### 5.1 Steel-wool catalyst [A]

1. Cut grade-0000 steel wool into 1 g pieces. Weigh each on the balance and write the mass on a labelled bag.
2. Soak in ethanol 5 minutes to remove the factory oil. Dip in 0.5 M HCl for 30 seconds to strip the surface. Rinse three times in distilled water. Pat dry.
3. Use within an hour or it rusts unevenly.
4. Thread through the lattice channels and reweigh the lattice. The difference is your iron loading.

Iron mass is **fixed** for the whole project at the value chosen after the baselines. Load every lattice to the same mass, within ±5 %.

*Why wool and not a dip-coated channel:* in this reactor the water creeps rather than mixes (Reynolds number 0.3 to 7), so molecules only reach the iron by drifting. Across an open 3.4 mm channel they mostly don't. The wool fibres shrink that distance into a range that works. This is a testable prediction — wool should beat a bare coated channel at equal iron mass.

### 5.2 Lattice [A]

1. In Fusion 360 or Tinkercad: a **23 mm** diameter × 80 mm cylinder with a gyroid or cross-hatch pattern, about 60 % open.
2. Add **integral collar rings, 2 mm thick, at 24.6 mm outside diameter** — a few along the length. These block the gap between the lattice and the 25 mm tube wall. Without them almost half the water slides past the iron down the smooth outer gap.
3. Print in PETG. It resists acid better than PLA. Print four.
4. Check it slides into the tube with the collars just touching.

Gyroid is preferred over cross-hatch: more surface area, and shorter distances for molecules to drift to the iron.

*Worth revisiting:* pressure drop across the lattice is about 0.04–0.43 Pa — roughly the weight of a hair. The pump will not notice it. The 60 % porosity was inherited, not calculated, and there is four orders of magnitude of headroom, so a denser lattice with finer features would cost nothing hydraulically and would give more iron and shorter drift distances. Decide before printing the final set.

### 5.3 Reactor loop [A]

1. Reservoir: 1 L glass bottle, lid drilled for two tubing lines.
2. Reservoir → 12 V peristaltic pump → **bottom** of the reactor tube → out the **top** → back to the reservoir. Feeding from the bottom keeps air from pocketing in the lattice.
3. Reactor body: clear PVC or acrylic, **25 mm inside diameter**, 100 mm long, threaded or push-fit cap each end with a hose barb.
4. **Two sampling taps, not one.** A T-fitting with a tap on the reservoir line (inlet), and a second on the outlet line as close to the reactor as possible.
5. Fill with tap water and run two hours. Fix every leak before going further.
6. **Flow table:** run the outlet into a measuring cylinder for exactly 60 seconds at each of three pump settings. Repeat each three times. Record mL/min.

### 5.4 Void volume [A]

Do this once per lattice geometry, with the lattice fitted.

1. Assemble the reactor dry with the lattice inside, caps on.
2. Fill it completely from a graduated syringe, counting the millilitres that go in.
3. Repeat three times and average. Expect roughly **35 mL**, not the 49 mL of the empty tube.
4. Record as `void_volume_mL_measured`. Every residence time in the project comes from this number.

### 5.5 Detector [B]

**First: try to avoid building one.** A borrowed spectrofluorometer or scanning UV-Vis is worth about 30 hours. Ask universities, community colleges, and water-district labs.

**Second: try the easy build.** Before committing to deep UV, test whether a **365 nm LED** excites enough fluorescence from ciprofloxacin at 20 mg/L to read at 450 nm. Cipro's strongest excitation is around 275–280 nm, but if a longer-wavelength shoulder gives usable signal, you can use plastic cuvettes and an ordinary LED, and the build collapses to roughly the tetracycline instrument plus a filter. **This is untested — it is a hypothesis to check in an hour, not a fact.** If it works it saves about 16 hours.

**Ciprofloxacin, fluorescence (the full build):**
1. The ~280 nm UV-C LED shines into the cuvette from the side. The TSL2591 sits at **90°** behind a ~450 nm filter, so it sees the glow and not the lamp.
2. **Quartz cuvettes.** Plastic is opaque below ~300 nm.
3. Fully enclose the LED. It is an eye and skin hazard.
4. Baffle everything. Stray light is the main failure mode of a 90° instrument — matt black inside, and a light trap opposite the LED.
5. Fixed-current resistor on the LED so brightness never drifts with battery state.
6. Arduino: LED on, wait 1 s, read the sensor 10 times, print the average. Python on the laptop logs it.
7. Fluorescence *rises* with concentration, unlike absorbance.

**Tetracycline, absorbance:** 365 nm LED and TSL2591 in a straight line through a plastic cuvette. `Absorbance = log₁₀(blank reading ÷ sample reading)`.

**Validation, either build:**
- Blank cuvette, one reading a minute for 30 minutes. Drift must be under 1 %. If not, warm the LED 5 minutes before every use.
- Linearity across a dilution series. For fluorescence, find where the line stops being straight and stay below it.
- Dark current with the LED off.
- Detection limit = 3 × (standard deviation of blank readings) ÷ slope. Target under 1 mg/L.

**Record the full spectrum for every sample** if the instrument can scan. Not just one number. See §12.

## 6. Measurement protocols

### 6.1 Calibration curve [B]

1. Stock: 0.010 g antibiotic in 100 mL distilled water = 100 mg/L. Keep it dark — these drugs break down in light. Make fresh weekly.
2. Dilute to 0, 2, 5, 10, 20, 40 mg/L in pH 7 phosphate buffer.
3. Read each three times. Plot signal against concentration and fit a line, staying inside the straight region.
4. Compute the detection limit.
5. Re-run a mid-range standard at the start of every lab day as a drift check.

### 6.2 Interference check [A]

Read, the same way you read samples: (a) 10 mM persulfate in water; (b) water pumped through an iron-loaded lattice with no persulfate, then filtered; (c) quench solution diluted as it will be in a sample.

Anything giving more than ~2 % of your lowest standard means every sample needs a matched blank. For cipro also check whether dissolved iron *quenches* the fluorescence — if it does, the 0.45 µm filter plus the leaching data cover you, but you need to know.

**Spike recovery:** add a known amount of antibiotic to reactor effluent and read it back. You want 85–115 %. If not, the blanks are wrong.

### 6.3 Sampling and quench card [BOTH]

Write this on a card and tape it above the bench.

1. Open the tap; collect **3 mL** in a labelled tube. Inlet and outlet are separate tubes, labelled.
2. Immediately add **0.3 mL of 0.4 M sodium thiosulfate**. Cap, invert twice.
3. Push through a 0.45 µm syringe filter into a clean tube.
4. Read within 10 minutes.
5. **Measure conductivity** and record it.
6. Freeze the remainder, labelled with run number, tap, and time.

**Why 0.4 M and not 1 M.** At the highest persulfate setting a 3 mL sample holds 30 µmol of persulfate, and the reaction needs 2 thiosulfate per persulfate, so 60 µmol does the job. The old recipe added 300 µmol — five times more than needed — which loaded every sample with about 270 mOsm of salt. Salt stunts radish roots on its own, in every dish including the controls, which flattens the whole assay. And because the leftover varies with the persulfate setting, Search B would have learned "less persulfate is safer" when it was really reading salt. 0.4 M gives a 2× safety margin at the worst case and 2.5× less salt. Conductivity on every sample is how you prove the remaining effect isn't ionic.

### 6.4 Iron leaching [A]

1. Reagents: 0.1 g 1,10-phenanthroline in 100 mL water with a few drops of HCl; hydroxylamine solution (10 g in 100 mL); acetate buffer pH 4.5.
2. Calibration: iron(II) sulfate at 0, 0.5, 1, 2, 5 mg/L. To 5 mL of each add 0.5 mL hydroxylamine, 1 mL buffer, 1 mL phenanthroline. Wait 10 minutes. Read at 510 nm — it goes orange-red. Plot the line.
3. Treat the end-of-run outlet sample identically.
4. Run this on **every third run and every durability run** — you need the trend, not 47 points.
5. If cumulative leached iron exceeds 10 % of what you loaded, the iron is dissolving rather than working as a fixed catalyst. Say so; it is an honest and interesting result.

### 6.5 Radish bioassay [B]

1. Filter-paper circle in a Petri dish. **20 radish seeds** spread evenly.
2. Add exactly **5 mL** of test water — the thawed, quenched **outlet** sample.
3. Cover and label. Three days in a dark drawer, then two days under a lamp or window, at room temperature.
4. Day 5: count how many sprouted, and measure every root with a ruler, or photograph beside a ruler and measure on screen.
5. **Three dishes per sample**, so you get a spread and not just a number.
6. **Controls in every batch, three dishes each:** distilled water · untreated 20 mg/L antibiotic · quench-only water (distilled water through the full quench step).
7. `Toxicity index = mean root length in test water ÷ mean root length in distilled water`. Also report it against the quench-only control.

**The salt calibration series — do this once, early.** Set up dishes across a range of Na₂SO₄ concentrations spanning the ionic strengths your samples will actually have, measured as conductivity. This gives you a root-length-versus-salt curve, so any toxicity you report can be shown to be *chemical* and not osmotic. It costs one afternoon of Petri dishes and it converts a reviewer's strongest objection into a covariate you have already handled.

### 6.6 *E. coli* bioassay [B] — with the biology teacher

Needs Form 6A, BSL-1 conditions and a Designated Supervisor. Start the paperwork early; it cannot be compressed later.

1. Grow *E. coli* K-12 overnight in nutrient broth at 37 °C.
2. Dilute with fresh broth until faintly cloudy.
3. In sterile tubes, mix 1 mL of that with 1 mL of test water. Three tubes per sample.
4. Controls: distilled water · untreated antibiotic · quench-only water.
5. Incubate 6–8 hours at 37 °C.
6. Read cloudiness at 600 nm. `Growth % = reading ÷ distilled-water reading × 100`.
7. Low growth means the water still behaves like an antibiotic — still applying the pressure that breeds resistance.
8. Bleach every tube (10 %, 30 minutes) before disposal.

This is the endpoint the project's motivation is actually about, and it is also your insurance: if radish turns out not to respond, this becomes the in-loop test instead.

### 6.7 Radical scavenger tests [A] run, [BOTH] interpret

Four runs at the best settings found in the mapping block.

1. **Normal** — the control.
2. **tert-Butanol**, 100 mM (≈ 4.7 mL in 500 mL), added before the persulfate. Soaks up hydroxyl radicals only.
3. **Methanol**, 100 mM (≈ 2.0 mL), instead. Soaks up both hydroxyl and sulfate radicals.
4. **Nitrogen purge** — bubble nitrogen through the reservoir 15 minutes before and during the run. Removes dissolved oxygen.

Compare k. If methanol slows things much more than tert-butanol, the **sulfate radical** is doing most of the work. If nitrogen barely matters, oxygen isn't involved. Write one paragraph on what you found and why it might affect which fragments form. Both partners rehearse saying it out loud — this is a favourite judging question.

### 6.8 Dye-pulse residence time test [A]

One afternoon, and it checks whether water really flows the way the model assumes.

1. With the reactor running on clean water at a known pump setting, inject a small slug of food colouring at the inlet.
2. Film the outlet with a phone.
3. Time when colour first appears, when it peaks, and when it clears.

First appearance much earlier than the calculated residence time means some water is short-circuiting. A long tail means dead zones. This is real measured evidence about the reactor, and at a fair, measured beats simulated. It is also why the project is not doing CFD: the arithmetic already found the problems worth finding, and unvalidated simulation is a liability the first time a judge asks about mesh independence.

- Distilled water — roots should grow normally.
- Untreated 20 mg/L antibiotic — roots should grow poorly, proving the assay can detect the drug at all.
- Quench-only water — proves the thiosulfate itself is harmless at 0.4 M.
- Persulfate-only and iron-only baselines — prove both are needed.
- Matrix-only water, untreated, for the real-water runs.
- A mid-range calibration standard at the start of each lab day.

|---|---|---|
| Dye practice | 3 | no |
| Antibiotic baselines (synergy figure) | 4 | no |
| **Round-one map** | **12** | **yes** |
| **Radical scavengers** | **4** | **yes** |
| **Physical searches** (3 rounds × 2 proposals × 2 optimizers) | **12** | **yes** |
| **Confirmation** | **6** | **yes** |
| Durability | 4 | no |

If you fall behind, cut in this order: real water → durability 4→2 → *E. coli* 6→3 → the PLS soft sensor → baselines 4→3. **Never cut** the 34 protected runs or the in-silico study.

---

## 11. Risks and fallbacks

| Risk | Early sign | Fallback | Owner |
|---|---|---|---|
| Radish can't tell treated from untreated | Week-1 pilot: index 0.95 ± 0.08 on untreated drug | Raise starting concentration; extend to 7 days; if still flat, *E. coli* becomes the in-loop test | [B] |
| Can't measure ciprofloxacin cheaply | No borrowed instrument, 365 nm excitation fails | **Pre-committed:** switch to tetracycline. Decided by Friday of the gate week, not later | [BOTH] |
| Detector can't reach low concentrations | Detection limit > 2 mg/L | Borrow an instrument weekly; start runs at 40 mg/L | [B] |
| Persulfate or iron interferes with the signal | Interference check | Matched blanks; spike recovery; filter before reading | [A]+[B] |
| Toxicity signal is really just salt | Conductivity correlates with toxicity index | The Na₂SO₄ curve lets you regress it out; report both | [B] |
| Iron dissolves rather than catalysing | > 10 % leached | Report dissolved vs. attached share honestly; it is a real finding, not a failure | [A] |
| Water short-circuits past the lattice | Dye appears at the outlet far too early | Check collar fit; reprint with more collars | [A] |
| Optimizer proposes something unsafe | Any proposal week | Tighter limits, supervisor sign-off before running | [BOTH] |
| Both searches agree | Confirmation week | Pre-written null framing; the map carries the poster. Do not spin it | [BOTH] |
| Surrogate doesn't predict held-out runs | In-silico week | Report the model's limits; the physical searches still stand on their own | [A] |
| A partner falls behind | A missed sync | Rebalance at the sync, out loud, never silently | [BOTH] |

---

## 12. The honest weakness, and what to do about it

A single-wavelength reading measures **how much of the light-active part of the molecule survives** — not how much intact drug survives. Ciprofloxacin's first and most common fragments keep the quinolone core, which is exactly why it was chosen (those fragments stay antibacterial, so the two searches have the best chance of diverging). But that same core is what glows. So a fragment can read as parent drug.

Worse, the confound points the same way as the other axis: core intact means **still fluorescent** *and* **still antibacterial**. Your removal number and your *E. coli* number are partly measuring the same thing, which could manufacture or mask the headline correlation.

Three defences, all in the plan:

1. **Save the whole spectrum, every sample.** A change in its *shape* — a shifted peak, a changed ratio between two wavelengths — is evidence that transformation happened, without identifying anything. This is why spectra moved from optional to required.
2. **Borrow HPLC or LC-MS for 10–15 samples** spanning the design space, and plot them against your own instrument. This is the real answer, and the ask has to go out in the first week because lead times are long.
3. **Lean on the biology.** What a radish root or a bacterium does in the water is a direct measurement of effect, not a proxy for composition.

The sharpened way to state the hypothesis, which turns the weakness into a prediction: core integrity *should* predict residual antibacterial activity — so expect the *E. coli* endpoint to agree with removal and give you a null — and *should not* predict ecotoxicity, so the radish endpoint is where any divergence will live. Writing that down in advance is what separates a pre-registered prediction from a post-hoc explanation.

**Say this out loud at judging before you're asked.** "We measured what the water does, not what's in it" is a strong sentence when you volunteer it and a weak one when it's dragged out of you.

# Feasibility and Competitiveness Audit

Captured 2026-09-12. Companion to `claude/reactor-findings-and-open-decisions.md` and `claude/schedule-v2-23-weeks.md`.

**Read before Week 1 ends.** Four of the seven recommended changes are free, and three of them expire (they are week-1 or week-2 actions whose value collapses by Week 6).

---

## 1. Verdict

**Competitive:** Yes as an idea, conditionally as an execution. The framing (bioassay inside the loop, pre-registered map, Pareto front instead of a defended λ, timestamped proposals, honest novelty statement) is above the level of most high-school work, and `reactor-findings-and-open-decisions.md` — finding the bypass annulus and the recirculation ceiling by arithmetic before building — is itself a judging asset. At Synopsys this should place and advance. At ISEF the ceiling is set by one thing only: whether "percent removed" survives the first analytical question. Right now it does not.

**Feasible:** Not as written. The science is feasible at roughly 65 % of the planned scope. The plan is ~30–40 % over capacity with zero buffer, and the two highest-risk assumptions are tested at Weeks 7–8, by which point five months of build work is already sunk in them.

---

## 2. The headline figure has three confounds

The whole project reduces to one graph: toxicity index (y) against % removal (x), ~40 points. Three separate mechanisms can put structure in that graph with no chemistry involved.

### 2.1 The removal axis does not measure the drug (most serious)

A single-wavelength fluorescence readout (~280 ex / ~450 em) measures *quinolone-core-containing species weighted by quantum yield*, not ciprofloxacin. The first and most abundant AOP transformation products of ciprofloxacin come from piperazine-ring modification and retain the core — which is exactly why cipro was chosen on 09-10 (TPs stay antibacterial, so the searches can diverge). The same retention means those TPs keep fluorescing. So the instrument reports the drug as still present when it has in fact been transformed.

This is worse than ordinary measurement error, because it is **correlated with the other axis**. Core intact → still fluorescent *and* still antibacterial. Fluorescence-removal and *E. coli* inhibition are therefore not two independent measurements; they are two proxies for the same latent variable. That can manufacture the headline correlation or mask it, and there is no way to tell which from the data as planned.

A judge with any analytical chemistry background asks "how do you know that's the parent and not a fragment absorbing at the same wavelength?" in the first two minutes. "No LC-MS required" is recorded in the decision log as a feature; at CSEF/ISEF it is the single biggest liability.

*Note:* the same logic applies to tetracycline at 365 nm (naphthacene core), so switching the target does not escape it.

**Fixes, cheapest first.**
- **Record the full spectrum on every sample, not one number.** A shift in the absorbance ratio (e.g. 275/320) or in the emission peak position is evidence that what remains is not parent, without identifying anything. This costs nothing if the instrument can scan, and it turns the weakness into a figure.
- **Promote the spectral soft sensor from bonus to core.** Its real job is not "predict radish from spectrum" — it is "prove spectrally that transformation occurred." Reframed that way it defends the headline instead of decorating it.
- **Beg 10–15 samples of HPLC time.** A community college, a university outreach lab, or a water-district analytical lab (Valley Water, SFPUC) — 15 samples spanning the design space, run against the photometer, produces a validation figure that answers the killer question outright. Week 1 already has "email two university labs"; upgrade that from optional to gating and widen the list. Lead times are long; this ask expires.

### 2.2 The removal axis is hydraulically confounded

Already documented as §2.3 of the reactor findings and still open. The measurable ceiling moves 6.5-fold across the residence-time axis for purely hydraulic reasons. Unresolved, this alone puts a strong false trend in the x-axis. **Decide it in Week 4 as scheduled** — outlet sampling (option a) is the cleanest and also makes "removal %" mean something independent of batch size.

### 2.3 The toxicity axis is osmotically confounded

Arithmetic on the current quench card: 3 mL sample + 0.3 mL of 1 M sodium thiosulfate = ~90 mM thiosulfate in the sample, roughly **270 mOsm** of added salt before the sample's own sulfate is counted. The persulfate stoichiometry needs 2 mol thiosulfate per mol persulfate, so at the highest dose (10 mM in 3 mL = 30 µmol) only 60 µmol is required; 300 µmol is being added — five times the stoichiometric need.

Two consequences:

- **Dynamic range collapse.** Radish root elongation is salt-sensitive (I believe noticeable inhibition begins around 50–100 mM NaCl, i.e. 100–200 mOsm — *not verified, confirm in your own pilot*). At ~270 mOsm every dish is suppressed, including controls, so a toxicity index defined against distilled water sits near the bottom of its range for all runs and the TP signal has to be read out of the noise on a crushed baseline.
- **A false trend.** The variable part (persulfate-derived sulfate, ~1.5 to 30 mOsm across the dose axis) modulates the ionic load by ~10 %, tracking one of the optimizer's four axes. Search B would then "learn" that less persulfate is safer — an osmotic artifact reported as the project's headline finding.

**Fixes.** Drop the quench to 0.3 mL of **0.4 M** thiosulfate (same volume, 2× stoichiometric at the highest dose, 2.5× less salt). Run a one-off **Na₂SO₄ dose-response on the radish assay** so the ionic contribution can be regressed out rather than hoped away — one afternoon of Petri dishes, and it converts a reviewer's objection into a covariate. Measure conductivity on every bioassay sample. Keep the quench-only control, but report the toxicity index against *both* distilled water and the quench-matched blank.

### 2.4 Why this matters together

Three independent mechanisms, each capable of producing "high removal coincides with high toxicity" with no transformation-product chemistry involved. All three are cheap to fix now and expensive to fix after Week 10. This is the honest answer to "is it feasible": the experiment is feasible, the *inference* currently is not.

---

## 3. The ML claim is underpowered as scheduled — and the fix is free

Schedule v2 gives each search 3 rounds × 2 proposals = 6 physical points, plus the shared 10-run map. That is ~16 observations in a **4-dimensional** space — roughly two points per dimension. Below that density Bayesian optimization does not measurably beat random search, and a judge who has run BO will say so. Claim 3 in the overview ("~25 experiments vs. far more for grid search") cannot be demonstrated from 12 search runs at all.

Three changes, in order of leverage:

1. **Run the optimizer comparison in silico.** Fit a surrogate to the physical map + search runs, then run Search A and Search B 500 times each on it with different seeds. That produces the learning-curve claim *with error bars*, which 12 physical runs never will, and the physical runs become validation of the surrogate's predictions. This is standard practice, costs compute rather than lab time, and — critically — **decouples the ML thesis from lab throughput**, so a delayed build costs resolution instead of the whole claim. Highest-value single addition to the project.
2. **Cut to three factors.** Fix iron mass at one value validated in the baselines (the mass-transfer finding in §2.4 of the reactor doc already predicts steel wool at a given mass, so this is defensible on mechanism, not convenience). 16 points in 3D is arguable; in 4D it is not.
3. **Delete the 6 physical grid runs and reinvest them.** Six points in a 4-factor space is not a grid and proves nothing about grid-vs-BO; do that comparison in silico on the validated surrogate. With durability trimmed 6→4, that frees 8 runs → searches go from 12 to 20, i.e. **5 rounds each**. Five rounds is enough to show learning. This trade is strictly better than the current allocation.

---

## 4. What the A-vs-B comparison actually proves

Search B optimizes removal *and* toxicity; of course its chosen point is less toxic. A sharp judge will call the secondary outcome definitionally true. The real question is the **magnitude of the trade-off**, which is the shape of the Pareto front.

The decision log already has this right (primary outcome = the map), but the poster sentence and the "headline" in `project-overview.md` both lead with the duel, which is the weaker claim. Lead with the map instead, and quantify it: Spearman ρ between removal and toxicity across the design space, plus the fraction of the space where high removal coincides with high toxicity. The A/B duel is the *demonstration*; the correlation is the *finding*.

**Sharper pre-registered hypothesis**, given §2.1: fluorescence-removal is a proxy for core integrity, so predict that core integrity (a) *does* predict residual antibacterial activity and (b) *does not* predict ecotoxicity. That is a hypothesis that forecasts its own results, which is what pre-registration is supposed to look like, and it assigns the two endpoints distinct jobs rather than treating them as interchangeable. It also implies the AMR endpoint will likely produce a **null** and the ecotox endpoint is where divergence lives — which is an argument for keeping radish in the loop, provided it responds at all (see §5).

---

## 5. Where the schedule actually breaks

Run execution is estimated honestly: ~2 person-hours per run × 56 runs is consistent with the procedure as written. The overrun is not there. It is in Weeks 1–8.

- The **fluorescence reader is a much harder build than the absorbance one**: ~280 nm excitation means a deep-UV LED, **quartz cuvettes** (plastic is opaque below ~300 nm), 90° geometry, an emission filter, stray-light control, and a detector with real sensitivity at 450 nm. 12 h is not a realistic estimate for a first build; 25–40 h is. Tetracycline at 357–365 nm needs a cheap LED and plastic cuvettes. **The 09-10 ciprofloxacin decision was made on good chemistry and may not have been priced for instrumentation.** Revisit it in Week 2 with an explicit decision rule, not by drift.
- First-time hardware generally runs 1.5–2× estimate. Applied to Phases 1–2 (~99 h combined) that is +50–100 h, or 5–10 of your 23 weeks, against **zero buffer**. The failure propagates to the search rounds, which are the one thing the schedule says never to cut.
- **Procurement risk:** ciprofloxacin is a prescription drug. An analytical standard needs a school or institutional account; tetracycline HCl is trivially available as an aquaculture product. This gates Week 2 and should be checked in Week 1.
- **Paperwork:** no Designated Supervisor or Qualified Scientist in writing, and *E. coli* K-12 needs Form 6A plus BSL-1. If the AMR endpoint becomes primary, this is gating and the clock starts now.

---

## 6. The two pilots that should move to this week

Both currently sit at Weeks 5–8. Both need no reactor, no lattice, and no optimizer, and both can invalidate the architecture.

1. **Radish dose-response to the chosen antibiotic.** Petri dishes, seeds, a dilution series of the parent drug, plus the Na₂SO₄ salt series from §2.3. If untreated 20 mg/L drug gives a toxicity index of 0.95 ± 0.08, the in-loop objective is noise and the whole design changes. The Week-8 checkpoint in CLAUDE.md already names this as the thing everything downstream depends on — which is precisely the argument for testing it in Week 1 instead of Week 8. Cost: a few dollars and five days of waiting.
2. **Readout feasibility on the chosen antibiotic.** Can the available instrument see it at all, at the concentration and in the matrix planned? This decides ciprofloxacin vs. tetracycline, and it decides whether the reader needs building at all.

---

## 7. Seven changes, ranked, with deadlines

| # | Change | Deadline | Cost | What it buys |
|---|---|---|---|---|
| 1 | Radish dose-response + salt series pilot | Week 1 | ~$10, 5 days | Kills or confirms the in-loop objective before five months are sunk in it |
| 2 | HPLC/LC-MS validation ask out to 5+ labs | Week 1 | 3 h of email | The difference between 4th and 2nd award; expires on lead time |
| 3 | Record full spectra, not single wavelengths; soft sensor → core | Week 2 | ~0 | Spectral evidence of transformation; defends the headline |
| 4 | In-silico BO study (500 seeds on a validated surrogate) | Week 13 | compute only | Learning-curve claim with error bars; decouples ML thesis from lab delays |
| 5 | Quench to 0.4 M; conductivity on every bioassay sample | Week 2 | ~0 | Removes the osmotic confound and its false trend |
| 6 | Cut grid runs (−6), durability 6→4 (−2); searches 12→20 | Week 13 | ~0 net | 5 BO rounds instead of 3 |
| 7 | Four factors → three (fix iron mass) | Week 8 | ~0 | Point density that makes BO defensible |

Changes 3, 5, 6 and 7 are free. Changes 1 and 2 expire. Change 4 is the one that protects the thesis when the schedule slips, which it will.

---

## 8. Minimum viable project

If the build overruns as expected, the version that still wins at Synopsys is: working reactor, ~25–30 runs, three factors, one in-loop bioassay with demonstrated dynamic range, the removal-vs-toxicity map with a real correlation coefficient and its confounds addressed, the in-silico optimizer study, scavenger mechanism evidence, and the cost model. That is ~60–65 % of the planned lab hours and loses nothing essential. Durability, real water, and the physical grid are all nice-to-have.

---

## 9. What is asserted here vs. verified

**Arithmetic, reliable:** thiosulfate molarity and osmotic load; persulfate stoichiometry; point-density-per-dimension counts.

**Chemical reasoning, confident but not checked against a specific paper:** that piperazine-modified ciprofloxacin TPs retain fluorescence; relative quantum yields are unknown to me. Worth 20 minutes with the Paul et al. *Water Research* paper already in the source list.

**From memory, verify with your own pilot:** radish salt-inhibition thresholds (~50–100 mM NaCl), and fluoroquinolone phytotoxicity ranges. Pilot 1 measures both directly, which is the point of running it first.

**Judgement, not fact:** the award-tier estimates, and the 1.5–2× overrun multiplier on first-time hardware.

# Reactor findings and open decisions

Captured 2026-09-12, from the lattice design session. Companion to `claude/lattice-build-guide.md`.

**Read this before Week 4.** Three of the five findings below change how runs are set up or measured, and all three are cheap to act on now and expensive after Week 10.

---

## 1. Terminology — it is not a filter

The device does not separate or trap anything. Channels are 3.4 mm; the antibiotic molecule is roughly a nanometre. Every molecule that enters leaves. The antibiotic is **destroyed** into fragments that flow out with the water.

Correct terms: *advanced oxidation*, *flow reactor*, *catalyst support* (the lattice). Avoid "filter" and "filtration" everywhere — poster, abstract, talk, spreadsheet headers.

This matters beyond vocabulary. A filter has no toxicity question, because the drug leaves intact and captured. Destruction produces fragments nobody has characterised, and whether those fragments are safe is the project's entire hypothesis. Describing it as filtration describes a project without a hypothesis.

---

## 2. Findings

### 2.1 Bypass around the lattice — FIXED

A 20 mm lattice in a 25 mm bore leaves an annulus of 176.7 mm², against 188.5 mm² of open lattice face. The annulus is smooth-walled and lower-resistance, so ≥48 % of flow would bypass the iron. Consequences would have been an inflated apparent residence time, a compressed iron-loading effect in the Week 16 SHAP analysis, and a bypass fraction that rises with flow — aliasing into the residence-time axis.

**Resolution:** 23 mm core with integral 2 mm collar rings at 24.6 mm OD. Annular leak path drops from 176.7 mm² to about 1.5 mm².

### 2.2 Reactor void volume — FIXED

`team-roadmap-v2.md` Week 4 uses "reactor volume (~50 mL)". That is the empty tube (49.1 mL). With the lattice fitted the void is **35.4 mL** (gyroid) or **36.2 mL** (cross-hatch). Residence times computed from 50 mL are ~41 % too high.

**Action:** measure it directly with the lattice fitted, record as `void_volume_mL_measured`, and compute `residence_min` from that.

### 2.3 Recirculation starves the batch at low flow — OPEN

The loop recirculates a 500 mL batch (inferred from persulfate dosing: 1.19 g Na₂S₂O₈ per 500 mL = 10 mM) for 30 minutes.

| Residence | Flow | Pumped in 30 min | Batch turnovers | Max removal if reactor is perfect |
|---|---|---|---|---|
| 2 min | 17.7 mL/min | 531 mL | 1.06 | 65 % |
| 5 min | 7.1 mL/min | 212 mL | 0.42 | 35 % |
| 10 min | 3.5 mL/min | 106 mL | 0.21 | 19 % |
| 20 min | 1.8 mL/min | 53 mL | 0.11 | 10 % |

At 20 min residence, 90 % of the batch never enters the reactor during the run.

**Why this is dangerous:** the ceiling on measured removal moves 6.5-fold across the residence axis for purely hydraulic reasons. The optimizer would discover that short residence times give high removal, which looks like a chemistry result and is not. It also contaminates the toxicity axis, since radish dishes are set up from the same reservoir samples — low-flow runs would read as both less effective and less toxic through dilution alone.

**Options:** (a) move the sampling tap to the reactor outlet and measure single-pass conversion — cleanest, independent of batch size and run length, but redefines "removal %"; (b) shrink the batch to ~150 mL; (c) run to fixed throughput rather than fixed time — cleanest comparison, but low-flow runs take hours.

### 2.4 Mass-transfer limitation — OPEN

Reynolds number in the lattice is **0.3 to 7** across the whole operating range. Creeping, laminar flow with no turbulent mixing, so molecules reach the iron only by molecular diffusion.

Diffusive penetration in one pass versus the distance that must be crossed (D assumed 5×10⁻¹⁰ m²/s for a ~450 Da molecule):

| | penetration/pass | half-gap | stream reaching iron |
|---|---|---|---|
| Cross-hatch, 2 min | 0.19 mm | 1.70 mm | ≤ 11 % |
| Gyroid, 2 min | 0.26 mm | 1.25 mm | ≤ 21 % |
| Gyroid, 20 min | 0.82 mm | 1.25 mm | ≤ 66 % |
| Channel packed with steel wool | 0.19 mm | ~0.15 mm | fully contacted |

**Consequences.** Steel wool is mechanistically favoured over a bare dip-coated channel, because the fibres shrink the diffusion distance into the range that works. This is a falsifiable prediction testable in Week 6 at equal iron mass. The gyroid also beats the cross-hatch here, independently of its surface-area advantage.

**Caveats:** D is estimated from molecular weight, not looked up for the specific antibiotic; the penetration argument is order-of-magnitude; transverse struts induce some cross-flow; even flow distribution across the face is assumed and unverified.

### 2.5 Pressure drop is negligible — OPPORTUNITY

0.04–0.43 Pa across the lattice (about 0.04 mm of water), by both square-duct and Kozeny–Carman estimates. The pump will not notice the lattice.

The 60 % porosity was inherited from the roadmap, not derived. With four orders of magnitude of pumping headroom, a denser lattice — finer features, more surface area, more iron, shorter diffusion distances — costs nothing hydraulically. Worth revisiting.

---

## 3. Decision on simulation

**Do the cheap physics; skip CFD.** Order-of-magnitude and dimensionless analysis found §2.1, §2.3, §2.4 and §2.5 in about an hour of arithmetic. 3D CFD would take 30–40 hours to reproduce §2.4 and nothing else — creeping flow through a periodic structure is the most predictable regime in fluid mechanics, and meshing a gyroid is unpleasant.

Unvalidated CFD is also a liability at judging: the first judge who has run it asks about mesh independence and boundary conditions.

**Do instead:** a dye-pulse residence time distribution test. Inject food colouring, film on a phone, time the washout. One afternoon, real hardware, and it validates or kills the model above. Measured beats simulated at a fair.

Revisit CFD only in Phase 5, only if there is spare time, and only with dye data to validate against.

---

## 4. Open decisions

| Decision | Deadline | Notes |
|---|---|---|
| Sampling point: reservoir or reactor outlet | Week 4 | Determines what "removal %" means; §2.3 |
| Batch volume: 500 mL or ~150 mL | Week 4 | §2.3 |
| Porosity: keep 60 % or go denser | Before printing the final set | §2.5 |
| Update `team-roadmap-v2.md` and `experimental-procedure.md` | Before Partner B starts Week 4 | Both still carry the 20 mm lattice and the 50 mL formula |

---

## 5. Spreadsheet additions

`lattice_id` · `lattice_geometry` · `lattice_bare_mass_g` · `void_volume_mL_measured` · `channels_loaded`

`residence_min` must be computed from `void_volume_mL_measured ÷ flow_mL_min`, not from the 50 mL figure in the Week 4 notes.
