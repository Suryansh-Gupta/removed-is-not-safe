<style>
/* ============================================================
   1. TOKENS
   ============================================================ */
:root{
  /* spacing — 8px scale */
  --s-1:8px; --s-2:16px; --s-3:24px; --s-4:32px;
  --s-5:40px; --s-6:48px; --s-8:64px; --s-10:80px;

  /* type ramp */
  --t-12:12px; --t-14:14px; --t-16:16px; --t-18:18px;
  --t-20:20px; --t-24:24px; --t-32:32px; --t-40:40px;

  /* line heights */
  --lh-tight:1.2; --lh-snug:1.3; --lh-ui:1.5; --lh-prose:1.7;

  /* radius */
  --r-control:6px;
  --r-container:10px;

  /* control heights, multiples of 8 */
  --h-control:40px;
  --h-chip:24px;

  /* elevation, drawer only */
  --shadow-drawer:0 16px 48px rgba(17,23,34,.24);

  /* motion */
  --dur:160ms;

  /* ---- the dominant neutral: one slate family ---- */
  --n-0:#FFFFFF;
  --n-25:#F7F8FA;
  --n-50:#EFF1F5;
  --n-200:#DDE1E8;
  --n-300:#C2C8D2;
  --n-500:#5D6675;
  --n-700:#39414F;
  --n-900:#111722;

  /* ---- the primary ---- */
  --p-base:#1B4DB1;
  --p-hover:#163F92;
  --p-wash:#E7EDF9;

  /* ---- the accent: caution only ---- */
  --a-base:#A83A0A;
  --a-wash:#FAEAE1;

  /* semantic roles */
  --ground:var(--n-25);
  --surface:var(--n-0);
  --sunken:var(--n-50);
  --line:var(--n-200);
  --line-strong:var(--n-300);
  --ink:var(--n-900);
  --ink-body:var(--n-700);
  --ink-muted:var(--n-500);
  --scrim:rgba(17,23,34,.45);

  /* faces */
  --font-ui:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-prose:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* layout */
  --rail-w:280px;
  --measure:720px;
  --toc-w:200px;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --n-0:#151B25;
    --n-25:#0D1219;
    --n-50:#1D242F;
    --n-200:#283040;
    --n-300:#3A4355;
    --n-500:#949DAE;
    --n-700:#C4CBD7;
    --n-900:#E9ECF2;
    --p-base:#8FB2F2;
    --p-hover:#A9C4F6;
    --p-wash:#182541;
    --a-base:#F0946A;
    --a-wash:#2E1D14;
    --shadow-drawer:0 16px 48px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --n-0:#151B25;
  --n-25:#0D1219;
  --n-50:#1D242F;
  --n-200:#283040;
  --n-300:#3A4355;
  --n-500:#949DAE;
  --n-700:#C4CBD7;
  --n-900:#E9ECF2;
  --p-base:#8FB2F2;
  --p-hover:#A9C4F6;
  --p-wash:#182541;
  --a-base:#F0946A;
  --a-wash:#2E1D14;
  --shadow-drawer:0 16px 48px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6);
}

/* ============================================================
   2. BASE
   ============================================================ */
*{box-sizing:border-box}

body{
  margin:0;
  background:var(--ground);
  color:var(--ink-body);
  font-family:var(--font-ui);
  font-size:var(--t-16);
  line-height:var(--lh-ui);
  -webkit-font-smoothing:antialiased;
}

a{color:var(--p-base);text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{color:var(--p-hover)}

button{font:inherit;color:inherit;margin:0}

:focus-visible{outline:2px solid var(--p-base);outline-offset:2px;border-radius:var(--r-control)}

.skip{
  position:absolute;left:var(--s-2);top:var(--s-2);z-index:60;
  transform:translateY(-200%);
  padding:var(--s-1) var(--s-2);
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:var(--r-control);
  font-size:var(--t-14);font-weight:500;text-decoration:none;
}
.skip:focus{transform:translateY(0)}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}

/* ============================================================
   3. CONTROLS — one language, every state declared
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s-1);
  height:var(--h-control);padding:0 var(--s-2);
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:var(--r-control);
  font-size:var(--t-14);font-weight:500;line-height:1;
  cursor:pointer;white-space:nowrap;
  transition:background-color var(--dur) ease-out,border-color var(--dur) ease-out,color var(--dur) ease-out;
}
.btn:hover:not(:disabled){background:var(--sunken);border-color:var(--ink-muted)}
.btn:active:not(:disabled){background:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[data-state="busy"]{color:var(--ink-muted);cursor:progress}
.btn[data-state="done"]{border-color:var(--p-base);color:var(--p-base)}
.btn[data-state="failed"]{border-color:var(--a-base);color:var(--a-base)}

.btn-quiet{
  height:var(--h-control);padding:0 var(--s-1);
  background:transparent;border:1px solid transparent;border-radius:var(--r-control);
  color:var(--ink-muted);font-size:var(--t-14);cursor:pointer;
  transition:background-color var(--dur) ease-out,color var(--dur) ease-out;
}
.btn-quiet:hover:not(:disabled){background:var(--sunken);color:var(--ink)}
.btn-quiet:active:not(:disabled){background:var(--line)}
.btn-quiet:disabled{opacity:.4;cursor:not-allowed}

.spinner{
  width:16px;height:16px;flex:none;
  border:2px solid var(--line-strong);border-top-color:var(--p-base);border-radius:50%;
  animation:spin 640ms linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.input{
  width:100%;height:var(--h-control);
  padding:0 var(--s-2);
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line-strong);border-radius:var(--r-control);
  font-family:var(--font-ui);font-size:var(--t-14);line-height:var(--lh-ui);
  transition:border-color var(--dur) ease-out;
}
.input::placeholder{color:var(--ink-muted)}
.input:hover{border-color:var(--ink-muted)}
.input:focus{border-color:var(--p-base)}
.input::-webkit-search-cancel-button{display:none}

.field{display:flex;gap:var(--s-1);align-items:center}
.field .input{min-width:0}

/* status marker — neutral, primary, accent, plus one outline form */
.status{
  display:inline-flex;align-items:center;align-self:flex-start;
  height:var(--h-chip);padding:0 var(--s-1);
  border:1px solid transparent;border-radius:var(--r-control);
  background:var(--sunken);color:var(--ink-body);
  font-size:var(--t-12);font-weight:600;line-height:1;white-space:nowrap;
}
.status--primary{background:var(--p-wash);color:var(--p-base)}
.status--caution{background:var(--a-wash);color:var(--a-base)}
.status--archived{background:transparent;border-color:var(--line-strong);color:var(--ink-muted);font-weight:500}

/* ============================================================
   4. SHELL
   ============================================================ */
.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}

.rail{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:var(--s-3);
  padding:var(--s-3) var(--s-2) var(--s-4);
  background:var(--surface);border-right:1px solid var(--line);
}

.brand{display:flex;flex-direction:column;gap:var(--s-1)}
.brand-name{margin:0;font-size:var(--t-18);font-weight:600;line-height:var(--lh-snug);letter-spacing:-.01em}
.brand-name a{color:var(--ink);text-decoration:none}
.brand-name a:hover{color:var(--p-base)}
.brand-meta{font-size:var(--t-12);line-height:var(--lh-ui);color:var(--ink-muted)}

.nav{display:flex;flex-direction:column;gap:var(--s-3)}
.nav-group{display:flex;flex-direction:column;gap:var(--s-1)}
.nav-heading{
  padding:0 var(--s-1);
  font-size:var(--t-14);font-weight:600;line-height:var(--lh-ui);color:var(--ink);
}
.nav-link{
  display:flex;flex-direction:column;gap:var(--s-1);
  padding:var(--s-1);
  border-left:2px solid transparent;border-radius:var(--r-control);
  color:var(--ink-body);text-decoration:none;
  transition:background-color var(--dur) ease-out,color var(--dur) ease-out;
}
.nav-link:hover{background:var(--sunken);color:var(--ink)}
.nav-link:active{background:var(--line)}
.nav-link-title{font-size:var(--t-14);font-weight:500;line-height:var(--lh-ui)}
.nav-link-meta{font-size:var(--t-12);line-height:var(--lh-ui);color:var(--ink-muted)}
.nav-link[aria-current="page"]{background:var(--p-wash);border-left-color:var(--p-base);color:var(--p-base)}
.nav-link[aria-current="page"] .nav-link-meta{color:var(--p-base)}
.nav-empty{padding:var(--s-1);font-size:var(--t-14);line-height:var(--lh-ui);color:var(--ink-muted)}

.rail-foot{
  margin-top:auto;padding-top:var(--s-3);
  display:flex;flex-direction:column;gap:var(--s-1);
  border-top:1px solid var(--line);
}
.link-action{font-size:var(--t-14);font-weight:500;line-height:var(--lh-ui);text-decoration:none}
.link-action:hover{text-decoration:underline}
.rail-note{margin:0;font-size:var(--t-12);line-height:var(--lh-ui);color:var(--ink-muted)}

.topbar{display:none}

.main{
  min-width:0;
  padding-inline:clamp(var(--s-2),4vw,var(--s-8));
  padding-block:var(--s-6) var(--s-10);
}
.main:focus{outline:none}

.view{max-width:var(--measure);margin:0 auto}
.view--index{max-width:960px}

/* ============================================================
   5. DOCUMENT VIEW
   ============================================================ */
.doc-header{
  display:flex;flex-direction:column;gap:var(--s-2);
  padding-bottom:var(--s-3);margin-bottom:var(--s-4);
  border-bottom:1px solid var(--line);
}
.doc-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2)}
.doc-meta-text{font-size:var(--t-14);line-height:var(--lh-ui);color:var(--ink-muted)}
.doc-title{
  margin:0;font-size:var(--t-32);font-weight:600;
  line-height:var(--lh-tight);letter-spacing:-.02em;color:var(--ink);
  text-wrap:balance;
}
.doc-standfirst{
  margin:0;max-width:60ch;
  font-family:var(--font-prose);font-size:var(--t-18);
  line-height:var(--lh-prose);color:var(--ink-body);
}

.doc-layout{display:block}
.doc-main{min-width:0}

.toc{display:none}
@media (min-width:1180px){
  .doc-layout{
    display:grid;grid-template-columns:minmax(0,1fr) var(--toc-w);
    gap:var(--s-6);align-items:start;
  }
  .toc{
    display:block;position:sticky;top:var(--s-6);
    padding-left:var(--s-2);border-left:1px solid var(--line);
  }
  .toc-heading{
    margin-bottom:var(--s-1);
    font-size:var(--t-12);font-weight:600;line-height:var(--lh-ui);color:var(--ink);
  }
  .toc-link{
    display:block;padding:var(--s-1) 0;
    font-size:var(--t-12);line-height:var(--lh-ui);
    color:var(--ink-muted);text-decoration:none;
    transition:color var(--dur) ease-out;
  }
  .toc-link:hover{color:var(--ink)}
  .toc-link--sub{padding-left:var(--s-2)}
  .toc-link[data-active="true"]{color:var(--p-base);font-weight:500}
}

.doc-footer{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
  gap:var(--s-2);
  margin-top:var(--s-6);padding-top:var(--s-3);
  border-top:1px solid var(--line);
}
.doc-footer-note{margin:0;font-size:var(--t-12);line-height:var(--lh-ui);color:var(--ink-muted)}
.doc-footer-note code{font-family:var(--font-mono);font-size:var(--t-12)}
.doc-footer-actions{display:flex;align-items:center;gap:var(--s-2)}

/* ============================================================
   6. PROSE
   ============================================================ */
.prose{font-family:var(--font-prose);font-size:var(--t-18);line-height:var(--lh-prose);color:var(--ink-body)}
.prose > *:first-child{margin-top:0}
.prose > *:last-child{margin-bottom:0}

.prose h1,.prose h2,.prose h3,.prose h4{
  font-family:var(--font-ui);color:var(--ink);font-weight:600;text-wrap:balance;
}
.prose h1{font-size:var(--t-24);line-height:var(--lh-snug);letter-spacing:-.01em;margin:var(--s-6) 0 var(--s-2)}
.prose h2{
  font-size:var(--t-20);line-height:var(--lh-snug);letter-spacing:-.01em;
  margin:var(--s-6) 0 var(--s-2);padding-top:var(--s-3);border-top:1px solid var(--line);
}
.prose h3{font-size:var(--t-18);line-height:var(--lh-ui);margin:var(--s-4) 0 var(--s-1)}
.prose h4{font-size:var(--t-16);line-height:var(--lh-ui);margin:var(--s-3) 0 var(--s-1)}

.prose p{margin:0 0 var(--s-2)}
.prose ul,.prose ol{margin:0 0 var(--s-2);padding-left:var(--s-3)}
.prose li{margin-bottom:var(--s-1)}
.prose li:last-child{margin-bottom:0}
.prose li > ul,.prose li > ol{margin-top:var(--s-1);margin-bottom:0}
.prose li::marker{color:var(--ink-muted)}

.prose strong{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.prose del{color:var(--ink-muted)}
.prose hr{border:0;border-top:1px solid var(--line);margin:var(--s-4) 0}
.prose blockquote{margin:0 0 var(--s-2);padding-left:var(--s-2);border-left:2px solid var(--p-base)}

.prose code{
  font-family:var(--font-mono);font-size:.85em;
  color:var(--ink);
}
.prose pre{
  margin:0 0 var(--s-2);padding:var(--s-2);
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-container);
  overflow-x:auto;
}
.prose pre code{font-size:var(--t-12);line-height:var(--lh-prose)}

.table-frame{
  margin:0 0 var(--s-3);
  background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-container);
  overflow-x:auto;
}
.prose table{
  width:100%;border-collapse:collapse;
  font-family:var(--font-ui);font-size:var(--t-14);line-height:var(--lh-ui);
  font-variant-numeric:tabular-nums;
}
.prose thead th{
  padding:var(--s-1) var(--s-2);
  text-align:left;vertical-align:bottom;white-space:nowrap;
  border-bottom:1px solid var(--line-strong);
  font-size:var(--t-12);font-weight:600;color:var(--ink-muted);
}
.prose tbody td{
  padding:var(--s-1) var(--s-2);vertical-align:top;
  border-bottom:1px solid var(--line);color:var(--ink-body);
}
.prose tbody tr:last-child td{border-bottom:0}
.prose td strong{color:var(--ink)}
.prose td code,.prose th code{font-size:.9em}

/* ============================================================
   7. ASYNC STATES — loading, error
   ============================================================ */
.skeleton{
  display:flex;flex-direction:column;gap:var(--s-2);
  opacity:0;animation:skeleton-in var(--dur) ease-out 120ms forwards;
}
@keyframes skeleton-in{to{opacity:1}}
.skeleton-bar{
  height:var(--s-2);border-radius:var(--r-control);background:var(--sunken);
  animation:skeleton-pulse 1400ms ease-in-out infinite alternate;
}
@keyframes skeleton-pulse{from{opacity:.55}to{opacity:1}}
.skeleton-bar--title{height:var(--s-3);width:48%;margin-bottom:var(--s-1)}
.skeleton-bar--short{width:64%}
.skeleton-bar--block{height:var(--s-10);border-radius:var(--r-container)}

.panel{
  padding:var(--s-3);
  background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-container);
}
.panel--error{border-color:var(--a-base);background:var(--a-wash)}
.panel-title{font-size:var(--t-16);font-weight:600;line-height:var(--lh-ui);color:var(--ink)}
.panel-body{
  margin:var(--s-1) 0 var(--s-2);max-width:60ch;
  font-family:var(--font-prose);font-size:var(--t-16);line-height:var(--lh-prose);color:var(--ink-body);
}
.panel-body:last-child{margin-bottom:0}

/* ============================================================
   8. INDEX VIEW
   ============================================================ */
.hero{display:flex;flex-direction:column;gap:var(--s-2);margin-bottom:var(--s-5)}
.hero-title{
  margin:0;max-width:24ch;
  font-size:clamp(var(--t-32),5vw,var(--t-40));font-weight:600;
  line-height:var(--lh-tight);letter-spacing:-.02em;color:var(--ink);
  text-wrap:balance;
}
.hero-standfirst{
  margin:0;max-width:60ch;
  font-family:var(--font-prose);font-size:var(--t-20);
  line-height:var(--lh-prose);color:var(--ink-body);
}
.hero-standfirst strong{color:var(--ink);font-weight:600}

.figures{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:1px;margin-bottom:var(--s-5);
  background:var(--line);border:1px solid var(--line);border-radius:var(--r-container);
  overflow:hidden;
}
.figure{display:flex;flex-direction:column;gap:var(--s-1);padding:var(--s-2);background:var(--surface)}
.figure-value{
  font-size:var(--t-24);font-weight:600;line-height:var(--lh-tight);
  letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums;
}
.figure-label{font-size:var(--t-12);line-height:var(--lh-ui);color:var(--ink-muted)}

.notice{
  display:flex;flex-direction:column;gap:var(--s-1);
  padding:var(--s-2) var(--s-3);margin-bottom:var(--s-5);
  background:var(--p-wash);border-radius:var(--r-container);
}
.notice-title{font-size:var(--t-14);font-weight:600;line-height:var(--lh-ui);color:var(--ink)}
.notice-body{
  margin:0;font-family:var(--font-prose);font-size:var(--t-16);
  line-height:var(--lh-prose);color:var(--ink-body);
}

.section{margin-bottom:var(--s-5)}
.section:last-child{margin-bottom:0}

# Removed Is Not Safe — the project in plain words

**Last updated:** 2026-10-17 (rewritten for the chlorine + ciprofloxacin project; the previous version described the persulfate + sulfamethoxazole plan, dropped on 2026-09-29). **Status: CURRENT.** For live status always read `project-state.md`, which is newer than this doc by design.

**Who this is for:** anyone joining the project, or anyone who needs the whole idea in one read without chemistry background. Every term is defined the first time it appears.

---

## The one-sentence version

Water treatment plants add chlorine to kill germs. Chlorine also attacks antibiotics that are in the water, and the broken pieces can still stop bacteria from growing. Plants only measure whether the antibiotic molecule is gone. We are building a model that predicts whether the water is still antibacterial, and using it to pick chlorine settings that disinfect properly while leaving as little of that antibacterial strength behind as possible.

**Research question (draft):** Can a chemistry-based model find chlorination settings that meet disinfection targets while keeping ciprofloxacin-derived antibacterial activity below a predefined limit in blind tests?

**The title means:** "removing the drug does not prove the water is safe." It does **not** mean "treated water is dangerous." That distinction matters when talking to judges.

---

## Terms you need

- **Chlorination** — adding chlorine (here, bleach: sodium hypochlorite) to water to kill germs. Every US wastewater plant and most drinking-water plants do this.
- **Free chlorine** — chlorine on its own. Very reactive.
- **Chloramine** — what chlorine becomes when it meets ammonia, which is present in treated wastewater. It is a much gentler oxidiser, so it reacts with the antibiotic far more slowly. Free chlorine versus chloramine is one of the two big unknowns in this project.
- **CT** — concentration of chlorine multiplied by contact time. It is how regulators judge whether water was disinfected properly. It is a floor the project cannot go below: plants *must* disinfect.
- **Dechlorination** — removing leftover chlorine before the water is discharged, so it doesn't kill fish. Our local plant uses sodium bisulfite.
- **Transformation product** — a piece the antibiotic breaks into. Not necessarily harmless.
- **Antibacterial activity** — how strongly the water still slows or kills bacteria, whatever molecules are doing it. This is the thing nobody measures and the thing this project predicts.
- **Resistance threshold** — the concentration below which an antibiotic shouldn't push bacteria toward resistance. Usually written as PNEC (predicted no-effect concentration).
- **HPLC** — high-performance liquid chromatography, an instrument that separates a mixture into its individual molecules before measuring each one. We need it because the antibiotic and all its pieces absorb light the same way, so only separation tells them apart.
- **Blind test** — writing down a prediction with a timestamp, then running the experiment. It is the strongest evidence a project like this can produce.

---

## The problem

The antibiotic we study is **ciprofloxacin** (shortened to "cipro"), a common and very potent antibiotic.

When chlorine meets cipro, three things happen in sequence (Dodd et al. 2005, the paper this project's chemistry rests on):

1. In **under one second**, chlorine attacks cipro and turns it into something called N-chloro-cipro.
2. Over roughly **15 to 20 minutes**, that falls apart into further products.
3. With more chlorine, those products break down further.

The catch: **every one of those products keeps the quinolone core** — the part of the cipro molecule that actually attacks bacteria. So a plant measuring "has the ciprofloxacin gone?" gets a reassuring yes, while the water may still be doing what ciprofloxacin does.

**This is not hypothetical.** Two published studies found it directly:

- Jaén-Gil et al. 2020: antibacterial activity **rose** after cipro was completely removed, at chlorine doses above 0.5 mg/L. One chlorinated product kept 30–44% of cipro's own potency.
- Kennedy Neth et al. 2019: chlorination produced active products from all three fluoroquinolone antibiotics tested. (Notably, not for sulfamethoxazole or trimethoprim — which is part of why the project switched to cipro.)

**Why leftover antibacterial strength matters.** Low-level antibiotic exposure kills the weak bacteria and leaves the resistant ones, which then multiply. Ciprofloxacin's resistance threshold is **0.064 micrograms per litre** — extremely low. Measured ciprofloxacin in four New York wastewater plants ran 0.20 to 1.4 micrograms per litre, which is up to 22 times over that threshold (Batt 2007; Bengtsson-Palme & Larsson 2016).

**An important distinction, because it gets confused constantly.** Killing germs in water is the whole point of chlorination and it is good. We are measuring the opposite thing: whether the water retains *leftover antibiotic strength* after treatment. In our test, bacteria are the **detector**, not the target. If they grow normally, the water is fine.

---

## The local setting

The San José–Santa Clara Regional Wastewater Facility disinfects with bleach, removes nitrogen, then dechlorinates with sodium bisulfite. About 80% of the water goes out via Artesian Slough into Coyote Creek and the South San Francisco Bay; about 20% becomes recycled water. Our reactor is built to imitate that sequence at bench scale.

---

## The two open questions the project is built around

**Gap 1 — chloramine.** Treated wastewater contains ammonia, so chlorine often exists as chloramine rather than free chlorine. No study was found that chlorinates cipro with chloramine *and* measures the leftover antibacterial strength. The two forms should behave very differently, and the model predicts they do.

**Gap 2 — does dechlorination undo the reaction?** Dodd 2005 suggested that the dechlorination step at a plant might turn N-chloro-cipro back into ciprofloxacin, but never measured it. A related study saw exactly that happen with a different fluoroquinolone (El Najjar 2012). If true, a plant could be regenerating active antibiotic at the very last step before discharge. This is both a possible headline finding and a measurement trap — the chemical used to stop the reaction in a sample could create the effect being measured, which is why the project compares several.

---

## What gets built

1. **A chemistry model** — predicts, from the actual reactions, how much cipro, N-chloro-cipro and downstream product sits in the water at any dose, contact time and ammonia level. **Built and validated.**
2. **An activity model** — converts those molecule concentrations into one number: predicted antibacterial strength, expressed as "the equivalent amount of ciprofloxacin." **Not built yet.**
3. **A cost optimiser** — searches for the cheapest settings that still meet the disinfection requirement *and* stay under a pre-declared activity limit, then compares that against the settings a drug-removal-only plan would pick. **Scheduled January–February.**
4. **A bench reactor** — roughly $2,000 in parts: a coiled PTFE tube as the chlorine contact chamber, three pumps (water, bleach, bisulfite), pH and ORP probes, and a Raspberry Pi logging it. Being built now, due mid-November.
5. **A cheap bacteria test** — harmless lab *E. coli* plus resazurin dye in a 96-well plate. Pink means the bacteria grew; blue means something stopped them. It works at lab concentrations, not at real-world trace levels, which would need the sample concentrated first. Say that plainly.
6. **Proof** — the model reproduces other labs' published results, then predicts one of our own experiments *before* it is run.

---

## Where it stands (October 2026)

The chemistry model is built, on GitHub, and passes 16 automatic tests. Its first real test — reproducing Dodd 2005's published decay curves with nothing fitted — **passed on 16 October**: 14.5% average error in wastewater, 8.6% in drinking water, against a 20% pass limit.

One genuine disagreement remains unresolved. Kennedy Neth's 2019 data show roughly a third of the ciprofloxacin still present after two hours of chlorination; our model, following Dodd's reaction rates, predicts none at all. The two labs disagree with each other, not just with us, and the likely culprit is the chemical each used to stop the reaction before measuring. Settling it with our own measurements is a Phase 2 experiment.

The machine-learning layer does not exist yet. On a poster, the honest phrase is "mechanistic kinetic model plus Bayesian optimisation," and "machine learning" should only describe parts that have been built.

---

## Honest framing

- **Nobody regulates antibacterial activity in water anywhere.** California's recycled-water screening tests cover hormone-like and dioxin-like effects, with no antibacterial endpoint. That is an opportunity, not a scandal, and part of the reason is that there has been no cheap way to predict or measure it.
- California's potable reuse rules do require 90% removal of a different antibiotic across the ozone stage, measured by the drug alone — a good example of exactly the blind spot this project is about.
- **We do not claim** the project will reduce resistant infections, that zero measured activity means safe, that the model is validated for treatments other than chlorine, or that our reactor should be installed anywhere.
- **We do not claim novelty** for measuring activity after treatment, for kinetic modelling, or for optimising treatment — all of those exist. The parts not found in the literature are listed under Gap 1 and Gap 2 above, plus using an activity prediction to *choose* settings and testing that choice blind.

# Partner handoff — your five deliverables

**Written:** 2026-10-17. **Status: CURRENT.** Addressed to the partner joining the project. For live status read `project-state.md`; for the project explained from scratch read `project-overview.md`.

---

## Read this first

Welcome. Here is the short version of where you're joining.

The project asks whether water that has been chlorinated still stops bacteria, even after the antibiotic in it has been destroyed. The chemistry half is built and validated — a model that predicts what chlorine does to ciprofloxacin over time. The reactor that will test it is being built right now and should be running by **15 November**.

**Everything below is deliberately chosen so you are not waiting on that reactor.** All five are laptop work or paperwork. None of them need lab access, bench time, or anything to be ordered and delivered first. Two of them are already past their original date, which is why they're first.

One thing you will need from the other partner before you can finish items 3, 4 and 5: **write access to the GitHub repository.** Ask for it on day one.

---

## 1. Get the safety paperwork to signature-ready

**Target: this week.** It was due 16 October, so it's the one genuinely holding things up.

Nothing in this project involving bacteria can start until the fair's Scientific Review Committee — the safety panel that reviews projects before work begins — approves it. Approval takes weeks, so every day this sits costs a day at the far end.

What you do:

- Complete every form in the packet, including the one specific to growing bacteria. The organism is a harmless laboratory strain of *E. coli*, rated biosafety level 1, and the rules require it to be grown in a properly rated lab — never at home.
- Write the research plan attachment that goes with the forms.
- Download the safety data sheet for the ciprofloxacin we intend to buy (Sigma-Aldrich part 17850) and write the hazard section from it. **Read it closely for any reproductive-toxicity listing.** Under the 2026–27 rules that would force the work into a research institution or a restricted fume hood, which would rule out the community lab we were planning to use. If you find that, say so immediately — it changes where the whole project can happen.
- Fill in the additional form for working at an outside site, since some of the measurement work happens at BioCurious, a community biology lab.

You don't have to talk to anyone or chase anybody. Get the packet to the state where the only blank spaces left are signature lines; the other partner handles the signatures.

**Done when:** one complete PDF packet, signatures the only thing missing, plus a one-line verdict on whether the drug's safety sheet creates a problem.

---

## 2. Write the bacteria test protocol, on paper

**Target: 15 November**, so it's ready the day lab access opens.

This is the experiment that decides whether the project's measurement works at all, and you can design the whole thing before touching a pipette.

The test: harmless lab *E. coli* in a 96-well plate with resazurin dye. Pink means the bacteria grew; blue means something stopped them. You'll run a dilution series of **pure purchased ciprofloxacin** — not reactor water — to find the lowest concentration the test can still detect.

Write down:

- **The dilution series.** It has to reach down to a few millionths of a gram per litre. Ciprofloxacin is far more potent against *E. coli* than the drug this project originally targeted, and the published minimum inhibitory concentrations for some species are around 2 to 5 micrograms per litre. If your dilutions stop short of that range the test will look like it failed when it didn't.
- **The plate layout**, well by well.
- **The five controls, on every plate:** bleach alone; bleach plus the neutralising chemical; the neutralising chemical alone; ammonium chloride alone; and dye with no bacteria at all. Any one of those can kill bacteria or shift the dye colour by itself and produce a convincing false result. The last one catches colour changes that have nothing to do with life.
- **Which chemical stops the chlorine reaction in a sample.** Compare sodium thiosulfate, sodium bisulfite and ascorbate on paper and pick one. This matters more than it sounds: the choice can change the answer, published labs disagree partly because of it, and once chosen both partners must use the same recipe on every sample forever.
- **The maximum acceptable leftover antibacterial strength** — the number the project will later be judged against. Write it down **with today's date, before any results exist.** Setting it after seeing results moves the goalposts, and a judge will ask when it was decided.

**Done when:** a protocol someone could follow without asking you a question, and the activity limit recorded with a date.

---

## 3. Build the simple model we have to beat

**Target: as soon as you have repository access.** Originally due 15 October.

This is the deliberately naive version: assume the water's antibacterial strength falls exactly in step with the ciprofloxacin concentration. No products, no chemistry — just a straight proportion.

It takes very little work, because the chemistry model already produces every number it needs. The reason it matters is structural: the project's central claim is that predicting the chemistry beats this simple assumption, and that comparison is only believable if the simple version was built *before* the results came in, rather than reconstructed afterwards to lose.

**Done when:** committed to the repository with a test, and it runs on the same conditions the chemistry model was validated against.

---

## 4. Replace the four borrowed numbers

**Target: 15 November.** Pure reading and arithmetic, no lab, no code review needed.

Four numbers in the model currently come from a weaker source than they should, and each is a question a judge can reasonably ask:

1. **The breakdown rates per chemical form.** Download the supporting information for Dodd 2005 — it's free on the publisher's site — and find Figure S7. It gives the real rates, replacing an assumption currently built into the model about how the molecule splits between its charge states.
2. **The chloramine breakdown constants.** Check them directly against Jafvert & Valentine 1992 rather than the secondary source they came from.
3. **The dichloramine constants.** These are currently copied out of a university thesis table. Trace them to the original paper and confirm them, including the unit conversion — a related page in this project once had per-hour numbers used as per-second, which made a result wrong by a factor of 3,600.
4. **How fast ciprofloxacin diffuses through water.** The model uses an educated estimate. Find a published value. This one isn't academic: that number sets the threshold the team used to choose which tubing to buy, so it's worth knowing whether the guess was good.

While you're in the literature, build **one table of the published measurements of leftover antibacterial strength after chlorination** — Jaén-Gil 2020 and Kennedy Neth 2019 are the two that matter. This table is what item 5 gets calibrated against, so it's a prerequisite, not a side quest.

**Done when:** each number has a citation and a note saying whether it changed and by how much, and the published-activity table is in the repository.

---

## 5. Draft the activity model from published numbers

**Target: 15 December.** Needs item 4 finished first.

This is the missing piece of the project, and the part that is properly yours. The chemistry model says which molecules are in the water. The activity model turns that into a predicted plate result: give each molecule a potency relative to ciprofloxacin, add them up, and express the total as "the equivalent amount of ciprofloxacin." The molecules to score are ciprofloxacin itself, N-chloro-cipro, and the two groups of downstream products the chemistry model tracks.

You can build and calibrate a first version entirely on published data, with no measurements of our own. The calibration target is a real and unexplained gap in Kennedy Neth's results: their chlorinated water stayed noticeably more antibacterial than the leftover ciprofloxacin alone could account for — roughly 0.4 in ultrapure water and 0.25 in wastewater, on their scale, above what the remaining drug explains. That gap is the entire premise of the project, stated in someone else's data. If your model reproduces it, the premise holds up.

Their figures were re-digitised from the original paper on 16 October and now carry standard deviations, so you can weight the fit properly rather than treating every point as equally certain. The file is in the repository under the published-data folder.

Start by assuming potencies simply add together, then note in your write-up that this is an assumption to be tested — published work has found both synergy and antagonism in antibiotic mixtures, so it may not hold.

**Done when:** the model runs on the published data, reproduces that gap within an error band you state explicitly, and lives in the repository with tests.

---

## What is deliberately not on this list

- **The optimiser** (the search for cheapest acceptable settings) is also yours, but it genuinely needs real measurements first. It's scheduled 10 January to 5 February.
- **Running** the bacteria test, booking lab time, and ordering supplies are all held back until the safety approval in item 1 lands.
- **The real-effluent sample** in March is yours too, and arranging a contact early wouldn't hurt, but it isn't urgent.

## If you want more than five

The Valley Water mini-grant application is unclaimed, pure paperwork, and has three unresolved blockers worth knowing: an individual isn't allowed to be the applicant, the published award cap contradicts itself between two official pages ($5,000 versus $10,000), and the volunteer hours in the current budget are carried over from the abandoned earlier version of the project and need re-estimating. See `valley-water-mini-grant-budget.md`.

## 2. THE PROJECT IN ONE PAGE (chlorine + ciprofloxacin; §2 rewritten 2026-10-17)

**Title:** *Removed Is Not Safe.* The defensible meaning is "removing the drug alone doesn't prove the water is safe," not "treated water is unsafe."

**Research question (draft, no "and"):** *Can a chemistry-based model find chlorination settings that meet disinfection targets while keeping ciprofloxacin-derived antibacterial activity below a predefined limit in blind tests?*

**Core idea:** chlorine destroys ciprofloxacin in under a second, but every transformation product keeps the quinolone core, so the water can stay antibacterial after the drug is gone. A kinetic model predicts the molecules; an activity model converts them into a predicted response in *our* bacteria test; an optimizer picks the cheapest settings meeting a disinfection CT floor and an activity ceiling; a blind test checks the prediction. This is a mechanistic model with fitted parameters, not first-principles.

**The chemistry (Dodd 2005, PDF in hand):** cipro + HOCl → N-chloro-cipro in < 1 s → CF-Pa1 over ~15–20 min → later products with more chlorine. All keep the quinolone core. Kennedy Neth 2019 found some later products lose the carboxyl (halodecarboxylation) or the fluorine and are probably inactive, so "keeps the core" is an **upper bound** on activity.

**The two gaps:**
1. **Chloramine.** Ammonia in effluent turns free chlorine into chloramine, which reacts far more slowly with cipro. No study found that chlorinates cipro with chloramine *and* measures antibacterial activity.
2. **Dechlorination reversal.** Dodd 2005 p. 7073 proposed that plant dechlorination could regenerate cipro from N-chloro-cipro, and gave no rate. El Najjar 2012 saw thiosulfate revert a chlorinated levofloxacin intermediate. Untested for cipro. Both a possible headline finding and a measurement trap, since the quench chemical could create the effect being measured.

**Setting:** San José–Santa Clara RWF — sodium hypochlorite, nitrification, sodium bisulfite dechlorination, ~80% via Artesian Slough → Coyote Creek → South Bay, ~20% to recycled water. Plant contact time is not published; working range 30–60 min, estimated from Ten States Standards, other California plants' approved modal contact times, and the plant's own 2018 State approval for free chlorine.

**Components:**
1. **Chemistry model** — **BUILT.** Free/combined chlorine, chloramine and dichloramine, Dodd cipro reactions, tube flow pattern predicted from tube diameter, length and pump flow. 16 automatic tests pass. Rate constants live only in `ris/`.
2. **Activity model** — **NOT BUILT** (Partner B, due Dec 15). Potency per species → cipro-equivalent → predicted % inhibition. First calibration on Kennedy Neth's PEQ data, where activity stays ~0.4 (ultrapure) / ~0.25 (wastewater) above what leftover cipro explains. Additive summing is a starting assumption to test.
3. **Optimizer** — **NOT BUILT** (Jan 10 – Feb 5). Gaussian process + Bayesian optimization: minimize cost subject to CT ≥ target and activity ≤ limit. Compare against a drug-only baseline and a simple fitted curve.
4. **Reactor** — being built, due Nov 15. Coiled 1/8" ID × 1/4" OD PTFE on 4" Sch 40 PVC; 3.8 m gives 30 min at 1 mL/min. Three Kamoer peristaltic pumps (water, bleach, bisulfite); pH probe in the feed jug, ORP probe in the outlet bottle; Raspberry Pi logging. ≈ $2,000 with spares. No 3D printing required.
5. **Activity test** — *E. coli* K-12 + resazurin, 96-well plates, Mueller-Hinton broth. No thymidine problem (that was a sulfonamide issue). Cipro is very potent against *E. coli*, so dilutions must reach the µg/L range. Controls every plate: bleach alone, bleach + bisulfite, bisulfite alone, ammonium chloride alone, cell-free dye. **First bacterial experiment = cipro dose–response, the go/no-go gate.**
6. **Measurement** — HPLC-UV at BioCurious is the main method; DPD kit for chlorine; ORP is not a cipro measurement. A quench comparison (no quench / H₂O₂ / thiosulfate / bisulfite) is required, because published cipro data depend on which quench was used.
7. **Target antibiotic:** ciprofloxacin only. Resistance PNEC 0.064 µg/L (0.06 industry, 0.023 WHO 2024); measured effluents 0.20–1.4 µg/L (Batt 2007), up to 22× over.

**Validation status:** Checkpoint A **PASSED 2026-10-16** on properly digitized data — 14.5% (wastewater) / 8.6% (drinking water) mean error vs Dodd 2005 Fig. 5a, nothing fitted, against a 20% limit. Kennedy Neth chlorine use passes. Kennedy Neth Fig. 2A cipro persistence **fails**: they measure ~a third of cipro surviving 120 min, the model predicts none. The two published labs disagree with each other; resolve with own HPLC + quench comparison.

**Honest impact framing:** no jurisdiction regulates antibacterial activity in water, and California's recycled-water bioassays have no antibacterial endpoint. Chlorine is cheap, so frame the objective as least chlorine and lowest residual risk rather than large dollar savings. Do not claim lives saved, guaranteed savings, validation for other oxidants, or that zero measured activity means safe. Adding an activity limit can *raise* cost.

**Milestones:** Oct 15 model v1 (done) · Nov 15 reactor + HPLC method · Dec 15 bacteria test + activity model · Jan–Feb full reactor, optimization, blind test · Mar real water + poster.

## 6. NOVELTY POSITION (corrected 09-29)

**Exists:** activity measured after oxidation (dozens of studies across ozone, UV/H₂O₂, UV/PDS, chlorine, Fenton); active SMX TPs under sulfate-radical treatment (Ao 2018); combined parent + TP activity prediction (Yao & You 2023); kinetic model + activity tests under persulfate (Qian 2018, Zhang 2016); iron/PDS SMX detoxification with *E. coli* (Yu 2022); toxicity-aware optimization (Hu 2024, Chen 2025); risk-aware Bayesian optimization of pharmaceutical treatment (Lu 2026); kinetics + activity + cost (Raikar 2024); commercial UV-AOP dose control (Trojan); biological-feedback ozone patent.

**Plausible remaining contribution:** an open, small iron/PDS flow-reactor model that predicts activity in the *same calibrated assay*, chooses the least-cost setting under stated removal and activity limits, and succeeds on a blind test against parent-only and simple empirical baselines. No exact duplicate found. That is not proof of priority.

**Do not claim:** "novel as a combination," "first to consider activity," "no one connected sulfate radicals to active SMX TPs," "zero activity = safe," "validated for all oxidants," "no one regulates antibacterial activity anywhere."

## Project in one paragraph
San José–Santa Clara RWF chlorinates (sodium hypochlorite), nitrifies, dechlorinates with **sodium bisulfite**, discharges → Coyote Creek → Bay. Per Dodd 2005: cipro + HOCl → N-chloro-cipro in < 1 s; → CF-Pa1 over ~15–20 min; → later products with more chlorine. Products keep the quinolone ring; **Kennedy Neth 2019 found some later products lose the carboxyl (halodecarboxylation, m/z 324, 253) or fluorine (m/z 288) → likely inactive**, so "keeps ring" = upper bound on activity. Dodd p. 7073 proposed plant dechlorination could regenerate cipro, no rate → Gap 2. Gap 1 = free chlorine vs pre-formed chloramine.

# Review conclusions and next steps (29 Sep 2026)

**What this is:** Claude's analysis of the expanded literature review ChatGPT produced on 28 Sep (package "removed-is-not-safe-review-package"). The key claims were spot-checked against PubMed and extra searches were run. **Status: CURRENT.** It feeds the Wed 30 Sep decision on locking the research question (see `oct15-prototype-sprint.md`).

---

## 1. Bottom line

1. **The ChatGPT review is sound, and its main verdict holds.** The four claims that change the project were checked against the PubMed abstracts and all match. The 2026 Bayesian-optimization paper it cites (Lu et al., ACS ES&T Water) exists. Its tone is conservative, which is right for a fair project that will be judged by experts.
2. **The "sharper" question we proposed on 28 Sep rests on a claim that is false.** We said no study connects sulfate-radical treatment to active sulfamethoxazole (SMX) pieces. **Ao et al. 2018 did exactly that:** SMX treated with UV light plus peroxymonosulfate (PMS) formed early pieces "with equivalent or even higher antibacterial activity than SMX." That persulfate-family treatment produces active SMX pieces is already published.
3. **"Novel as a combination" has to go.** Predicting the combined activity of a drug plus its pieces (Yao & You 2023), kinetic models plus activity tests under persulfate (Qian 2018; Zhang 2016), and optimizing treatment with an antibiotic-risk term using Bayesian optimization (Lu 2026) all exist.
4. **A real contribution is still there, but it's narrower:** a small, open model for an **iron–persulfate flow reactor** that predicts activity measured in *your* bacteria test, uses that prediction to choose the cheapest acceptable settings, and **beats simpler models on a blind test**. No exact duplicate was found. That is "not found," not "proven first."
5. **The review missed the most on-target papers, and they change the hypothesis** (section 3). Iron/persulfate studies on SMX show activity **rising early, then disappearing** with more treatment. That makes a sharper and more useful hypothesis than "persulfate leaves active pieces."

---

## 2. What's verified, and what still isn't

| Claim | Checked? | Result |
|---|---|---|
| Ao 2018: SMX + UV/PMS forms early pieces as active as or more active than SMX | PubMed abstract | ✅ Confirmed. Overall activity still fell by the end. |
| Zhang 2016: SMX under UV/**PDS** (peroxydisulfate, the persulfate we use) | PubMed abstract | ✅ **No antibacterial activity found in the pieces** (with a different bacterium). A separate glowing-bacteria test showed 20–40% *more* toxicity. This counts against the simple "persulfate leaves active pieces" story. |
| Majewsky 2014: 4-nitro-SMX and 4-hydroxy-SMX inhibit growth more than SMX; mixture is additive | PubMed abstract | ✅ Confirmed, but tested on *Vibrio fischeri*, not *E. coli*. |
| Yao & You 2023: >90% drug removal, 40–60% activity removal, combined-activity prediction | PubMed abstract | ✅ Confirmed. The drug is sulfapyridine, not SMX. **Our old notes say "full text read." The review correctly downgrades that to abstract only.** |
| Lu et al. 2026, risk-aware Bayesian optimization | Publisher page exists | ✅ Real. Full methods not read. It uses risk quotients (predicted exposure ÷ safe level), not measured activity. |
| Most other ~100 sources | — | Abstract-level only (the review is honest about this). Fine for mapping the field; not enough to quote methods or numbers on the poster. |

**Still unverified and important:** full text of Ao 2018 and Yu 2022 (below): which bacteria, what concentrations, and whether leftover oxidant was quenched before testing.

---

## 3. What the review missed (found in this check)

These are the studies closest to our actual reactor chemistry (iron + persulfate + SMX). None is in the review's 102-source register:

- **Yu et al. 2022** (sulfidated zero-valent iron + persulfate on SMX): tested the treated mixture on *E. coli* (by measuring its metabolism) and concluded SMX was "effectively detoxified." [DOI](https://doi.org/10.1016/j.jhazmat.2022.128244). **This is the closest precedent to our chemistry and our detector organism, and it did not find leftover activity.**
- **Song et al. 2022** (Fe²⁺ + dithionite + persulfate on SMX): toxicity to *V. fischeri* **increased early in treatment, then fell** as the reaction continued. [DOI](https://doi.org/10.1016/j.jhazmat.2022.129254)
- **Ji et al. 2014** (Fe²⁺-activated persulfate on SMX): measured degradation and identified pieces, but did no activity test. This is the paper already planned as a validation source. [DOI](https://doi.org/10.1016/j.scitotenv.2013.11.008)

Our own 28 Sep deep pass also found things the review lacks: 4-nitro-SMX increasing the transfer of resistance genes between bacteria up to 73-fold at 10 ng/L–100 µg/L ([DOI](https://doi.org/10.1016/j.jhazmat.2025.137932)); a 2006 study where the *E. coli* EC₅₀ for SMX, meaning the concentration that halves growth, was ≈3 mg/L ([DOI](https://doi.org/10.1897/05-384r.1)); and Chen, Liu & Xie 2025, a combined-toxicity index for optimizing oxidation treatment ([DOI](https://doi.org/10.1016/j.watres.2025.125072)). The last one is **more prior art on toxicity-aware optimization**. These came from abstracts in an earlier session and were not rechecked today.

### The hypothesis this points to: a transient activity window

Put Ao 2018, Song 2022, Baran 2023 (too little Fenton reagent left active pieces) and Yu 2022 / Zhang 2016 (enough treatment left none) together, and a consistent pattern appears:

> **At low oxidant dose or short contact time, activity per unit of drug removed goes up. With enough treatment, it disappears.**

This matters for the project because a cost optimizer aiming for "90% SMX removed" will push toward the *least* treatment that hits 90%, which is exactly where the window sits. A parent-drug-only plan could therefore pick a setting that is cheap and "compliant" but still active. The chemistry-plus-activity model's job is to find the cheapest setting **past** the window.

It is testable, it predicts when the simple model fails, and a "no window found" result is still a clean answer. **Caveat:** the evidence mixes different tests (glowing bacteria, metabolism, growth), so treat it as a hypothesis, not a finding.

---

## 4. Decisions for Wed 30 Sep

**D1. Research question.** Recommended: adopt the review's wording.

> *Can a chemistry-based model minimize the cost of sulfamethoxazole treatment in an iron–persulfate flow reactor while meeting a predefined antibacterial-activity limit in blind tests?*

It has no "and." It swaps "no remaining activity" for a limit you set in advance, because no test can prove zero. It names the actual reactor. **Drop** the 28 Sep "sharper" question, since its novelty rests on the false claim.

**D2. Hypothesis.** Use the transient-window hypothesis in section 3 instead of "sulfate radicals make nitro-SMX, which is worse."

**D3. Novelty sentence for the poster and judges:**

> "Others have measured leftover antibacterial activity after treatment, predicted it for other sulfonamides, and optimized treatment using risk estimates. We test whether predicting activity from reaction chemistry picks cheaper *acceptable* settings for an iron–persulfate reactor than planning on drug removal alone, and we check it with a blind test."

**D4. Stay with SMX alone.** Don't add trimethoprim (the review agrees; mixtures are much harder).

**Retire these claims everywhere:** "novel as a combination"; "no study connects sulfate radicals to active SMX pieces"; "no one regulates antibacterial activity" (say "California's recycled-water bioassays don't include an antibacterial endpoint"); "10% peroxide use means 90% could be saved"; the old €1.2 billion EU figure (now €1.48–1.8 billion/yr by 2045); "Valley Water's center is a potable-reuse plant" (it's non-potable today).

# Pivot assessment: chlorine + ciprofloxacin vs persulfate + SMX (29 Sep 2026)

**Status: CURRENT. Recommendation for the Wed 30 Sep decision, not yet adopted by the team.**
**Verdict: switch to chlorine (free chlorine vs chloramine) + ciprofloxacin in wastewater effluent.** It's better on real-world relevance, measurement feasibility, and evidence that the "removed but still active" effect exists. Its novelty is about the same, with a clearer gap.

---

## 1. Side by side

| | Persulfate + SMX (current) | Chlorine + ciprofloxacin (proposed) |
|---|---|---|
| Used in real plants? | No. Niche; groundwater cleanup mainly (Lee, von Gunten & Kim 2020) | **Yes, nearly everywhere.** San José–Santa Clara plant chlorinates, dechlorinates, sends ~80% via Artesian Slough → **Coyote Creek** → Bay, ~20% to recycled water |
| Evidence of activity surviving drug removal | Mixed: Ao 2018 (UV/PMS, early active TPs) vs Zhang 2016 (UV/PDS, no active TPs) and Yu 2022 (Fe/PDS, detoxified) | **Direct:** Jaén-Gil 2020, cipro activity **rose after complete removal** at >0.5 mg Cl₂/L; chlorinated TP296 kept 30–44% of cipro's activity at 2–4 mg Cl₂/L. Kennedy Neth 2019: active products for all 3 fluoroquinolones tested (none for SMX/TMP) |
| Resistance relevance | Weak: SMX resistance PNEC 16 µg/L | **Strong:** cipro PNEC 0.064 µg/L; real effluents 0.20–1.4 µg/L (Batt 2007); 1 µg/L enriched resistance genes in biofilms (Kraupner 2018) |
| Kinetic data for the model | Scattered; mesh iron release unknown | **Dodd et al. 2005:** cipro + HOCl and + combined chlorine rate constants, checked in real waters |
| Bacteria-test feasibility | Hard: *E. coli* weakly sensitive to SMX (mg/L); thymidine masks it | **Easier:** *E. coli* highly sensitive to cipro (MIC ~0.01 mg/L, I believe; check); no thymidine problem |
| Safety / cost | Persulfate is a strong oxidizer; LC-MS-heavy | Dilute bleach, thiosulfate/bisulfite, DPD kits; cheaper. **Never mix concentrated bleach and ammonia.** |
| Drinking-water link | Indirect | Direct (chlorine used in drinking water; effluent feeds recycled water) |

## 2. Novelty: what exists and what doesn't

**Exists (don't claim):**
- Activity measured after chlorinating cipro: Kennedy Neth 2019 (2–10 mg/L Cl₂; ultrapure water and wastewater; CT 15–140 mg·min/L); Jaén-Gil 2020.
- Kinetics and transformation pathways for cipro + chlorine: Dodd 2005.
- Cipro chlorination products detected in real reclaimed water from 4 Spanish plants, without activity testing: París-Reche 2026 (CIP 263 among the most frequent).
- Chlorination before activated carbon changing bacterial toxicity of hospital effluent: Sompornpailin 2024.

**Not found in PubMed + web searches (possible contribution):**
1. **Chloramine** (combined chlorine, common in ammonia-containing effluent) + cipro + **measured antibacterial activity**. Chloramine studies of fluoroquinolones exist only as byproduct chemistry (e.g. levofloxacin, Sun 2024).
2. A model that **predicts activity** from chlorine dose, contact time and ammonia by linking Dodd-type kinetics to product potencies.
3. Using that prediction to **choose chlorination settings** (meeting a disinfection CT target while keeping activity below a limit), tested blind.
4. **Does dechlorination bring activity back?** El Najjar 2012 showed thiosulfate converts a chlorinated levofloxacin intermediate back to the parent drug. Stanbro & Lenkevich 1982 showed some organic chloramines dechlorinate slowly with sulfite. Whether plant dechlorination regenerates active cipro from its N-chloro intermediate is untested as far as found. This is both a **measurement trap** (the quench could change the answer) and a **possible headline finding**.

**Limits:** PubMed + web only. Kennedy Neth 2019 full text was blocked; only its supplement was seen. Dodd 2005 is abstract-only. Check both before claiming a gap.

## 3. Does the research question change? Structure no, details yes

It's still a flow reactor, still a chemistry → activity → optimizer → blind test chain.

**Draft question (no "and"):**
> *Can a chemistry-based model find chlorination settings that meet disinfection targets while keeping ciprofloxacin-derived antibacterial activity below a predefined limit in blind tests?*

What changes:
- **Drug:** SMX → ciprofloxacin.
- **Oxidant:** persulfate + iron mesh → bleach (free chlorine), with or without ammonia (chloramine), then dechlorination.
- **Optimizer knobs:** chlorine dose, contact time, ammonia (free vs combined chlorine), dechlorination agent and timing. These are real plant settings.
- **Constraint:** the lower bound is a real one. Plants *must* disinfect, measured as CT (concentration × time), so chlorine can't just be cut. The model finds settings that meet CT **and** keep activity below the limit. Chlorine is cheap, so frame the objective as "least chlorine / lowest residual risk" rather than big dollar savings.
- **Hypothesis:** at typical disinfection doses, cipro disappears but chlorinated products keep measurable activity. Chloramine and dechlorination choices shift that activity in ways a drug-only model can't predict.

## 4. Reactor after the pivot

- Coiled tube = **chlorine contact chamber** (plug flow, like a plant's serpentine basin); length sets contact time.
- Pumps: bleach dose → optional ammonia dose (makes chloramine) → dechlorination injection at the outlet. Staged dosing is reused.
- Sensors: **ORP** (plants use it to control chlorination and dechlorination), pH, DPD free/total chlorine kit, photometer/fluorescence for cipro (fluoroquinolones are fluorescent, I believe; check).
- Raspberry Pi control is reused. The steel mesh is dropped.

## 5. What changes in the plan

| Milestone | Change |
|---|---|
| Oct 15 model v1 | Chemistry: HOCl/OCl⁻ speciation, cipro speciation, cipro + HOCl (Dodd 2005), chlorine demand/decay, NH₃ + HOCl → chloramine. **Needs a new validation dataset:** Pu 2020 no longer applies. Candidates: Dodd 2005 real-water decay curves (paywalled; request), Kennedy Neth 2019 author PDF, Jaén-Gil 2020. **Find this week.** |
| Nov 15 prototype | Contact-chamber tube + tracer test; DPD + ORP calibration; cipro photometer/fluorescence calibration |
| Dec 15 assay | Cipro dose–response in *E. coli* (should be far more sensitive). Quench validation is critical: compare thiosulfate, bisulfite, ascorbate, since reversion is possible |
| Jan–Feb | Window scan across CT with free chlorine vs chloramine; dechlorination test; optimizer; blind test |
| Mar | Real effluent sample (e.g., ask San José–Santa Clara or a local plant for pre-disinfection effluent) |

Parts order: cheaper (no persulfate, no mesh; add DPD kit, bleach, ammonium chloride, sodium bisulfite, cipro powder).

## 6. What would change the verdict
- Kennedy Neth 2019 or another paper already models activity across CT or tests chloramine → narrow the claim to the dechlorination question or the blind decision test.
- *E. coli* K-12 cipro sensitivity turns out poor in resazurin (unlikely) → switch detector.
- School or SRC won't allow cipro handling → stay with persulfate + SMX.

# Roadmap: every phase, step and reason (chlorine + ciprofloxacin version)

**Last updated:** 2026-10-16 (Checkpoint A confirmed on digitized Dodd data); rev. 3 2026-10-05 (HPLC-UV at BioCurious is the main cipro measurement; Dodd 2005 constants in the model). **Status: CURRENT, but `project-state.md` is newer for status.** Deliverable owners and handoffs: `deliverables-and-split.md` (proposed Oct 16 split in `project-state.md`). Day-by-day for Phase 1: `oct15-prototype-sprint.md`. Partner A = chemistry + reactor, Partner B = activity + optimizer.

**Research question (draft):** Can a chemistry-based model find chlorination settings that meet disinfection targets while keeping ciprofloxacin-derived antibacterial activity below a predefined limit in blind tests?

**The idea in plain words:** San José's wastewater plant disinfects its cleaned water with bleach (sodium hypochlorite), then removes the leftover bleach with sodium bisulfite before the water flows to Coyote Creek and the Bay (switched from chlorine gas / sulfur dioxide in 2011). Chlorine turns ciprofloxacin (cipro) into "N-chloro-cipro" in under a second; that falls apart over roughly 15–20 minutes, and **every product keeps the quinolone core** (the part of cipro that attacks bacteria) (Dodd 2005). Two open questions: (1) do those products still stop bacteria, and (2) does the bisulfite step turn leftover N-chloro-cipro back into cipro? (Dodd 2005 suggested this could happen at plants but never measured it.) The model predicts both and picks settings that disinfect while leaving the least activity.

**Key published facts this plan rests on**
- Dodd et al. 2005 (Environ. Sci. Technol. 39:7065, doi 10.1021/es050054e; PDF in hand): species-specific cipro + HOCl constants (Table 3); N-chloro-cipro breakdown 2.4 × 10⁻⁴ (pH 4.6) to 7.6 × 10⁻⁴ s⁻¹ (pH 8.6); cipro + combined chlorine k′ = 4.4 × 10⁻⁴ s⁻¹ at 15 µM (pH 7); all products keep the core; thiosulfate/sulfite reverse N-chloro-cipro; real-water validation (Fig. 5a). Measured cipro by HPLC with UV and fluorescence detectors.
- Jasper, Shafaat & Hoffmann 2016 (doi 10.1021/acs.est.6b02912; SI free): independent breakdown rate 5.6 × 10⁻⁴ s⁻¹ at pH 8.7 (35% below Dodd's model value); thiosulfate quench reverts the intermediate.
- Jaén-Gil 2020 (doi 10.1021/acs.est.0c00944): antibacterial activity rose after complete cipro removal at > 0.5 mg Cl₂/L. Kennedy Neth 2019: active products from fluoroquinolones.

**Checkpoints** are yes/no tests. If one fails, follow its "if it fails" line.

## How cipro and its products are measured

**Main method: HPLC with a UV detector at BioCurious** (community biology lab). HPLC (high-performance liquid chromatography) pushes the sample through a packed column. Different molecules come out at different times ("retention times"), and the UV detector measures each as a separate peak. This solves the core problem: cipro and all its products absorb UV the same way because they share the quinolone core, so only separation tells them apart.

| Item | Plan (start from Dodd 2005's conditions, adjust to the column BioCurious has) |
|---|---|
| Column | Reversed-phase C18 or similar (Dodd used a Supelco Discovery RP-Amide C16) |
| Mobile phase | Acidic phosphate buffer (pH ~2–3) mixed with acetonitrile, gradient or fixed ratio |
| Detection | UV ~278 nm (cipro's absorption peak; Dodd's fluorescence excitation wavelength). Dodd reports UV detection limits around 100 nM (~33 µg/L), fine for lab-level 1 mg/L starting cipro |
| Calibration | Cipro standards 0.05–2 mg/L each session; repeat injections for precision |
| Products | No pure product standards → report as "cipro-equivalent peak area," assuming similar UV response (the core is the same). State this assumption. |
| Gap 2 test | Inject the same chlorinated sample (a) right away, (b) after bisulfite, (c) after thiosulfate. If the N-chloro-cipro peak shrinks and the cipro peak grows, that's reversal, measured directly. (Dodd isolated N-chloro-cipro by HPLC, so it can show up as its own peak.) |
| Samples per session | Keep a log of time from sampling to injection; N-chloro-cipro keeps breaking down in the vial |

**What each tool is for**

| What | How |
|---|---|
| Cipro, N-chloro-cipro, products | HPLC-UV (BioCurious) |
| Quick check between HPLC sessions | TLC under a UV lamp, or a fluorescence reading (measures cipro + products together) |
| Chlorine | DPD test kit |
| Chlorine trend; confirming bisulfite removed chlorine | ORP probe (cannot measure cipro: it reads overall oxidizing strength, dominated by chlorine) |
| Antibacterial activity | *E. coli* + resazurin test |
| Molecule identities (optional) | LC-MS via a mentor; otherwise cite Dodd's and Jasper's identified products and claim "consistent with" |

## Variables

- **Knobs the optimizer controls (independent):** chlorine dose; contact time (flow rate); ammonia added (free chlorine vs pre-formed chloramine; Cl₂ : N ratio); bisulfite dose; time between chlorination and bisulfite.
- **Conditions tested, not optimized:** pH (6.5–8.5); water recipe (lab water vs real effluent).
- **Measured / predicted (dependent):** cipro and products (HPLC), activity (% inhibition → cipro-equivalent), free and total chlorine, CT, cost per 1,000 L, prediction error.
- **Kept the same (controlled):** temperature (~22 °C); starting cipro; strain, broth, incubation; quench recipe; sampling-to-injection time.

## Deliverables 1–3 in detail: the chemistry model

Together they answer: *given a chlorine dose, contact time and ammonia level, how much cipro, chlorinated intermediate and product is in the water at the outlet?* Each is a working piece of code with its own check, so a late one doesn't hide inside a single big "model" deliverable.

### Deliverable 1 · Chlorine backbone model (what the chlorine itself does)
**Dates:** Wed Sep 30 – Fri Oct 2 · **Lead:** A

| Part | What to build | Why |
|---|---|---|
| Speciation | Split free chlorine into HOCl and OCl⁻ by pH (HOCl pKa ≈ 7.5) | HOCl is the form that attacks cipro; pH 7 vs 8 changes the speed several-fold |
| Chlorine demand/decay | A simple first-order loss of free chlorine to background organics (one fitted rate) | Real effluent eats chlorine; without this the model overestimates exposure |
| Chloramine formation | NH₃ + HOCl → NH₂Cl (rate constant ≈ 4×10⁶ M⁻¹s⁻¹, I believe; verify) | Ammonia in effluent converts free chlorine to chloramine, which reacts much more slowly with cipro. This is one of the knobs |
| CT output | Running integral of chlorine concentration × time | CT is how regulators judge disinfection; it becomes the optimizer's minimum requirement |

**Output:** free and combined chlorine vs time, plus CT. **Done when:** it runs, concentrations never go negative, and chlorine falls faster with more ammonia or organics.

### Deliverable 2 · Ciprofloxacin reaction model (what happens to the drug)
**Dates:** Fri Oct 2 – Wed Oct 7 · **Lead:** A, with B checking which products the activity model needs

| Part | What to build | Why |
|---|---|---|
| Cipro speciation | Split cipro into its charge forms by pH (check pKa values; commonly quoted ≈ 6.1 and 8.7) | Reaction speed depends on which form is present |
| Cipro + HOCl | Fast reaction at the piperazine nitrogen, forming an **N-chloro-cipro intermediate** (rate constants from Dodd 2005) | The main way cipro disappears |
| Cipro + chloramine | Slower reaction (Dodd 2005 combined-chlorine data) | Needed to compare free chlorine vs chloramine |
| Intermediate → products | N-chloro-cipro breaks down (piperazine fragmentation) into **2–3 lumped product groups**, e.g. "chlorinated products that keep the quinolone core" vs "further-degraded products" | The activity model scores these groups. The quinolone core is the part that kills bacteria, so keeping it separate matters (Jaén-Gil's chlorinated TP296 kept 30–44% activity) |
| Dechlorination step | Thiosulfate/bisulfite removes chlorine; **optional reaction: intermediate → back to cipro** | Tests the "does dechlorination bring the drug back?" question (El Najjar 2012 saw this for levofloxacin). Leave the rate as an unknown to measure |

**Output:** cipro, intermediate and product-group concentrations vs time. **Done when:** cipro disappears within seconds to minutes at mg/L chlorine (matching Dodd's fast kinetics), and more slowly with chloramine.

### Deliverable 3 · Flow-chamber model + validation (does it match reality?)
**Dates:** Wed Oct 7 – Wed Oct 14 · **Lead:** A; **B** runs the mini blind test and builds the drug-only baseline (Deliverable 4)

| Part | What to build | Why |
|---|---|---|
| Flow model | Contact chamber as a series of small mixed tanks (tanks-in-series); number of tanks set later from the Nov tracer test | Plant contact basins and a coiled tube behave like plug flow; this approximates it simply |
| Dosing points | Bleach at the inlet, optional ammonia, dechlorinating agent at the outlet | Matches the real reactor and plant layout |
| Published-data comparison | Digitize one dataset (candidates: Dodd 2005 real-water decay curves, Kennedy Neth 2019 author PDF, Jaén-Gil 2020); fit **only 1–2 numbers** (e.g. chlorine demand rate) | First honest test; fitting everything would hide errors |
| Mini blind test | Predict a second published condition without re-tuning; report % error | Practice for the real blind test |
| Drug-only baseline (Deliverable 4) | Assumes activity falls exactly as cipro falls | The comparison model; nearly free once Deliverable 2 exists |

**Output:** comparison plot with % error, blind-test error, 1-page summary. **Checkpoint A (Oct 15):** within ~20% of the published cipro decay curve. *If not:* check units, pH and speciation first; they cause most errors.

**Validation data blocker:** Pu 2020 no longer applies. Finding a usable published dataset is a **this-week task** (library request for Dodd 2005; try the Kennedy Neth author PDF).

## 1. Read this before filling in the form

**Three things block the application as it stands.** None of them are budget problems.

### 1.1 An individual cannot be the applicant

Valley Water's Mini-Grant page states that individuals cannot apply directly. An organised community group can, provided it has "an established structure" and names an individual responsible for signing. Schools and colleges are separately listed as eligible.

So the applicant of record has to be one of:

- **MVHS or FUHSD** — the cleanest route, and it makes lab space, a supervising teacher and school equipment legitimate in-kind contributions rather than assumptions.
- **A school club with officers and a faculty advisor** — may satisfy "established structure." Confirm with the grants team.
- **A watershed or creek non-profit** that agrees to sponsor the project.

### 1.2 The published figures disagree with each other

| | Mini-Grant landing page | Mini-Grant detail page |
|---|---|---|
| Maximum award | $10,000 | **$5,000** |
| Match required | None | **At least 25 % of total project cost, monetary or in-kind** |

The budget below is built to the **conservative reading** — a request under $5,000 with match well above 25 % — so it is valid either way. Confirm the real figures with the grants team before submitting.

### 1.3 The project needs a public-benefit component

Mini-Grant projects must deliver public benefit under water conservation, flood protection or environmental stewardship, and must carry Valley Water's logo on project materials. A school-lab project delivers none of that as scoped, so the budget keeps a real outreach task: two public workshops (now demonstrating the blue-to-pink bacteria test and the model), a handling demonstration unit, and an open release of the model code, device design, test protocol and dataset. Outreach costs about 50 person-hours; decide whether to run it before or after the March 2027 fair.

**Framing for the application (new):** the project gives utilities a way to check that treated water no longer carries antibacterial activity, and uses the model to cut chemical dosing. Local tie: Valley Water's purified-water program and its RO concentrate discharges to the Lower South Bay.

## 1. The project in one paragraph

Water treatment plants chlorinate to kill germs. Chlorine also destroys antibiotics present in the water — but the broken pieces keep the part of the molecule that attacks bacteria, so the water can remain antibacterial after the drug itself is gone. Plants only measure the drug. This project builds a chemistry-based model that predicts the leftover antibacterial strength, uses it to choose chlorine settings that disinfect properly while keeping that strength under a pre-declared limit, and checks the prediction with a blind test. The antibiotic is **ciprofloxacin**; the setting is modelled on the San José–Santa Clara wastewater plant, which chlorinates with bleach and dechlorinates with sodium bisulfite. Target: Synopsys science fair, around March 2027. Two partners, A and B.

**The project changed direction twice.** On 2026-09-26 it became computation-first. On 2026-09-29 it switched from persulfate + sulfamethoxazole to chlorine + ciprofloxacin. A large part of this folder predates one or both changes. Section 3 tells you which.

## 5. Known contradictions, as of 17 October

These are tracked in full under "Conflicts to resolve" in `project-state.md`. The ones most likely to mislead you:

- The model treats the coiled tube with straight-tube physics and ignores the swirl that coiling creates. The 3D simulator shows this overstates how much the water spreads out — around 2 to 3 percent error instead of the model's 34 percent. Fixing it is a scheduled task, not a discovered bug.
- Kennedy Neth's measurements say about a third of the ciprofloxacin survives two hours of chlorination; the model says none does. **The two published labs disagree with each other**, and the likely cause is the chemical each used to stop the reaction before measuring. Unresolved, and a planned experiment.
- The machine-learning layer does not exist. Poster graphics made in October describe an "ML optimiser controlling the reactor." It is scheduled for January–February. Until then, say "mechanistic kinetic model plus Bayesian optimisation."
- `CLAUDE.md` section 2 was rewritten on 17 October for the current plan, but its decision log necessarily still records the older plans as history. Read dates carefully there.

## 6. If you are an AI assistant, these are the mistakes made here before

1. **The project is chlorine and ciprofloxacin.** Any mention of persulfate, sulfamethoxazole, SMX, sulfate radicals, iron mesh, nitro-SMX, radish seedlings, 3D-printed lattices or 47 runs belongs to an abandoned plan. Do not blend the two.
2. **It is a flow reactor, not a filter.** Nothing is trapped or separated. Every molecule that enters leaves, broken. Never write "filter."
3. **Never claim novelty before searching.** This was gotten wrong twice — once by reasoning ahead of the search, then again after a search that was too narrow. A specific claim like "no study connects X to Y" turned out to be false, published, and easy to find. Before any gap claim, search the specific oxidant *plus* the specific drug *plus* "antibacterial activity."
4. **Do not quote what has not been read.** The documents label each source as full text, abstract, or snippet. Respect the labels — one earlier source was wrongly recorded as "full text read" and had to be corrected.
5. **Removal and activity are different things**, and so are acute toxicity, resistance selection and drinking-water safety. Keep them separate in every sentence.
6. **Plain language, and define every term and acronym the first time.** This is a high-school project and the documents are read by teachers and judges.
7. **Say when you are unsure.** "I believe, but haven't checked" is the expected phrasing here, and the owner checks claims.
8. **Do not overstate impact.** No lives saved, no guaranteed savings, no "nobody has ever considered this."
9. **Formatting for documents headed to Google Drive:** no LaTeX, no dollar-sign math, no HTML superscript or subscript tags — they get mangled on upload. Use plain Unicode: × for times, ⁻¹ and ² for exponents, ₂ for subscripts, → for reactions.
10. **Research subagents are usually auto-declined in this owner's app** — only one of eight launches ran. For unattended work, research directly with search tools rather than delegating.
