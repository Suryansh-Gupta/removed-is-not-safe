# Building the 3D lattice — reactor catalyst support

Covers the "design the lattice" and "print the lattice" steps. The bench procedure for
loading catalyst onto a printed part lives in `team-roadmap-v2.md` (The Bench Bible); the
week it happens in is in `schedule-v3-feasible.md`. **This doc holds geometry and printing
only.**

Last updated: 2026-09-13 — geometry regenerated and every number in it re-measured from the
mesh. Four figures in the 09-11 version were wrong; they are corrected below and flagged in
§8.

---

## 0. What you're getting and why there are two

Two lattices, both 23 mm ⌀ × 80 mm, both **measured** at 60.0 % open, both print-ready:

| | **Gyroid** | **Cross-hatch** |
|---|---|---|
| Geometry | sheet TPMS, 8 mm cell | cubic strut grid, 6 mm cell |
| Wall / strut | 1.04 mm wall | 2.71 mm strut, 3.29 mm channel |
| Measured open fraction | 0.600 | 0.601 |
| Wetted area, whole part | 265 cm² | 180 cm² |
| Wetted area, lattice region only | 224 cm² | 141 cm² |
| Specific area per mL of void | 635 mm²/mL | 399 mm²/mL |
| Straight axial channels | **none** — 10.7 mm² of line-of-sight out of 415 mm² | **12 channels**, 3.29 mm square, 107.5 mm² measured clear |
| PETG per part | 17.5 g | 17.4 g |
| Best suited to | catalyst **option 2** (alginate + iron-oxide dip coat) | catalyst **option 1** (threaded steel wool) |

The split matters because the two catalyst options have opposite requirements. Option 1 says
"thread the wool through the channels of the printed lattice" — a gyroid has no channels to
thread; it is a continuous curved wall with essentially no straight-line path through it.
Option 2 dip-coats a surface, and there the gyroid's 47 % extra wetted area is the whole
point.

Print both and settle it in the baseline runs rather than by argument. That also gives you a
legitimate methods sentence — *"support geometry was selected by comparing conversion per
pass at fixed iron mass across two printed geometries"* — instead of "we picked a lattice."

---

## 1. Two corrections to the original spec — read this before printing

### 1.1 A 20 mm lattice would have leaked about half your flow around the outside

A 20 mm lattice in a 25 mm ID tube, sliding in "with a little gap," leaves an annulus of
**176.7 mm²**. The open frontal area of a 60 %-porous 20 mm lattice is **188.5 mm²**. The
annulus is smooth-walled and offers far less resistance than the tortuous lattice, so the
honest reading is that **at least 48 % of your water — probably more — would bypass the iron
entirely.**

That isn't a small efficiency loss. It would:

- inflate your apparent residence time, because water in the annulus is in the tube but not
  in the reactor;
- **compress the iron-loading variable**, since doubling iron on a lattice that only sees
  half the flow barely moves conversion — which would show up in the SHAP analysis as "iron
  mass doesn't matter much," a wrong conclusion you would then have to defend at judging;
- and get worse at high flow, because bypass fraction rises with flow rate, which would alias
  into your residence-time axis.

**The fix, built into these files:** the lattice core is 23 mm, and each end carries an
integral 2 mm collar ring of 24.6 mm OD that seals the annulus against the tube wall.

**Corrected number:** the remaining annular area at the collar is **15.6 mm²**, not the
1.5 mm² the 09-11 version of this doc claimed — that figure was off by a factor of ten.
π/4 × (25² − 24.6²) = 15.6 mm². The argument survives the correction, because what stops
bypass is resistance, not area, and a thin slit's resistance goes as the **cube** of the gap.
Treating the lattice as a Kozeny–Carman porous medium (ε = 0.6, ~3 mm pore scale) and the
collar gap as a 0.2 mm annular slit in series with the 1 mm annulus between the collars:

| | bypass fraction, estimated |
|---|---|
| the original 20 mm lattice, 2.5 mm gap, no collars | **~80 %** — worse than the ≥48 % the area argument suggested |
| 23 mm lattice, 1 mm gap, no collars | ~18 % |
| 23 mm with collars, part centred | **~3 %** |
| 23 mm with collars, part pushed fully to one side | ~8 % |

Those are laminar order-of-magnitude estimates from a permeability correlation, not
measurements — which is exactly why the dye-pulse check in §6 is worth the ten minutes. The
eccentric case is the one to care about: it is the difference between a part that is
centred by its own collars and one that sags. If your printed collars end up loose in the
tube, that is not cosmetic.

### 1.2 Your reactor void volume is ~35 mL, not 50 mL

50 mL is the volume of the *empty* 25 × 100 mm tube (49.1 mL). Once a lattice is in it:

| | measured solid | void volume | flow for τ = 2 min | flow for τ = 20 min |
|---|---|---|---|---|
| Gyroid fitted | 13.79 cm³ | **35.3 mL** | 17.7 mL/min | 1.77 mL/min |
| Cross-hatch fitted | 13.72 cm³ | **35.4 mL** | 17.7 mL/min | 1.77 mL/min |
| (the old 50 mL figure) | — | 49.1 mL | 25.0 mL/min | 2.50 mL/min |

Using 50 mL would overstate every residence time by about 39 %. Residence time is one of the
**three** optimizer axes (pH, persulfate dose, residence time — iron mass was fixed after the
baselines), and it gets reported in the paper, so fix it in the spreadsheet before any
optimizer run, not after.

**Corrected number:** the two geometries differ by 0.07 cm³ of solid, not by the ~1 mL the
09-11 version implied. That is arithmetic, not opinion — two parts at the same porosity in
the same envelope must displace nearly the same volume, and the old figures (17.3 g vs 16.4 g
at 0.600 vs 0.597 open) could not both be right. Switching geometry mid-project therefore
does **not** meaningfully change your void volume. It changes wetted area by 47 %, which is
the thing worth caring about.

Best practice is unchanged, and it overrides every number above: **measure it.** Fill the
assembled reactor, lattice in place, from a measuring cylinder and record what it takes. Put
that measured value in `void_volume_mL_measured` and photograph the measurement for the
logbook. `residence_min = void_volume_mL_measured ÷ flow_mL_min`.

---

## 2. Route A — print the supplied STLs (fastest)

### 2.1 Files

Regenerated 2026-09-13 by `lattice_gen.py` (stored alongside this doc) and verified:

- `lattice_gyroid_23x80.stl` — 506,508 triangles
- `lattice_crosshatch_23x80.stl` — 253,496 triangles
- `fit_test_coupon_23x12.stl` — a 12 mm slice of the cross-hatch with both collars
- `lattice_report.json` — every measured number, including the checks below

All three are watertight (zero boundary edges, zero non-manifold edges, zero degenerate
triangles, confirmed by reading the written files back off disk), one connected piece, and
percolating inlet-face to outlet-face. If you regenerate, the script re-runs all of that and
tells you if a part fails.

### 2.2 Print the fit coupon first

The coupon takes a few minutes and 3.0 g. Printing four 80 mm lattices before checking the
fit is how you lose an evening.

1. Print the coupon in the same PETG, on the same printer, at the settings below.
2. Try it in your reactor tube. It should slide with light finger pressure and no
   side-to-side rattle.
3. If it won't go: most FDM printers print outside dimensions 0.1–0.2 mm oversize. Sand the
   collar edges lightly, or set horizontal expansion / XY size compensation to −0.15 mm and
   reprint.
4. If it rattles: your tube's ID is over 25 mm. Regenerate at a larger collar (§4) rather
   than shimming — a rattling part is an eccentric part, and §1.1 is why that matters.
5. Write the measured tube ID and the coupon result in the logbook. It's a real dimension in
   your methods section.

### 2.3 Slicer settings (PETG)

| Setting | Value | Why |
|---|---|---|
| Nozzle / layer | 0.4 mm / 0.20 mm | 0.15 mm for the gyroid if the curves look coarse |
| Nozzle temp | 235–245 °C | your filament's sheet wins over this |
| Bed | 80 °C | |
| Perimeters | 3, with "detect thin walls" on | 1.04 mm wall ≈ 2.6 extrusion widths; you want it solid, not hollow |
| Infill | 100 % | features are thinner than any infill pattern |
| Supports | **none** | both geometries are self-supporting |
| Orientation | cylinder axis vertical | collars give a 24.6 mm disc of bed contact |
| Brim | 5 mm | tall and narrow; it will get knocked otherwise |
| Cooling | 40–60 % | higher than usual PETG — there is bridging in both lattices |
| Print one at a time | yes | PETG strings badly between multiple small parts |

Slice it for a real time estimate; it will be a few hours per lattice, and you need four of
each geometry plus spares, so start them early and let them run in the background while you
do the catalyst work.

### 2.4 Check before you use them

1. Hold each lattice up to a light. The gyroid should glow evenly with no solid blobs; the
   cross-hatch should show 12 clean square channels straight through.
2. Push water through with a syringe. It should pass with light pressure. If a channel is
   blocked by a print blob, clear it with a paperclip or bin the part.
3. Weigh each lattice, bare, on the balance and write the mass on it in permanent marker with
   an ID (`L-01`, `L-02`, …). **This is the tare for your iron loading** — "reweigh the
   lattice; the difference is the iron loading" only works if you have the bare mass per
   individual part, and printed parts vary by a few tenths of a gram.
4. Keep `lattice_id` in the master spreadsheet next to `iron_g`. You will want it when you
   ask whether the catalyst is wearing out, because "is it the iron or is it that particular
   lattice" is a question a judge will ask.

### 2.5 A note on PETG and your chemistry

PETG is the right call over PLA — PLA hydrolyses steadily in warm water and would degrade
over a 23-week project. PETG handles pH 3–9 and persulfate well at room temperature, and
nothing in your protocol goes near its ~70 °C softening point.

It is still worth proving rather than assuming, and it's nearly free: put one spare lattice
in 10 mM persulfate at pH 3 for a week, weigh it before and after, and photograph it. If it's
unchanged, that's a line in your methods that closes off an obvious "how do you know the
reactor isn't contributing?" question. It also guards against a real failure mode — if the
support shed organics it would scavenge radicals and show up as unexplained variance in your
conversion data.

---

## 3. Route B — build it yourself in CAD

Worth doing at least once. If a judge asks how the lattice was designed, "I ran a script" is
a weaker answer than "here's the geometry and here's why."

### 3.1 Cross-hatch in Tinkercad (free, ~20 minutes)

Build it **subtractively** — cutting channels out of a cylinder is far easier than arraying
struts.

1. Drop a **Cylinder**, radius 11.5 mm (diameter 23), height 80 mm, centred at the origin.
2. Drop a **Box**, 3.3 × 3.3 × 100 mm, and switch it to **Hole**. This is one axial channel.
3. Position its centre at x = 3, y = 3 (so the grid straddles the axis), running the full
   height.
4. Select the hole, Ctrl+D to duplicate, move it +6 mm in x. Ctrl+D again — Tinkercad repeats
   the last transform. Repeat until you cross the cylinder. Then select that whole row,
   Ctrl+D, move +6 mm in y, and repeat to fill the circle. Holes that end up entirely outside
   the cylinder do nothing; leave them.
5. Transverse channels: a Box 3.3 × 100 × 3.3 mm as a Hole, centred at z = 3, running through
   in y. Duplicate up the z axis at 6 mm intervals to the top.
6. Repeat step 5 rotated 90° so the channels also run through in x.
7. Select everything and **Group**.
8. Collars: two **Tube** shapes (or a cylinder-minus-cylinder), OD 24.6, ID 21.0, height
   2 mm, one at each end. Group them in as solid.

The channel size and the 6 mm pitch together set the porosity. For an infinite lattice the
open fraction is `3a² − 2a³` where `a` = channel ÷ pitch, which gives 0.599 at a 3.4 mm
channel. **On a finite 23 mm cylinder it does not:** clipping the outer cells at the wall
removes proportionally more strut than channel, so a 3.4 mm channel measures **0.63** open on
the real part, and 3.29 mm is what actually gives 0.600. That gap between the textbook
formula and the part in your hand is a good half-sentence for the poster, and §4 solves it
numerically so you never have to trust the formula.

### 3.2 Cross-hatch in Fusion 360

Same logic, much faster: sketch one 3.3 mm square on the XY plane, **Rectangular Pattern** it
at 6 mm spacing in both directions, **Extrude–Cut** through the cylinder; repeat on the XZ
and YZ planes. Keep the pitch and square size as **user parameters** (`pitch = 6mm`,
`gap = 3.3mm`) so you can re-drive the whole model from two numbers.

### 3.3 Gyroid — the honest situation

A true gyroid is a level set of `sin x·cos y + sin y·cos z + sin z·cos x`, and it isn't
practically drawable in Tinkercad or in Fusion 360's free Personal licence (volumetric
lattice sits behind a paid extension). Realistic options:

- **Use the supplied STL** and the generator in §4. This is the normal way gyroids get made;
  nobody draws them by hand.
- **nTop Education** or **MSLattice** — both free for students, both do TPMS properly.
- **Blender**, free, using a maths-driven surface. Works, but it's a weekend.

### 3.4 Route C — no CAD and no script

Every slicer already contains a gyroid generator: model a plain solid cylinder 23 × 80 mm,
then slice it with **0 perimeters, 0 top and bottom solid layers, and gyroid infill at 40 %**.
What prints is a gyroid lattice cylinder.

Be honest about what you get. The walls are a single extrusion (~0.45 mm, versus 1.04 mm
here), it has no collars, and slicer "40 % infill" is not exactly 40 % solid by volume, so
your porosity is approximate rather than measured. Fine as an emergency spare or a poster
demo piece; not what I'd put run data on.

---

## 4. Route D — regenerate with the script

`lattice_gen.py` builds both geometries as implicit fields, meshes them with marching cubes,
and — the part that matters — **bisects the wall or channel size until the measured open
fraction hits your target**, rather than trusting a nominal number. It then verifies the
result and refuses to hide a bad one.

```bash
python3 lattice_gen.py                                 # 23 mm ⌀, 80 mm, 60 % open
python3 lattice_gen.py --porosity 0.50                 # denser: more iron, more Δp
python3 lattice_gen.py --tube-id 26 --collar-od 25.6   # if your tube isn't 25 mm
python3 lattice_gen.py --hatch-cell 8                  # bigger channels, easier threading
python3 lattice_gen.py --voxel 0.25 --max-triangles 0  # finer, slower, much bigger files
```

Needs `numpy`, `scipy`, `scikit-image`. It writes the STLs plus `lattice_report.json`.

For each part it checks that the mesh is **watertight** (every edge shared by exactly two
triangles, zero boundary edges); that the solid is **one connected piece** (no floating
islands that fail mid-print); and that the pore space **runs clear from inlet face to outlet
face**, with the dead-end fraction reported. Both lattices pass all three with dead-end pore
volume under 0.02 %.

Keep that last check if you modify anything. A lattice with isolated pores traps air on first
fill, and trapped air is a slowly changing void volume — your residence time would drift
during a run in a way nothing in the spreadsheet records.

Two things the script does that are worth knowing about:

- **Porosity is measured sub-voxel**, from the field rather than from a voxel count. A hard
  voxel threshold quantises porosity in steps of several percent at any practical resolution,
  which stalls the bisection well short of the target and then reports a number the printed
  part does not have. This is how the 09-11 figures drifted.
- **The default 0.4 mm voxel is not a coarse approximation.** The fields are analytic, so
  marching cubes interpolates the true surface; every measured quantity agrees to under 1 %
  with a 0.18 mm run, at a sixth of the file size.

If you regenerate, **re-measure the void volume and re-weigh the parts.** Don't carry old
numbers over.

## 5. Loading the catalyst onto these specific lattices

### 5.1 Option 1, steel wool → use the cross-hatch

The straight channels give **107.5 mm² of measured clear cross-section** and about 8.0 cm³ of
channel volume over the 76 mm working length. (The nominal 12 × 3.29 mm squares would be
130 mm²; the difference is the channels the cylinder wall clips.)

At the 2 g upper bound, 2 g of steel wool is 255 mm³ of actual steel. Loose wool packs at
roughly 10 % of solid density, so 2 g realistically occupies around 2.5 cm³ — roughly
**a third of the channel volume**. That works, but it is the practical ceiling: much more and
you are forcing it, packing unevenly, and adding pressure drop your pump may not deliver
against. At the 0.1 g lower bound you are at about 1.5 %, a very thin thread per channel —
expect that end of the range to be hard to load reproducibly.

Practical method: cut 12 equal lengths, weigh the bundle, thread one per channel with tweezers
or a bent paperclip, and reweigh the lattice. If the mass lands outside ±5 % of target, redo
it — don't just record the actual and move on, because that value was chosen deliberately.

**Write down which channels you filled.** At 0.1 g you will be tempted to fill only some.
That changes the flow distribution, not just the iron mass, and it is exactly the kind of
uncontrolled variable that produces an unreproducible outlier at run 30.

### 5.2 Option 2, alginate + iron oxide → use the gyroid

Loading per unit area, over the 0.1–2.0 g range:

| | 0.1 g | 2.0 g |
|---|---|---|
| Gyroid (265 cm²) | 0.38 mg/cm² | 7.5 mg/cm² |
| Cross-hatch (180 cm²) | 0.55 mg/cm² | 11.1 mg/cm² |

7.5 mg/cm² is already a thick alginate-bound coat. **11.1 mg/cm² on the cross-hatch is likely
past what a single dip will hold** — expect flaking, and flaked oxide travelling downstream is
both lost catalyst and a contaminated sample. So if you go with option 2, the gyroid isn't
just better, it's close to necessary at the top of the iron range.

Either way, run the leaching test before committing. If you can't hold 2 g without shedding,
the honest move is to narrow the iron range and say why in the methods — a stated, justified
bound is a strength; an unstated one that quietly breaks is a finding you'll have to explain.

---

## 6. What this doesn't tell you

Stated plainly so none of it surprises you at judging:

- **Porosity is geometric, measured on the model — not hydraulic.** It says nothing about
  pressure drop or flow uniformity. Your 12 V pump may or may not push your target flow
  through the gyroid; find that out before you design runs around it.
- **The bypass fractions in §1.1 are estimates, not measurements.** They come from a
  permeability correlation and a slit-flow model, both laminar, both assuming a clean
  concentric fit.
- **Flow distribution across the face is unverified.** The collars stop bypass around the
  outside; they do not guarantee even flow through all 12 channels or through every region of
  the gyroid. A dye pulse (food colouring, phone video) is a cheap and convincing check, and
  it is the one that would catch an eccentric part.
- **The gyroid's pore space is two separate interpenetrating networks.** This is a real
  property of the geometry, not a defect — the measured mesh confirms both percolate end to
  end and together leave under 0.02 % dead volume. But water in one network never mixes with
  water in the other along the length of the reactor. If you use the gyroid, don't claim
  lateral mixing you don't have.
- **The wetted-area figures are the geometric area of the printed surface.** Actual catalytic
  surface area after coating is a different and much larger number, and only BET would give
  it to you. Don't let 265 cm² drift into the writeup as "catalyst surface area."
- **60 % open was inherited, not derived.** It is a reasonable starting point. If pressure
  drop turns out fine, denser (50 %) gives more iron and more contact area for free — and
  with four orders of magnitude of pumping headroom, that is still an open decision.
- **Both geometries were chosen by argument, not experiment** — that's what the baseline
  comparison is for.

#!/usr/bin/env python3
"""
lattice_gen.py — catalyst-support lattices for the AOP flow reactor.

Builds two printable lattice cylinders as implicit fields, meshes them with
marching cubes, and bisects the wall/strut thickness until the MEASURED open
fraction hits the target. Nothing here trusts a nominal porosity number.

  gyroid      sheet TPMS, for catalyst option 2 (alginate + iron-oxide dip coat)
  crosshatch  cubic strut grid with straight axial channels, for catalyst
              option 1 (threaded steel wool)

Both carry an integral collar ring at each end that seals the annulus between
the lattice and the tube wall. Without it roughly half the flow bypasses the
iron (see lattice-build-guide.md §1.1).

Every part is verified three ways before it is written:
  1. watertight  — every mesh edge shared by exactly two triangles
  2. connected   — the solid is one piece, no islands that fail mid-print
  3. percolating — pore space runs clear inlet face to outlet face, with the
                   dead-end pore fraction reported (trapped air is a slowly
                   changing void volume, i.e. a drifting residence time)

Outputs STLs plus lattice_report.json with every measured number.

    python3 lattice_gen.py
    python3 lattice_gen.py --porosity 0.50
    python3 lattice_gen.py --tube-id 26 --collar-od 25.6
    python3 lattice_gen.py --hatch-cell 8
    python3 lattice_gen.py --voxel 0.15          # finer, slower, bigger files

Requires numpy, scipy, scikit-image.
"""

import argparse
import json
import os
import struct
import sys
import time

import numpy as np
from scipy import ndimage
from skimage import measure

PETG_DENSITY = 1.27  # g/cm^3


# ----------------------------------------------------------------------------
# geometry fields  (all fields are >= 0 inside the solid, in approximate mm)
# ----------------------------------------------------------------------------

def axes(p):
    """Voxel centre coordinates for the bounding box, with 3 voxels of padding
    so marching cubes always closes the surface at the domain edge.

    Everything is offset by half a voxel so that no sample lands exactly on a
    face of the geometry. Field values of exactly zero are what produce
    degenerate triangles and non-manifold edges in marching cubes."""
    v = p["voxel"]
    pad = 3 * v
    off = 0.5 * v
    half = p["collar_od"] / 2 + pad
    x = (np.arange(-half, half + v, v) + off).astype(np.float32)
    y = x.copy()
    z = (np.arange(-pad, p["length"] + pad + v, v) + off).astype(np.float32)
    return x, y, z


def radial(x, y):
    return np.sqrt(x[:, None, None] ** 2 + y[None, :, None] ** 2).astype(np.float32)


def gyroid_field(x, y, z, cell):
    """sin x cos y + sin y cos z + sin z cos x, the standard gyroid level set."""
    k = 2 * np.pi / cell
    sx, cxx = np.sin(k * x)[:, None, None], np.cos(k * x)[:, None, None]
    sy, cyy = np.sin(k * y)[None, :, None], np.cos(k * y)[None, :, None]
    sz, czz = np.sin(k * z)[None, None, :], np.cos(k * z)[None, None, :]
    return (sx * cyy + sy * czz + sz * cxx).astype(np.float32)


def crosshatch_dists(x, y, z, cell):
    """Distance from each point to the nearest channel centre line, per axis.
    Channel centres sit at cell/2 + n*cell so the grid straddles the axis."""
    h = cell / 2.0
    cx = np.abs(np.mod(x, cell) - h)[:, None, None].astype(np.float32)
    cy = np.abs(np.mod(y, cell) - h)[None, :, None].astype(np.float32)
    cz = np.abs(np.mod(z, cell) - h)[None, None, :].astype(np.float32)
    return cx, cy, cz


def collar_field(r, z, p):
    """Two solid rings, one at each end, sealing the lattice-to-tube annulus."""
    zz = z[None, None, :]
    ring = np.minimum(r - p["collar_id"] / 2, p["collar_od"] / 2 - r)
    lo = np.minimum(zz - 0.0, p["collar_h"] - zz)
    hi = np.minimum(zz - (p["length"] - p["collar_h"]), p["length"] - zz)
    return np.maximum(np.minimum(ring, lo), np.minimum(ring, hi)).astype(np.float32)


def build(geometry, thickness, p, x, y, z, r, cache):
    """Assemble the full implicit field for one geometry at one thickness."""
    core_r = p["core_dia"] / 2
    zz = z[None, None, :]

    if geometry == "gyroid":
        g = cache["g"]
        # |g| <= thickness_param is the sheet; divide by the level-set gradient
        # scale to get an approximate millimetre field for clean intersections.
        scale = 2 * np.pi / p["gyroid_cell"]
        lattice = (thickness - np.abs(g)) / scale
    else:
        cx, cy, cz = cache["cx"], cache["cy"], cache["cz"]
        half = thickness / 2.0  # half the channel opening
        void = np.maximum(
            np.maximum(
                np.minimum(half - cx, half - cy),   # channels along z
                np.minimum(half - cy, half - cz),   # channels along x
            ),
            np.minimum(half - cx, half - cz),       # channels along y
        )
        lattice = -void

    core = np.minimum(lattice, core_r - r)
    core = np.minimum(core, np.minimum(zz - 0.0, p["length"] - zz))
    field = np.maximum(core, cache["collar"])
    field[field == 0] = np.float32(-1e-6)
    return field


def open_fraction(field, x, y, z, p):
    """Measured, not nominal: open volume over cylinder volume, in the lattice
    region only (collars excluded at both ends).

    Uses the sub-voxel solid fraction implied by the field rather than a hard
    threshold. A hard threshold quantises porosity in steps of several percent
    at any practical voxel size, which stalls the bisection well short of the
    target and reports a number the printed part does not have."""
    core_r = p["core_dia"] / 2
    rr = radial(x, y)
    region = (rr < core_r) & (z[None, None, :] > p["collar_h"]) & (
        z[None, None, :] < p["length"] - p["collar_h"]
    )
    frac = np.clip(0.5 + field / p["voxel"], 0.0, 1.0)
    total = np.count_nonzero(region)
    return float(1.0 - frac[region].sum() / total) if total else 0.0


def mesh_volume(verts, faces):
    """Exact enclosed volume of the mesh that actually gets printed, by the
    divergence theorem — not a voxel count."""
    a, b, c = verts[faces[:, 0]], verts[faces[:, 1]], verts[faces[:, 2]]
    return float(abs(np.einsum("ij,ij->i", a, np.cross(b, c)).sum()) / 6.0)


# ----------------------------------------------------------------------------
# meshing, checks, export
# ----------------------------------------------------------------------------

def mesh(field, x, y, z):
    verts, faces, _, _ = measure.marching_cubes(
        np.ascontiguousarray(field), level=0.0,
        spacing=(x[1] - x[0], y[1] - y[0], z[1] - z[0]),
    )
    verts = verts + np.array([x[0], y[0], z[0]], dtype=verts.dtype)
    return verts, faces


def decimate(verts, faces, max_tri):
    """Marching cubes at a useful voxel size produces meshes too heavy for a
    school laptop's slicer. Reduce the triangle count before anything is
    measured or checked, so the numbers in the report describe the file that
    actually gets printed."""
    if max_tri <= 0 or len(faces) <= max_tri:
        return verts, faces
    try:
        import fast_simplification
    except ImportError:
        print("    (fast-simplification not installed; shipping the full mesh)")
        return verts, faces
    v, f = fast_simplification.simplify(
        verts.astype(np.float32), faces.astype(np.int32),
        target_reduction=1.0 - max_tri / len(faces))
    return np.asarray(v, dtype=np.float64), np.asarray(f, dtype=np.int64)


def triangle_areas(verts, faces):
    a, b, c = verts[faces[:, 0]], verts[faces[:, 1]], verts[faces[:, 2]]
    return 0.5 * np.linalg.norm(np.cross(b - a, c - a), axis=1)


def check_watertight(verts, faces):
    """Every edge must be shared by exactly two triangles."""
    q = np.round(verts, 5)
    _, idx = np.unique(q, axis=0, return_inverse=True)
    f = idx[faces]
    e = np.concatenate([f[:, [0, 1]], f[:, [1, 2]], f[:, [2, 0]]], axis=0)
    e = np.sort(e, axis=1)
    _, counts = np.unique(e, axis=0, return_counts=True)
    return {
        "watertight": bool(np.all(counts == 2)),
        "boundary_edges": int(np.count_nonzero(counts == 1)),
        "nonmanifold_edges": int(np.count_nonzero(counts > 2)),
    }


def check_connected(solid):
    """One printable piece — 6-connectivity, so diagonal touching does not
    count as joined."""
    lab, n = ndimage.label(solid, structure=ndimage.generate_binary_structure(3, 1))
    if n == 0:
        return {"solid_components": 0, "largest_component_fraction": 0.0}
    sizes = np.bincount(lab.ravel())[1:]
    return {
        "solid_components": int(n),
        "largest_component_fraction": float(sizes.max() / sizes.sum()),
    }


def check_percolation(solid, x, y, z, p):
    """Pore space must run clear from the inlet face to the outlet face.
    Isolated pores trap air on first fill and make void volume drift."""
    core_r = p["core_dia"] / 2
    rr = radial(x, y)
    inside = (rr < core_r) & (z[None, None, :] >= 0) & (z[None, None, :] <= p["length"])
    void = inside & ~solid
    lab, n = ndimage.label(void, structure=ndimage.generate_binary_structure(3, 1))
    if n == 0:
        return {"percolates": False, "dead_end_pore_fraction": 1.0}

    zi = np.where((z >= 0) & (z <= p["length"]))[0]
    inlet = set(np.unique(lab[:, :, zi[0]])) - {0}
    outlet = set(np.unique(lab[:, :, zi[-1]])) - {0}
    through = inlet & outlet

    sizes = np.bincount(lab.ravel())
    total = sizes[1:].sum()
    open_vol = sum(int(sizes[i]) for i in through)
    return {
        "percolates": bool(through),
        "through_components": len(through),
        "dead_end_pore_fraction": float((total - open_vol) / total) if total else 0.0,
    }


def axial_line_of_sight(solid, x, y, z, p):
    """Straight-through open area: columns with no material anywhere along the
    axis. This is what makes the cross-hatch threadable with steel wool and the
    gyroid not, and it is also the short-circuit path if it gets too large."""
    core_r = p["core_dia"] / 2
    rr = radial(x, y)[:, :, 0]
    zi = (z >= 0) & (z <= p["length"])
    clear = ~solid[:, :, zi].any(axis=2) & (rr < core_r)
    return round(float(np.count_nonzero(clear) * p["voxel"] ** 2), 1)


def write_stl(path, verts, faces):
    """Binary STL. Normals left at zero — every slicer recomputes them."""
    tris = verts[faces].astype(np.float32)
    n = len(faces)
    with open(path, "wb") as fh:
        fh.write(b"lattice_gen.py  AOP reactor catalyst support".ljust(80, b" "))
        fh.write(struct.pack("<I", n))
        buf = np.zeros((n, 12), dtype=np.float32)
        buf[:, 3:] = tris.reshape(n, 9)
        rec = np.zeros((n, 50), dtype=np.uint8)
        rec[:, :48] = buf.view(np.uint8).reshape(n, 48)
        fh.write(rec.tobytes())
    return os.path.getsize(path)


# ----------------------------------------------------------------------------
# driver
# ----------------------------------------------------------------------------

def bisect_thickness(geometry, p, x, y, z, r, cache, lo, hi, target, tol=0.0015):
    """Bisect until the MEASURED open fraction hits the target.

    For the gyroid the bisected value is the sheet thickness (thicker -> less
    open). For the cross-hatch it is the channel opening (wider -> more open),
    so the branch inverts."""
    thicker_closes = (geometry == "gyroid")
    mid, phi, field = 0.5 * (lo + hi), None, None
    for _ in range(40):
        mid = 0.5 * (lo + hi)
        field = build(geometry, mid, p, x, y, z, r, cache)
        phi = open_fraction(field, x, y, z, p)
        if abs(phi - target) < tol:
            break
        too_open = phi > target
        if too_open == thicker_closes:
            lo = mid
        else:
            hi = mid
    return mid, phi, field


def run_geometry(geometry, p, outdir, report):
    t0 = time.time()
    x, y, z = axes(p)
    r = radial(x, y)
    cache = {"collar": collar_field(r, z, p)}
    if geometry == "gyroid":
        cache["g"] = gyroid_field(x, y, z, p["gyroid_cell"])
        lo, hi = 0.01, 1.60
    else:
        cache["cx"], cache["cy"], cache["cz"] = crosshatch_dists(x, y, z, p["hatch_cell"])
        lo, hi = 0.05, p["hatch_cell"] - 0.05

    thick, phi, field = bisect_thickness(
        geometry, p, x, y, z, r, cache, lo, hi, p["porosity"])
    solid = field >= 0
    verts, faces = mesh(field, x, y, z)
    verts, faces = decimate(verts, faces, p["max_triangles"])

    solid_mm3 = mesh_volume(verts, faces)
    tube_mm3 = np.pi * (p["tube_id"] / 2) ** 2 * p["tube_len"]

    areas = triangle_areas(verts, faces)
    cen = verts[faces].mean(axis=1)
    cen_r = np.sqrt(cen[:, 0] ** 2 + cen[:, 1] ** 2)
    core = (cen_r < p["core_dia"] / 2 - 0.1) & (cen[:, 2] > p["collar_h"]) & (
        cen[:, 2] < p["length"] - p["collar_h"])
    area_core = float(areas[core].sum())
    area_all = float(areas.sum())

    info = {
        "geometry": geometry,
        "cell_mm": p["gyroid_cell"] if geometry == "gyroid" else p["hatch_cell"],
        # gyroid: sheet thickness as 2V/A, the same way the build guide quotes it.
        # crosshatch: the channel opening, exact by construction.
        "wall_or_channel_mm": round(
            float(2 * solid_mm3 / area_all) if geometry == "gyroid" else float(thick), 3),
        "strut_mm": None if geometry == "gyroid" else round(
            float(p["hatch_cell"] - thick), 3),
        "measured_open_fraction": round(float(phi), 4),
        "target_open_fraction": p["porosity"],
        "solid_volume_mm3": round(solid_mm3, 1),
        "mass_petg_g": round(solid_mm3 / 1000.0 * PETG_DENSITY, 2),
        "wetted_area_cm2": round(area_core / 100.0, 1),
        "wetted_area_total_cm2": round(area_all / 100.0, 1),
        # per mL of reactor void volume: the surface the water actually sees
        "wetted_area_per_mL_mm2": round(
            area_core / ((tube_mm3 - solid_mm3) / 1000.0), 1),
        "reactor_void_volume_mL": round((tube_mm3 - solid_mm3) / 1000.0, 2),
        "axial_line_of_sight_mm2": axial_line_of_sight(solid, x, y, z, p),
        "triangles": int(len(faces)),
        "voxel_mm": p["voxel"],
    }
    info.update(check_watertight(verts, faces))
    info.update(check_connected(solid))
    info.update(check_percolation(solid, x, y, z, p))

    name = f"lattice_{geometry}_{int(p['core_dia'])}x{int(p['length'])}.stl"
    info["file"] = name
    info["file_bytes"] = write_stl(os.path.join(outdir, name), verts, faces)
    info["seconds"] = round(time.time() - t0, 1)
    report["parts"].append(info)

    ok = info["watertight"] and info["solid_components"] == 1 and info["percolates"]
    print(f"  {geometry:10s} open {phi:.3f}  {info['mass_petg_g']:.1f} g  "
          f"{info['wetted_area_cm2']:.0f} cm2  void {info['reactor_void_volume_mL']:.1f} mL  "
          f"{'PASS' if ok else 'FAIL'}")
    if geometry == "crosshatch":
        return thick, cache
    return thick, None


def run_coupon(thick, p, outdir, report):
    """A short slice of the cross-hatch with both collars — print this first and
    check the fit before committing an evening to full-length parts."""
    q = dict(p, length=p["coupon_len"])
    x, y, z = axes(q)
    r = radial(x, y)
    cache = {"collar": collar_field(r, z, q)}
    cache["cx"], cache["cy"], cache["cz"] = crosshatch_dists(x, y, z, q["hatch_cell"])
    field = build("crosshatch", thick, q, x, y, z, r, cache)
    solid = field >= 0
    verts, faces = mesh(field, x, y, z)
    verts, faces = decimate(verts, faces, p["max_triangles"] // 5)
    solid_mm3 = mesh_volume(verts, faces)
    info = {
        "geometry": "fit_test_coupon",
        "length_mm": q["length"],
        "mass_petg_g": round(solid_mm3 / 1000.0 * PETG_DENSITY, 2),
        "triangles": int(len(faces)),
    }
    info.update(check_watertight(verts, faces))
    info.update(check_connected(solid))
    name = f"fit_test_coupon_{int(p['core_dia'])}x{int(p['coupon_len'])}.stl"
    info["file"] = name
    info["file_bytes"] = write_stl(os.path.join(outdir, name), verts, faces)
    report["parts"].append(info)
    print(f"  {'coupon':10s} {info['mass_petg_g']:.1f} g  "
          f"{'PASS' if info['watertight'] else 'FAIL'}")


def main():
    ap = argparse.ArgumentParser()
    ap.add_argument("--porosity", type=float, default=0.60)
    ap.add_argument("--tube-id", type=float, default=25.0)
    ap.add_argument("--tube-len", type=float, default=100.0)
    ap.add_argument("--core-dia", type=float, default=23.0)
    ap.add_argument("--length", type=float, default=80.0)
    ap.add_argument("--collar-od", type=float, default=24.6)
    ap.add_argument("--collar-id", type=float, default=21.0)
    ap.add_argument("--collar-h", type=float, default=2.0)
    ap.add_argument("--gyroid-cell", type=float, default=8.0)
    ap.add_argument("--hatch-cell", type=float, default=6.0)
    ap.add_argument("--coupon-len", type=float, default=12.0)
    # 0.4 mm is not a coarse approximation: the fields are analytic, so
    # marching cubes interpolates the true surface. Every measured number below
    # agrees to under 1 % with a 0.18 mm run, at a sixth of the file size.
    ap.add_argument("--voxel", type=float, default=0.40)
    ap.add_argument("--max-triangles", type=int, default=0,
                    help="decimate to this many triangles; 0 ships the raw mesh. "
                         "Aggressive reduction can introduce non-manifold edges "
                         "— the report says so if it did")
    ap.add_argument("--outdir", default=".")
    p = vars(ap.parse_args())
    outdir = p["outdir"]
    os.makedirs(outdir, exist_ok=True)

    if p["collar_od"] >= p["tube_id"]:
        sys.exit("collar OD must be under the tube ID or the part will not go in")

    print(f"target open fraction {p['porosity']}, voxel {p['voxel']} mm")
    report = {"parameters": p, "parts": []}
    run_geometry("gyroid", p, outdir, report)
    thick, _ = run_geometry("crosshatch", p, outdir, report)
    run_coupon(thick, p, outdir, report)

    ann = np.pi * ((p["tube_id"] / 2) ** 2 - (p["collar_od"] / 2) ** 2)
    report["annulus_at_collar_mm2"] = round(float(ann), 2)
    report["annulus_without_collar_mm2"] = round(
        float(np.pi * ((p["tube_id"] / 2) ** 2 - (p["core_dia"] / 2) ** 2)), 2)
    with open(os.path.join(outdir, "lattice_report.json"), "w") as fh:
        json.dump(report, fh, indent=2)
    print(f"annulus at the collar {ann:.1f} mm2 "
          f"(vs {report['annulus_without_collar_mm2']:.1f} mm2 uncollared)")
    print("wrote lattice_report.json")
    print("\nMeasure the void volume on the assembled reactor. Do not use the "
          "figure above in the spreadsheet.")


if __name__ == "__main__":
    main()
```

# Schedule v2 — 23 Working Weeks to a Late-March Deadline

**Built for your real constraints:** 3 lab days per week, abstract due late March 2027.

| | v1 (wrong) | v2 (this one) |
|---|---|---|
| Working weeks | 32 | **23** |
| Runs | 71 | **56** |
| Hours each | ~240 | ~215 |
| Average per week | 7.5 h | **9.4 h** |
| Peak week | 12.6 h | 12.2 h |

The work got 20 % shorter but the weeks got 25 % denser. That is the real cost of the calendar, and it's better to know now.

---

## The calendar this assumes

Start **Monday 21 September 2026**, abstract due **~29 March 2027**. That's 27 calendar weeks minus four you won't get: Thanksgiving week, the December finals week, and two weeks of winter break.

| Week | Starts | Week | Starts |
|---|---|---|---|
| 1 | Sep 21 | 13 | Jan 11 |
| 2 | Sep 28 | 14 | Jan 18 |
| 3 | Oct 5 | 15 | Jan 25 |
| 4 | Oct 12 | 16 | Feb 1 |
| 5 | Oct 19 | 17 | Feb 8 |
| 6 | Oct 26 | 18 | Feb 15 |
| 7 | Nov 2 | 19 | Feb 22 |
| 8 | Nov 9 | 20 | Mar 1 |
| 9 | Nov 16 | 21 | Mar 8 |
| — | *Nov 23 — Thanksgiving* | 22 | Mar 15 |
| 10 | Nov 30 | 23 | Mar 22 |
| 11 | Dec 7 | — | *Mar 29 — abstract due* |
| — | *Dec 14 — finals* | | |
| — | *Dec 21, Dec 28 — winter break* | | |
| 12 | Jan 4 | | |

**Check these dates against your school calendar and the actual fair deadline before committing.** If your winter break is three weeks, or the deadline is February, this needs redoing again.

---

## What got cut, and why those things

| Block | Was | Now | Reasoning |
|---|---|---|---|
| Catalyst durability | 10 runs | 6 | A trend is visible in 6; runs 7–10 were confirmation |
| Grid comparison | 9 | 6 | Enough for a fair "no-computer" baseline |
| Two searches | 16 | 12 | 3 rounds each instead of 4 — the thinnest cut, see warning below |
| Round-1 map | 12 | 10 | Still covers the design space |
| Real water | 6 | 4 | Two matrices in duplicate instead of three |
| Baselines | 8 | 8 | **Not cut** — this is how you learn the method |
| Radical tests | 4 | 4 | **Not cut** — this is your mechanism evidence |
| Confirmation | 6 | 6 | **Not cut** — this is the headline result |

**The warning:** cutting the searches from 16 runs to 12 means three proposal rounds each. That is the minimum for a Bayesian optimizer to show it's learning rather than guessing. If anything slips, protect these twelve runs — take the time out of durability or the grid instead.

---

## Week by week

### BUILD — Weeks 1–4 (Sep 21 – Nov 6)

**W1 · Sep 21 · A 10.4 h · B 5.5 h**
Both: read the five core papers; write the novelty statement and have a teacher attack it; set ground rules. A: **order everything today** — school POs take weeks and Week 6 depends on them. B: start the repo.

**W2 · Sep 28 · A 8.0 · B 8.0**
Both: choose the antibiotic and the measurement route; lock the four settings and ranges; email two university labs. A: lattice CAD, print four. B: spreadsheet schema, order reader parts.

**W3 · Oct 5 · A 10.9 · B 8.0**
A: make both catalysts, weigh and photograph everything. B: build the light reader.

**W4 · Oct 12 · A 10.9 · B 9.9**
A: assemble flow loop, leak-test 2 h, measure real flow at three pump settings. B: validate the reader — drift, linearity, dark current. Both: declare "ready to calibrate."

### LEARN TO MEASURE — Weeks 5–7 (Oct 19 – Nov 6)

*Compressed from four weeks to three. This is the riskiest compression in the plan — if the calibration isn't trustworthy, nothing downstream is.*

**W5 · Oct 19 · A 8.0 · B 5.0**
Both: calibration curve together; write and post the sampling-and-quench card. A: interference check.

**W6 · Oct 26 · A 11.1 · B 5.2 · 4 runs**
Both: four dye baseline runs. A: kinetics fitting code. Both: decide on the UV LED and which catalyst route.

**W7 · Nov 2 · A 10.1 · B 11.1 · 4 runs**
Both: four antibiotic baselines — the synergy figure. A: iron-leaching assay setup. B: radish pilot.

### MAP AND UNDERSTAND — Weeks 8–13 (Nov 9 – Jan 17)

**W8 · Nov 9 · A 5.0 · B 8.9**
B: *E. coli* pilot with the biology teacher; Latin hypercube design committed. A: prepare and weigh lattices. Both: full dress rehearsal, sign the procedure card.
*→ Thanksgiving week off*

**W9 · Nov 16 · 5 runs · A 6.2 · B 6.2**
**W10 · Nov 30 · 5 runs · A 6.2 · B 6.2**
Map runs R-001 to R-010, five per week — roughly two per lab day.

**W11 · Dec 7 · 4 runs · A 6.2 · B 7.2**
Both: the four radical tests. B: first draft of the toxicity-vs-removal map. Both: look at it, write down what you see, don't change the plan.
*→ Finals week and winter break off*

**W12 · Jan 4 · 6 runs · A 9.2 · B 9.2**
Durability — six runs on one lattice, tracking rate and iron leaching. Ease back in after the break.

**W13 · Jan 11 · A 11.9 · B 10.9**
A: Search A optimizer + random forest and SHAP. B: Search B optimizer with the Pareto front. Both: agree the safety limits on proposals.
⚠️ **Checkpoint:** if Search B isn't running by Friday, drop the soft sensor and both work the optimizer.

### THE MAIN EXPERIMENT — Weeks 14–19 (Jan 18 – Feb 27)

**W14 · Jan 18 · 4 runs · A 10.3 · B 10.1**
**W15 · Jan 25 · 4 runs · A 10.3 · B 10.1**
**W16 · Feb 1 · 4 runs · A 11.3 · B 11.1**
Three rounds of the two searches. Same rhythm each week: Monday both optimizers propose two settings each, commit the proposals with a timestamp *before* running, two runs each, measure same day, score radish Friday.
Also in these weeks: A writes the methods section in thirds; both run the *E. coli* sweep on archived samples; chemistry figures begin.

**W17 · Feb 8 · 4 runs · A 8.6 · B 8.6**
Grid comparison, first four. Both: build the three key figures — the map, the "best result vs. runs" curves, the trade-off curve.

**W18 · Feb 15 · 6 runs · A 12.2 · B 11.2**
Confirmation: three runs at Search A's best, three at Search B's chosen. Radish on all six. B: statistics. A: cost model.
⚠️ **The decision week.** Did the searches diverge? Write the headline sentence together, whichever way it went.

**W19 · Feb 22 · 4 runs · A 10.6 · B 9.6**
Real water — two matrices in duplicate. Finish the *E. coli* sweep.

### WRITE AND PRESENT — Weeks 20–23 (Mar 1 – Mar 27)

**W20 · Mar 1 · 2 runs · A 12.0 · B 11.5**
Last two grid runs. B: soft sensor, repo README. Both: remaining figures. Freeze the dataset this week.

**W21 · Mar 8 · A 11.9 · B 10.9**
A: introduction. B: results. Both: discussion and limitations, side by side.

**W22 · Mar 15 · A 10.4 · B 9.4**
Both: abstract, 250 words, every sentence agreed. Send to your supervisor and one outside reader with "find what's wrong." Revise.

**W23 · Mar 22 · A 11.9 · B 11.9**
Both: poster in story order; 5-minute talk each of you can give alone; three mock judging sessions.

**Mar 29 — abstract due.**

---

## Honest assessment of this version

**Better than v1:** it fits a real calendar with real breaks, real dates, and a run count your lab access can actually deliver.

**Still uncertain:** the hour estimates are unvalidated. If they're 50 % optimistic — which is normal — you're looking at 14 h/week, which is not sustainable alongside classes and the solo MIP project. The first four weeks will tell you.

**There is almost no slack.** v1 had three buffer weeks. This has none. Weeks 9 through 12 are the lightest at 6–9 h, so that's where slippage has to absorb.

**Cut in this order if you fall behind:**
1. The spectral soft sensor (Week 20) — a bonus result, not the thesis.
2. The *E. coli* sweep (Weeks 14–19) — costs you the resistance endpoint, keeps the core.
3. Real water down to a single matrix (Week 19).
4. Durability down to four runs.
**Never cut:** the 12 search runs, the 6 confirmation runs, the 4 radical tests.

**The two decisions that would buy real room:** starting in summer instead of September, or targeting CSEF and next year's Synopsys and using this March as a partial-data checkpoint. Either turns a tight plan into a comfortable one.

<script type="text/markdown" data-slug="week-by-week-32" data-group="archive" data-status="old" data-updated="2026-09-11" data-title="Week-by-Week, 32 Weeks" data-source="claude/week-by-week-schedule.md" data-blurb="The original 32-week plan. Calendar-infeasible against a March 2027 deadline, kept only for its task-level detail.">
# Week-by-Week Schedule — Who Does What, Every Week

**32 weeks. About 240 hours each, averaging 7.5 h per week.** Peak week is 12.6 h; three weeks run slightly over 12 and are flagged. Weeks 9, 13 and 32 are deliberately light — they are catch-up buffer, not free time.

Hours shown include each partner's share of the weekly 45-minute sync and notebook upkeep.

**Roles:** **A** = reactor, chemistry & baseline modelling. **B** = instrument, bioassay & optimization. **Both** = side by side, because a judge could ask either of you.

---

## PHASE 1 — BUILD (Weeks 1–4)

### Week 1 — Read and order · A 10.6 h · B 5.5 h
- **Both:** read the five core papers together (Yan, Meng, Hu, Wilkinson, Lancet). Write the one-paragraph novelty statement and have a teacher attack it. Set the ground rules — notebook, spreadsheet, sync day.
- **A:** order everything. Chemicals go through a school purchase order and take weeks — this is why it's week 1, not week 3.
- **B:** start the GitHub repo.

### Week 2 — Decide and design · A 8.1 h · B 8.1 h
- **Both:** **choose the antibiotic** (ciprofloxacin preferred, tetracycline fallback) and how you'll measure it. Lock the four settings and their ranges. Email two university labs about instrument access.
- **A:** design the lattice in CAD; print four in PETG.
- **B:** build the master spreadsheet schema; order light-reader parts to match the antibiotic choice.

### Week 3 — Catalyst and reader, part 1 · A 11.1 h · B 8.1 h
- **A:** make both catalysts — steel-wool route and rust-to-oxide route. Weigh everything, photograph, magnet-test.
- **B:** build the light reader (optics, wiring, Arduino code, printed holder).

### Week 4 — Reactor and reader, part 2 · A 11.1 h · B 10.1 h
- **A:** assemble the flow loop. Leak-test two hours. Measure real flow rate at three pump settings and write the table.
- **B:** finish and validate the reader — 30-minute drift under 1 %, linearity, dark current.
- **Both:** sync — declare reactor and reader "ready to calibrate."

---

## PHASE 2 — LEARN TO MEASURE (Weeks 5–8)

*This phase decides whether the whole project is trustworthy. Do not rush it.*

### Week 5 — Calibration · A 8.1 h · B 5.0 h
- **Both:** build the antibiotic calibration curve together so you both understand it. Write and tape up the sampling-and-quench card.
- **A:** interference check — persulfate, iron water, and quench solution read on their own.

### Week 6 — Baseline runs with the practice dye · A 11.2 h · B 5.2 h · 4 runs
- **Both:** four baseline runs with methylene blue — persulfate only, iron only, both, both + UV LED.
- **A:** write the kinetics fitting code.
- **Both:** decide whether the UV LED stays or gets dropped, and which catalyst route to use.

### Week 7 — Baselines with the antibiotic · A 10.2 h · B 11.2 h · 4 runs
- **Both:** repeat the four baselines with the real antibiotic. This becomes the "synergy" figure.
- **A:** set up and calibrate the iron-leaching assay.
- **B:** radish bioassay pilot — clean water, untreated antibiotic, quench-only water.

### Week 8 — Decision week · A 3.0 h · B 9.1 h
- **B:** *E. coli* pilot with the biology teacher.
- **Both:** check three things — does untreated antibiotic clearly hurt radish roots? Does quench-only water grow normally? Does a spiked sample read back at 85–115 %? Then do one full dress-rehearsal run together and sign the procedure card.

---

## PHASE 3 — MAP AND UNDERSTAND (Weeks 9–16)

### Week 9 — Buffer and design · A 3.0 h · B 3.0 h
- **B:** generate the 12-point Latin hypercube design; commit it before anything runs.
- **A:** prepare lattices, weigh each.
- *Light week on purpose — use it to catch up if Phase 2 slipped.*

### Weeks 10, 11, 12 — The map · A 5.2 h · B 5.2 h each week · 4 runs/week
- **Both:** two runs each per week. Whoever ran it, measures it and sets up its radish dishes. Score radish on day 5.
- Twelve runs total (R-001 to R-012).

### Week 13 — First look · A 2.0 h · B 3.0 h
- **B:** plot toxicity index against removal % for the 12 runs, coloured by pH. **This is the first draft of the headline figure.**
- **Both:** look at it together. Do the dots line up or scatter? Write down what you see. Don't change the plan.

### Week 14 — Which radical does the work · A 5.2 h · B 5.2 h · 4 runs
- **Both:** four runs at the best settings — normal, + tert-butanol, + methanol, + nitrogen purge.
- **Both:** work out which radical dominates and write one paragraph. Both of you practise saying it out loud.

### Week 15 — Does the catalyst last · A 11.6 h · B 11.6 h · 10 runs
- **Both:** ten runs in a row on one lattice. Measure rate and iron leaching every run. Photograph before and after.
- Heavy week, but the runs are quick repeats of the same conditions.

### Week 16 — Build the models ⚠️ · A 12.1 h · B 11.1 h
- **A:** Search A optimizer (removal only) + random forest and SHAP.
- **B:** Search B optimizer (multi-objective, Pareto front).
- **Both:** review the model landscapes; agree the safety limits on what the optimizers may propose.
- ⚠️ *Heaviest computational week. If Search B isn't running by the end of this week, demote the soft sensor (Week 26) to a stretch goal and both work on the optimizer.*

---

## PHASE 4 — THE MAIN EXPERIMENT (Weeks 17–23)

### Weeks 17, 18, 19, 20 — Two searches · A 5.2 h · B 5.2 h each week · 4 runs/week
Every week, the same rhythm:
1. **B** runs both optimizers on all data so far; each proposes two settings.
2. **Both** commit the four proposals with a timestamp **before running them** — this proves the computer chose, not you.
3. **Both** sanity-check the proposals for safety, then run two each.
4. Measure same day; radish dishes; score on day 5; feed results back.

### Week 21 — Grid comparison · A 9.8 h · B 9.8 h · 5 runs
- **Both:** first five runs of the hand-built 9-point grid (the "no computer" comparison).
- **Both:** build the three key figures — the full toxicity-vs-removal map, the "best result vs. number of runs" curves, and Search B's trade-off curve with Search A's best marked on it.

### Week 22 — Confirmation and the decision · A 8.4 h · B 11.4 h · 6 runs

        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;

        continue;

      clearTimeout(copyTimer);

      setCopyState(btn, "busy", "Copying");
      navigator.clipboard.writeText(d.md).then(function () {
        setCopyState(btn, "done", "Copied " + d.words.toLocaleString() + " words");
        announce("Document text copied to the clipboard.");
        copyTimer = setTimeout(function () { setCopyState(btn, "", "Copy document text"); }, 2400);
      }).catch(function () {
        setCopyState(btn, "failed", "Copy was blocked");
        announce("The browser blocked the copy.");
        copyTimer = setTimeout(function () { setCopyState(btn, "", "Copy document text"); }, 3200);
      });
    });
  }

  function setCopyState(btn, state, label) {
    if (state) btn.dataset.state = state; else delete btn.dataset.state;
    btn.setAttribute("aria-busy", state === "busy" ? "true" : "false");
    btn.innerHTML = (state === "busy" ? '<span class="spinner"></span>' : "") + esc(label);
  }

  /* ============================================================
     SEARCH — typing, empty result, clearing
     ============================================================ */

  function applySearch() {
    query = search.value.trim().toLowerCase();
    searchClear.disabled = !search.value;
    buildNav();
    var slug = (location.hash || "").replace(/^#\/?/, "");
    var onDoc = docs.some(function (d) { return d.slug === slug; });
    if (!onDoc) renderIndex();
  }

  function clearSearch() {
    search.value = "";
    applySearch();
    search.focus();
  }

  search.addEventListener("input", applySearch);
  searchClear.addEventListener("click", clearSearch);

  /* ============================================================
     ROUTING
     ============================================================ */

  function route(userInitiated) {
    var hash = location.hash || "";
    if (/^#[^/]/.test(hash)) { markCurrent(); return; }

    var slug = hash.replace(/^#\/?/, "");
    var doc = docs.filter(function (d) { return d.slug === slug; })[0];

    if (doc) renderDoc(doc); else renderIndex();

    markCurrent();
    closeNav();

    if (userInitiated) {
      window.scrollTo(0, 0);
      main.focus({ preventScroll: true });
    }
  }

  /* ============================================================
     DRAWER
     ============================================================ */

  function openNav() {
    rail.dataset.open = "true";
    navToggle.setAttribute("aria-expanded", "true");
    if (!scrim) {
      scrim = document.createElement("button");
      scrim.type = "button";
      scrim.className = "scrim";
      scrim.setAttribute("aria-label", "Close the document list");
      scrim.addEventListener("click", closeNav);
      document.body.appendChild(scrim);
    }
  }

  function closeNav() {
    rail.dataset.open = "false";
    navToggle.setAttribute("aria-expanded", "false");
    if (scrim) { scrim.remove(); scrim = null; }
  }

  navToggle.addEventListener("click", function () {
    if (rail.dataset.open === "true") closeNav(); else openNav();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && rail.dataset.open === "true") {
      closeNav();
      navToggle.focus();
    }
  });

  /* ============================================================
     BOOT
     ============================================================ */

  window.addEventListener("hashchange", function () { route(true); });
  buildNav();
  route(false);
})();
</script>

</body></html>
