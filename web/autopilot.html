<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chlorine Dose Autopilot</title>
<style>
/* Operator app for a wastewater plant. Opens on the live setpoint. Three tabs: Now, Log, Plant.
   Type is the device's own system face. Every edge is square. Lines, not boxes, separate things.
   Blue = inside a limit. Amber = outside a limit. Red = alarm. Nothing else is coloured. */
:root {
  --bg: #ffffff; --panel: #ffffff; --panel-2: #eff1f2; --field: #ffffff; --ink: #0d1518; --ink-2: #3b464c; --muted: #6a757b;
  --rule: #c9cfd3; --grid: #e3e7e9; --bar: #0d1518; --bar-ink: #ffffff; --bar-mut: #a9b4ba;
  --accent: #0b5cad; --accent-ink: #ffffff; --pass: #0b5cad; --pass-bg: #e3edf7; --pass-ink: #0a4a8c;
  --warn: #c97a00; --warn-bg: #fbefd6; --warn-ink: #7a4800; --crit: #b3261e; --crit-bg: #fbe6e4; --focus: #0b5cad;
  --void: #e6e9eb; --void-hatch: #bcc4c9; --water: #c5dcec;
  --f-label: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-data: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1114; --panel: #0c1114; --panel-2: #161d21; --field: #0c1114; --ink: #eef2f3; --ink-2: #b9c3c8; --muted: #8b979d;
  --rule: #303a40; --grid: #1e272c; --bar: #000000; --bar-ink: #ffffff; --bar-mut: #96a2a8;
  --accent: #5aa7ee; --accent-ink: #06121c; --pass: #4c9be4; --pass-bg: #12283b; --pass-ink: #a8d0f4;
  --warn: #d08a10; --warn-bg: #33270d; --warn-ink: #f2cf8b; --crit: #f0766c; --crit-bg: #3a1614; --focus: #7dbaf2;
  --void: #171f23; --void-hatch: #36424a; --water: #1d3a50; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c1114; --panel: #0c1114; --panel-2: #161d21; --field: #0c1114; --ink: #eef2f3; --ink-2: #b9c3c8; --muted: #8b979d;
  --rule: #303a40; --grid: #1e272c; --bar: #000000; --bar-ink: #ffffff; --bar-mut: #96a2a8;
  --accent: #5aa7ee; --accent-ink: #06121c; --pass: #4c9be4; --pass-bg: #12283b; --pass-ink: #a8d0f4;
  --warn: #d08a10; --warn-bg: #33270d; --warn-ink: #f2cf8b; --crit: #f0766c; --crit-bg: #3a1614; --focus: #7dbaf2;
  --void: #171f23; --void-hatch: #36424a; --water: #1d3a50; color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; border-radius: 0; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--panel-2); color: var(--ink); font-family: var(--f-body); font-size: 1rem; line-height: 1.4; font-variant-numeric: tabular-nums; }
h1, h2, p, ol { margin: 0; padding: 0; } ol { list-style: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:active { opacity: 0.6; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
small { font-size: 0.8125rem; font-weight: 400; color: var(--muted); }
b { font-weight: 600; }

.shell { max-width: 520px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bar); color: var(--bar-ink); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 11px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
.top h1 { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .app { display: block; font-size: 0.75rem; font-weight: 400; color: var(--bar-mut); letter-spacing: 0.02em; }
.demo { flex: none; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.08em; border: 1px solid var(--bar-mut); color: var(--bar-ink); padding: 3px 7px; }

main { flex: 1; padding-bottom: 76px; }
main > * { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* mode switch */
.modes { display: grid; grid-template-columns: repeat(3, 1fr); padding: 0; border-bottom: 1px solid var(--rule); }
.modes button { min-height: 48px; border: 0; border-bottom: 3px solid transparent; background: var(--bg); font-weight: 500; color: var(--muted); }
.modes button[aria-checked="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }

/* the setpoint */
.hero { padding-top: 20px; padding-bottom: 18px; }
.lab { font-size: 0.875rem; color: var(--ink-2); }
.dose { font-size: 4.75rem; font-weight: 700; line-height: 1; letter-spacing: -0.045em; margin: 4px 0 8px -3px; display: flex; align-items: baseline; gap: 10px; }
.dose small { font-size: 1rem; letter-spacing: 0; color: var(--ink-2); }
.sub { color: var(--ink-2); }
.chg { margin-top: 10px; color: var(--muted); font-size: 0.9375rem; }
.rec { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; background: var(--pass-bg); border-left: 3px solid var(--pass); font-size: 0.9375rem; }
.rec button { flex: none; min-height: 40px; padding: 0 18px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* status line */
.stat { display: grid; gap: 2px; padding-top: 11px; padding-bottom: 11px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); border-left: 4px solid var(--pass); background: var(--bg); }
.stat span { color: var(--ink-2); font-size: 0.9375rem; }
.stat.ok b { color: var(--pass-ink); }
.stat.note { border-left-color: var(--ink-2); }
.stat.idle { border-left-color: var(--rule); }
.stat.alarm { border-left-color: var(--crit); background: var(--crit-bg); } .stat.alarm b { color: var(--crit); }

/* sections */
.blk { padding-top: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
h2 { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.lim { margin-bottom: 14px; } .lim:last-child { margin-bottom: 2px; }
.lim-h, .lim-f, .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.lim-h > span:last-child { white-space: nowrap; }
.track { position: relative; height: 8px; background: var(--panel-2); margin: 7px 0 5px; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--pass); }
.lim.bad .track i { background: var(--warn); }
.track em { position: absolute; left: 66.7%; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.lim-f { font-size: 0.8125rem; color: var(--muted); }
.lim.bad .lim-f span:last-child { color: var(--warn-ink); font-weight: 600; }
.cells { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--grid); border-left: 1px solid var(--grid); }
.cellb { display: grid; gap: 1px; padding: 9px 10px 10px; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); min-width: 0; }
.tagn { font-size: 0.6875rem; letter-spacing: 0.06em; color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.cl { font-size: 0.875rem; color: var(--ink-2); }
.cv { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
.kv { padding: 8px 0; border-top: 1px solid var(--grid); } .kv:first-of-type { border-top: 0; padding-top: 0; }
.kv > span:first-child { color: var(--ink-2); } .kv > span:last-child { text-align: right; white-space: nowrap; }
.okt { color: var(--pass-ink); } .badt { color: var(--warn-ink); }
.more { display: grid; grid-template-columns: 1fr 10px; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; min-height: 56px; }
.more b { display: block; } .more span span { color: var(--ink-2); font-size: 0.9375rem; }
.more i { width: 9px; height: 9px; border-right: 2px solid var(--ink-2); border-top: 2px solid var(--ink-2); transform: rotate(45deg); }
.more:active { background: var(--panel-2); }
.foot { color: var(--muted); font-size: 0.8125rem; padding-top: 12px; padding-bottom: 4px; max-width: 60ch; }
.blk .foot { padding: 6px 0 0; }
.empty { color: var(--muted); }
.backl { display: block; padding-top: 12px; padding-bottom: 12px; color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--rule); }
.backl::before { content: "‹ "; }
.chart { min-width: 0; } .mapread { margin-top: 8px; font-size: 0.9375rem; color: var(--ink-2); min-height: 2.8em; }

/* log */
.log li { display: grid; grid-template-columns: 4.2em 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--grid); }
.log li:first-child { border-top: 0; padding-top: 0; }
.lt { color: var(--muted); } .lv { font-size: 1.0625rem; } .lm { font-size: 0.8125rem; color: var(--muted); align-self: center; }
.lw { grid-column: 2 / -1; color: var(--ink-2); font-size: 0.9375rem; }

/* plant settings */
.frow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 14px; padding: 6px 0; border-top: 1px solid var(--grid); min-height: 48px; }
.blk > .frow:first-of-type { border-top: 0; }
.frow > span:first-child { color: var(--ink-2); }
.fin { display: flex; align-items: baseline; gap: 6px; }
.frow input { width: 5.5em; min-height: 40px; border: 0; border-bottom: 1px solid var(--ink-2); background: transparent; text-align: right; font-weight: 600; padding: 0 2px; }
.frow input:focus { outline: none; border-bottom: 2px solid var(--accent); }
#c-name { width: 11em; }
.frow.bad input { border-bottom-color: var(--crit); }
.msg { grid-column: 1 / -1; font-style: normal; color: var(--crit); font-size: 0.875rem; }
.actions { display: flex; align-items: center; gap: 16px; padding-top: 16px; padding-bottom: 20px; }
.actions button { min-height: 46px; padding: 0 22px; border: 1px solid var(--ink); background: transparent; font-weight: 600; }
.actions .primary { background: var(--ink); color: var(--bg); }
#saved { color: var(--pass-ink); font-weight: 600; }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--bg); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs div { width: 100%; max-width: 520px; display: grid; grid-template-columns: repeat(3, 1fr); }
.tabs a { display: grid; place-items: center; min-height: 54px; color: var(--muted); text-decoration: none; font-size: 0.9375rem; font-weight: 500; border-top: 3px solid transparent; margin-top: -1px; }
.tabs a.on { color: var(--ink); font-weight: 600; border-top-color: var(--ink); }
.tabs a:active { background: var(--panel-2); }
@media (min-width: 560px) { .shell { box-shadow: 1px 0 0 var(--rule), -1px 0 0 var(--rule); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top gut">
    <h1><span id="pname">Demo plant</span><span class="app">Chlorine dose autopilot</span></h1>
    <span class="demo" title="Readings are simulated">DEMO FEED</span>
  </header>
  <main id="app"></main>
</div>
<nav class="tabs" aria-label="Sections"><div><a href="#now">Now</a><a href="#log">Log</a><a href="#plant">Plant</a></div></nav>
<script src="model.js"></script>
<script src="optimizer/engine.js"></script>
<script src="optimizer/charts.js"></script>
<script src="optimizer/autopilot.js"></script>
</body>
</html>
