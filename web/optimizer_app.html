<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chlorination Optimizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&display=swap">
<link rel="stylesheet" href="optimizer/tokens.css">
<style>
/* App form. One column, one question or one answer per screen, one main button at the bottom.
   Quiet sheet, ink type, blue only for the main action and "passes", amber only for "over the limit". */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--panel-2); color: var(--ink); font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.45; font-variant-numeric: tabular-nums; }
h1, h2, p, dl, dd, ol, ul { margin: 0; padding: 0; }
ol, ul { list-style: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: transform 90ms ease, background-color 90ms ease, filter 90ms ease; }
button:active { transform: scale(0.975); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1:focus { outline: none; }

.screen { min-height: 100%; max-width: 480px; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.body { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-block: 8px 24px; min-width: 0; }
.foot { position: sticky; bottom: 0; display: grid; gap: 10px; padding: 12px 0 calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }

.bar-top { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 4px; padding-top: 14px; margin-left: -10px; }
.bar-top h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
.backb { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; border-radius: 22px; color: var(--ink-2); }
.backb:hover { background: var(--panel-2); }
.stepbar { display: flex; gap: 6px; margin: 2px 0 2px; }
.stepbar i { flex: 1; height: 4px; border-radius: 2px; background: var(--rule); }
.stepbar i.on { background: var(--accent); }
h2 { font-size: 1rem; font-weight: 700; margin-top: 8px; }

/* buttons */
.primary, .secondary { width: 100%; min-height: 54px; border-radius: 14px; border: 0; font-weight: 600; font-size: 1.0625rem; }
.primary { background: var(--accent); color: var(--accent-ink); }
.primary:active { filter: brightness(0.9); }
.secondary:active, .opt-row:active { background: var(--panel-2); }
.secondary { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--rule); }
.link { background: none; border: 0; padding: 10px 0; min-height: 44px; color: var(--accent); font-weight: 600; text-align: center; }
.body > .link { text-align: left; align-self: flex-start; }
.fine { text-align: center; color: var(--muted); font-size: 0.875rem; }

/* home */
.s-home .body { justify-content: center; gap: 28px; padding-top: 40px; }
.hero { display: grid; gap: 14px; }
.trainline { width: 100%; max-width: 320px; height: auto; margin-bottom: 10px; overflow: visible; }
.pipe { stroke: var(--ink); stroke-width: 3; fill: none; }
.ln { stroke: var(--ink); stroke-width: 1.5; fill: none; }
.bub { fill: var(--bg); stroke: var(--ink); stroke-width: 1.5; }
.tank { fill: var(--water); stroke: var(--ink); stroke-width: 1.5; }
.flowp { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.arr { fill: var(--ink); }
.hero h1 { font-size: 2.125rem; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
.lede { font-size: 1.125rem; color: var(--ink-2); max-width: 32ch; }
.hello { color: var(--ink-2); }
#signin { display: grid; gap: 14px; }
.txtf { display: grid; gap: 6px; }
.txtf label, .fld label { font-weight: 600; font-size: 0.9375rem; }
.opt { font-weight: 400; color: var(--muted); }
.txtf input { min-height: 54px; border-radius: 14px; border: 1.5px solid var(--rule); background: var(--field); padding: 0 16px; width: 100%; }
.txtf input:focus { border-color: var(--accent); outline: none; }

/* option rows */
.opts { display: grid; }
.opt-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; text-align: left; background: none; border: 0; border-top: 1px solid var(--rule); padding: 18px 2px; min-height: 64px; color: var(--ink-2); }
.opt-row:last-child { border-bottom: 1px solid var(--rule); }
.opt-row.lead { grid-template-columns: 44px 1fr auto; }
.ic { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--pass-bg); color: var(--pass-ink); }
.opt-row b { display: block; color: var(--ink); font-size: 1.125rem; font-weight: 600; }
.opt-row span span { font-size: 0.9375rem; }
.opt-row.slim { padding: 14px 2px; } .opt-row.slim b { font-size: 1.0625rem; }
.opt-row:hover b { color: var(--accent); }

/* number fields with steppers */
.fld { display: grid; gap: 6px; }
.ctl { display: grid; grid-template-columns: 54px 1fr auto 54px; align-items: center; min-height: 58px; border-radius: 14px; border: 1.5px solid var(--rule); background: var(--field); overflow: hidden; }
.ctl:focus-within { border-color: var(--accent); }
.ctl input { border: 0; background: transparent; text-align: right; font-size: 1.375rem; font-weight: 600; width: 100%; min-width: 0; padding: 0 6px; outline: none; height: 100%; min-height: 54px; }
.stp { height: 100%; min-height: 56px; border: 0; background: transparent; font-size: 1.5rem; color: var(--ink-2); }
.stp:hover { background: var(--panel-2); } .stp:active { background: var(--rule); }
.un { color: var(--muted); font-size: 0.9375rem; font-weight: 400; }
.ctl .un { padding-right: 8px; white-space: nowrap; }
.hint, .note { color: var(--ink-2); font-size: 0.9375rem; }
.msg { color: var(--crit); font-size: 0.9375rem; font-weight: 500; }
.fld.bad .ctl { border-color: var(--crit); }
.warnnote { color: var(--warn-ink); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel-2); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; min-height: 46px; border-radius: 10px; font-weight: 600; font-size: 0.9375rem; color: var(--ink-2); }
.seg button[aria-checked="true"] { background: var(--bg); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }

/* result: the last button sits after the list, so it never covers a row */
.s-result .foot { position: static; padding-top: 4px; }
/* result */
.busy { margin: auto 0; display: grid; gap: 16px; color: var(--ink-2); }
.bar { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); transition: transform 120ms linear; }
.answer { display: grid; gap: 12px; padding: 8px 0 6px; }
.kicker { font-family: var(--f-label); font-weight: 700; font-size: 0.875rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.set { display: flex; flex-wrap: wrap; gap: 6px 28px; }
.set span { font-size: 3.5rem; font-weight: 700; line-height: 1; letter-spacing: -0.03em; display: grid; gap: 6px; }
.set small { font-size: 0.9375rem; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.set.small span { font-size: 2.125rem; } .set.small { gap: 6px 20px; }
.verdict { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1.0625rem; }
.verdict.ok { color: var(--pass-ink); } .verdict.ok svg { color: var(--pass); }
.verdict.warn { color: var(--warn-ink); } .verdict.warn svg { color: var(--warn); }
.verdict.off { color: var(--ink-2); }
.verdict svg { flex: none; }
.rows { display: grid; }
.rows > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--grid); }
.rows dt { color: var(--ink-2); font-size: 0.9375rem; }
.rows dd { text-align: right; } .rows b { font-weight: 600; } .rows b.over { color: var(--warn-ink); }

/* limit gauges: the bar fills toward a mark at the limit */
.gauges { display: grid; gap: 16px; padding: 4px 0; }
.gh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.gh span { color: var(--ink-2); font-size: 0.9375rem; } .gh b { font-weight: 600; }
.track { position: relative; height: 10px; border-radius: 5px; background: var(--panel-2); margin: 7px 0 5px; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--pass); }
.gauge.warn .track i { background: var(--warn); }
.track em { position: absolute; left: 66.7%; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.gl { color: var(--muted); font-size: 0.875rem; padding-left: 66.7%; margin-left: -2.5ch; white-space: nowrap; }
.gauge.warn .gl { color: var(--warn-ink); font-weight: 600; }

/* screens slide in the direction of travel */
@keyframes in-fwd { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@keyframes in-back { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
.screen.fwd > .body, .screen.fwd > .bar-top { animation: in-fwd 180ms ease-out; }
.screen.back > .body, .screen.back > .bar-top { animation: in-back 180ms ease-out; }
.txtf input, .ctl input { scroll-margin-block: 120px; }

/* detail screens */
.chart { min-width: 0; }
.stations { display: grid; position: relative; }
.stations::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: 62px; width: 3px; background: var(--ink); }
.stations li { display: grid; grid-template-columns: 17px 1fr; gap: 16px; padding-bottom: 18px; position: relative; }
.dot { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--ink); background: var(--bg); margin-top: 3px; }
.eq { font-family: var(--f-label); font-weight: 700; font-size: 0.875rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); }
.v { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 0.9375rem; }
.st { font-weight: 600; } .st.ok { color: var(--pass-ink); } .st.warn { color: var(--warn-ink); } .st.off { color: var(--ink-2); }
.mapread { display: grid; gap: 8px; min-height: 84px; }
.two { display: grid; gap: 22px; }
.two > div { display: grid; gap: 8px; align-content: start; min-width: 0; }
.two > div + div { border-top: 2px solid var(--ink); padding-top: 18px; }
.checks { display: grid; }
.checks li { display: grid; grid-template-columns: 20px 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid var(--grid); }
.checks li.ok svg { color: var(--pass); } .checks li.warn svg { color: var(--warn); }
.checks li.warn b { color: var(--warn-ink); }
pre { margin: 0; padding: 14px; border-radius: 12px; background: var(--field); border: 1px solid var(--rule); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.875rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }

@media (min-width: 560px) { .screen { padding-left: 28px; padding-right: 28px; box-shadow: 1px 0 0 var(--rule), -1px 0 0 var(--rule); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } button:active { transform: none; } }
</style>
</head>
<body>
<div id="app" class="screen"></div>
<script src="model.js"></script>
<script src="optimizer/engine.js"></script>
<script src="optimizer/charts.js"></script>
<script src="optimizer/flow.js"></script>
</body>
</html>
