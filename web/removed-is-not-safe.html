<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6f5f4">
<title>Removed Is Not Safe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0d2b45; --ink-2:#4a6178; --muted:#7f95a8; --mist:#e6f5f4; --card:#ffffff;
  --aqua:#12b5c9; --deep:#0a6f99; --lime:#b9e04a; --lime-ink:#4d6a00; --violet:#7b61ff; --violet-bg:#efecff;
  --amber:#ffab2e; --amber-bg:#fff4e0; --amber-ink:#8a5400; --coral:#f25f5c; --coral-bg:#fdeceb;
  /* names the chart code reads */
  --bg:var(--mist); --panel:#ffffff; --panel-2:#eef6f6; --rule:#d5e4e6; --grid:#e8f1f2; --pass:#12b5c9; --pass-ink:#07697a;
  --warn:#ffab2e; --void:#e5edef; --void-hatch:#c3d3d9; --crit:#f25f5c; --focus:#0a6f99;
  --f-label:"Figtree",system-ui,sans-serif; --f-body:"Figtree",system-ui,sans-serif; --f-data:"Figtree",system-ui,sans-serif;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f-body);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  background:radial-gradient(900px 600px at 15% 10%,#c9f1ee 0,rgba(201,241,238,0) 60%),radial-gradient(800px 600px at 90% 90%,#dcd6ff 0,rgba(220,214,255,0) 60%),#eaf4f6;
  display:grid;place-items:center;min-height:100dvh}
h1,h2,h3,p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

/* device: a phone on wide screens, the whole screen on phones */
.device{width:402px;height:min(874px,calc(100dvh - 40px));border-radius:56px;padding:12px;background:#0f1d2b;
  box-shadow:0 0 0 2px #2a3a4b,0 40px 90px -30px rgba(13,43,69,.55);position:relative}
.device::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:110px;height:32px;border-radius:18px;background:#000;z-index:5}
.app{position:relative;height:100%;border-radius:44px;overflow:hidden;background:var(--mist);display:flex;flex-direction:column;isolation:isolate}
@media (max-width:520px),(max-height:620px){body{display:block}.device{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:none}.device::before{display:none}.app{border-radius:0}}

.top{display:flex;align-items:center;justify-content:space-between;padding:58px 22px 6px;flex:none}
@media (max-width:520px),(max-height:620px){.top{padding-top:max(16px,env(safe-area-inset-top))}}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand svg{flex:none}
.back{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;color:var(--ink)}
.back[hidden]{display:none}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px 24px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}

/* screen change: slides the way you are going */
.scr{display:grid;gap:16px;animation:in-f .38s var(--ease) both}
.scr.b{animation-name:in-b}
@keyframes in-f{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes in-b{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

.title{font-family:var(--f-display);font-weight:800;font-size:31px;line-height:1.05;letter-spacing:-.035em;margin-top:4px}
.lede{color:var(--ink-2);font-size:16px;line-height:1.45;max-width:34ch}
.steps{display:flex;gap:6px;align-items:center}
.steps i{height:6px;flex:1;border-radius:6px;background:#cfe3e4;transition:background .4s var(--ease)}
.steps i.on{background:linear-gradient(90deg,var(--aqua),var(--lime))}
.steps span{font-size:13px;color:var(--muted);font-weight:600;margin-left:6px;white-space:nowrap}

/* home choices */
.pick{display:grid;grid-template-columns:56px 1fr 18px;gap:14px;align-items:center;text-align:left;border:0;border-radius:26px;padding:18px;color:var(--ink);transition:transform .15s var(--ease)}
.pick:active{transform:scale(.98)}
.pick b{display:block;font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.02em}
.pick span span{display:block;color:inherit;opacity:.78;font-size:14.5px;line-height:1.35;margin-top:2px}
.pick .ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.55)}
.pick.find{background:linear-gradient(135deg,#12b5c9,#0a6f99);color:#fff;box-shadow:0 14px 30px -14px rgba(10,111,153,.7)}
.pick.find .ico{background:rgba(255,255,255,.2)}
.pick.auto{background:var(--lime);color:#21300a}
.pick.saved{background:var(--card)}
.homehero{height:150px;margin:-6px -18px 0}
.homehero svg{display:block}
.hb{animation:drift 9s linear infinite} .hb2{animation-duration:13s;animation-direction:reverse} .hb3{animation-duration:17s}
@keyframes drift{to{transform:translateX(-200px)}}
.homehero .bub circle{animation:rise 5s ease-in infinite} .homehero .bub circle:nth-child(2){animation-delay:1.6s} .homehero .bub circle:nth-child(3){animation-delay:3.1s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-110px);opacity:0}}
.homehero .hb1,.homehero .hb2,.homehero .hb3{animation-name:drift}
.homehero{animation:fill 1.2s var(--ease) both}
@keyframes fill{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* form pieces */
.q{background:var(--card);border-radius:24px;padding:18px 18px 16px;display:grid;gap:12px}
.q h2{font-size:15px;font-weight:700;color:var(--ink)}
.q .hint{font-size:13.5px;color:var(--muted);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:10px 15px;min-height:44px;background:var(--panel-2);font-weight:600;font-size:15px;color:var(--ink-2);transition:background .2s,color .2s,transform .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip:active{transform:scale(.96)}
.big{font-family:var(--f-display);font-weight:800;font-size:38px;letter-spacing:-.04em;line-height:1}
.big small{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.rowv{display:flex;justify-content:space-between;align-items:baseline}
.rowv .tag{font-size:13.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--panel-2);color:var(--ink-2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:10px;background:linear-gradient(90deg,var(--aqua) 0,var(--lime) var(--p),#dcebec var(--p))}
input[type=range]::-moz-range-track{height:10px;border-radius:10px;background:linear-gradient(90deg,var(--aqua) 0,var(--lime) var(--p),#dcebec var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-9px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(13,43,69,.25),0 0 0 6px rgba(18,181,201,.18)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(13,43,69,.25),0 0 0 6px rgba(18,181,201,.18)}
.scale{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}
.opt{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;text-align:left;border:0;border-radius:20px;padding:15px 16px;background:var(--panel-2);transition:background .2s,box-shadow .2s}
.opt b{display:block;font-size:16px;font-weight:700} .opt span span{display:block;font-size:14px;color:var(--ink-2);line-height:1.35;margin-top:2px}
.opt .rad{width:22px;height:22px;border-radius:50%;border:2px solid #b9cfd3;margin-top:1px;transition:border .2s,background .2s}
.opt[aria-checked="true"]{background:#e2f7f9;box-shadow:inset 0 0 0 2px var(--aqua)}
.opt[aria-checked="true"] .rad{border:7px solid var(--aqua);background:#fff}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;background:var(--panel-2);border-radius:16px;overflow:hidden}
.stepper button{height:52px;border:0;background:none;font-size:24px;color:var(--deep)}
.stepper input{border:0;background:none;text-align:center;font-family:var(--f-display);font-weight:800;font-size:24px;width:100%;min-width:0;outline:none}

.cta{border:0;border-radius:20px;min-height:58px;padding:0 22px;font-size:17px;font-weight:700;background:var(--ink);color:#fff;
  box-shadow:0 12px 24px -12px rgba(13,43,69,.6);transition:transform .15s var(--ease)}
.cta:active{transform:scale(.97)}
.cta.aqua{background:linear-gradient(135deg,#12b5c9,#0a6f99)}
.ghost{border:0;background:var(--card);border-radius:16px;min-height:48px;padding:0 16px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ghost:active{transform:scale(.97)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* the tank dial */
.dialwrap{position:relative;background:var(--card);border-radius:32px;padding:14px 14px 18px;display:grid;justify-items:center;gap:4px;overflow:hidden}
.dial{width:236px;height:236px;display:block}
.dial .trk{fill:none;stroke:#e3eff0;stroke-width:14;stroke-linecap:round}
.dial .val{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset 1.3s var(--ease)}
.dial .lvl{transition:transform 1.3s var(--ease)}
.dial .w1{animation:wave 4.5s linear infinite} .dial .w2{animation:wave 7s linear infinite reverse}
@keyframes wave{to{transform:translateX(-160px)}}
.dial text{font-family:var(--f-display);fill:var(--ink)}
.dial .num{font-size:62px;font-weight:800;letter-spacing:-3px}
.dial .unit{font-family:var(--f-body);font-size:13px;font-weight:700;fill:var(--ink-2)}
.dial.busy .val{stroke-dasharray:18 82;animation:spin 1.1s linear infinite;transform-origin:120px 120px}
@keyframes spin{to{transform:rotate(360deg)}}
.answer{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.12;letter-spacing:-.03em;text-align:center;max-width:15ch}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px}
.pill i{width:9px;height:9px;border-radius:50%}
.pill.ok{background:#dcf6f9;color:var(--pass-ink)} .pill.ok i{background:var(--aqua)}
.pill.warn{background:var(--amber-bg);color:var(--amber-ink)} .pill.warn i{background:var(--amber)}
.pill.bad{background:var(--coral-bg);color:#a42926} .pill.bad i{background:var(--coral)}
.pill.idle{background:var(--panel-2);color:var(--ink-2)} .pill.idle i{background:var(--muted)}

/* meters */
.meters{background:var(--card);border-radius:24px;padding:16px 18px;display:grid;gap:16px}
.m{display:grid;gap:7px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px}
.mh b{font-weight:700} .mh span{color:var(--ink-2)}
.bar{position:relative;height:12px;border-radius:12px;background:#e7f0f1;overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:12px;width:0;transition:width 1.1s var(--ease)}
.m.ct .bar i{background:linear-gradient(90deg,#7fdbe6,var(--aqua))}
.m.act .bar i{background:linear-gradient(90deg,#b8acff,var(--violet))}
.m.over .bar i{background:linear-gradient(90deg,#ffd38a,var(--amber))}
.bar em{position:absolute;left:66.6%;top:-5px;bottom:-5px;width:3px;border-radius:3px;background:var(--ink)}
.mf{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.mf b{color:var(--ink-2);font-weight:600}

.panel{background:var(--card);border-radius:24px;padding:16px 18px;display:grid;gap:12px}
.panel h3{font-size:15px;font-weight:700}
.sub{font-size:14px;color:var(--ink-2);line-height:1.45}
details.panel:not([open]){gap:0}
details.panel summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700;font-size:15px;min-height:28px}
details.panel summary::-webkit-details-marker{display:none}
details.panel summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--deep);border-bottom:2.5px solid var(--deep);transform:rotate(45deg);transition:transform .25s var(--ease);margin-right:4px}
details[open].panel summary::after{transform:rotate(-135deg)}
.checks{display:grid}
.checks div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--grid);font-size:14.5px}
.checks div:first-child{border-top:0}
.ok-t{color:var(--pass-ink);font-weight:700} .no-t{color:var(--amber-ink);font-weight:700}
.whatif{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.whatif .chip{flex:none}
.fine{font-size:12.5px;color:var(--muted);line-height:1.45;text-align:center;padding:0 10px}

/* saved */
.save-i{background:var(--card);border-radius:22px;padding:14px 14px 14px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;animation:in-f .35s var(--ease) both}
.save-i b{font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.03em}
.save-i span{font-size:13.5px;color:var(--ink-2);grid-column:1}
.save-i button{grid-row:1 / span 2;grid-column:2;width:40px;height:40px;border:0;border-radius:50%;background:var(--panel-2);color:var(--ink-2)}
.empty{background:var(--card);border-radius:24px;padding:26px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty p{color:var(--ink-2);max-width:28ch;line-height:1.45}

/* autopilot */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#d9eced;border-radius:16px;padding:4px;position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;min-height:42px;border-radius:12px;font-weight:700;font-size:15px;color:var(--ink-2);transition:color .25s}
.seg button[aria-checked="true"]{color:var(--ink)}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(13,43,69,.12);transition:transform .35s var(--ease)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:20px;padding:13px 14px;display:grid;gap:2px}
.tile span{font-size:13px;color:var(--ink-2);font-weight:600}
.tile b{font-family:var(--f-display);font-size:25px;font-weight:800;letter-spacing:-.03em}
.tile b small{font-family:var(--f-body);font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:0;margin-left:4px}
.tile.flash b{animation:flash .9s var(--ease)}
@keyframes flash{0%{color:var(--deep)}100%{color:var(--ink)}}
.log{display:grid}
.log div{display:grid;grid-template-columns:52px 1fr;gap:2px 10px;padding:10px 0;border-top:1px solid var(--grid)}
.log div:first-child{border-top:0}
.log time{font-size:13px;color:var(--muted);font-weight:600;grid-row:span 2}
.log b{font-weight:700} .log span{font-size:13.5px;color:var(--ink-2)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--lime-ink);background:#eef9d4;border-radius:999px;padding:6px 11px}
.live i{width:8px;height:8px;border-radius:50%;background:#7cb518;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.applyb{border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;min-height:44px;padding:0 16px}

/* tab bar */
.tabs{flex:none;display:grid;grid-template-columns:repeat(2,1fr);padding:8px 14px 26px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid rgba(13,43,69,.06)}
@media (max-width:520px),(max-height:620px){.tabs{padding-bottom:max(10px,env(safe-area-inset-bottom))}}
.tabs a{display:grid;justify-items:center;gap:3px;padding:6px 0;border-radius:14px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;transition:color .2s}
.tabs a svg{width:24px;height:24px;transition:transform .3s var(--ease)}
.tabs a.on{color:var(--deep)} .tabs a.on svg{transform:translateY(-2px)}
.tabs a .dotc{width:5px;height:5px;border-radius:50%;background:transparent;transition:background .2s}
.tabs a.on .dotc{background:var(--lime)}

.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:600;font-size:14.5px;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.chart{min-width:0}
.mapread{font-size:14px;color:var(--ink-2);min-height:2.6em}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- de-templating pass: square edges, solid colour, ruled sections instead of floating cards ---- */
:root{--paper:#f6f8f7;--mist:#f6f8f7;--bg:#f6f8f7;--rule:#d3dddf;--line:#0d2b45}
body{background:#dfe9ea}
.device{border-radius:46px}
.app{border-radius:34px;background:var(--paper)}
.top{border-bottom:1px solid var(--rule);padding-bottom:12px;background:var(--paper)}
.brand{font-size:17px;letter-spacing:-.01em}
.back{border-radius:6px;background:none;border:1px solid var(--rule)}
main{padding:0 20px 24px}
.scr{gap:0}
.scr > *{margin-top:18px}
.title{font-size:34px;line-height:1;letter-spacing:-.04em;margin-top:22px}
.by{font-size:14px;font-weight:600;color:var(--deep);margin-top:10px}
.lede{font-size:15.5px}
.steps{margin-top:16px}
.steps i{height:3px;border-radius:0;background:var(--rule)}
.steps i.on{background:var(--ink)}
/* sections: ruled, not boxed */
.q,.panel,.meters{background:none;border-radius:0;padding:16px 0 4px;border-top:1px solid var(--rule);box-shadow:none}
.q h2,.panel h3{font-size:14px;font-weight:700;color:var(--ink)}
details.panel summary{font-size:15px}
details.panel summary::after{border-color:var(--ink)}
.chip{border-radius:4px;background:none;border:1px solid var(--rule);color:var(--ink);min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.big{font-size:44px}
.rowv .tag{border-radius:3px;background:#e1f4f6;color:var(--pass-ink)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:0;background:linear-gradient(90deg,var(--aqua) var(--p),#d6e2e4 var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:0;background:linear-gradient(90deg,var(--aqua) var(--p),#d6e2e4 var(--p))}
input[type=range]::-webkit-slider-thumb{width:22px;height:22px;margin-top:-8px;border-radius:2px;background:var(--ink);box-shadow:none}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:2px;background:var(--ink);box-shadow:none}
.opt{border-radius:0;background:none;border-top:1px solid var(--grid);padding:14px 0;grid-template-columns:20px 1fr}
.opt:first-child{border-top:0}
.opt[aria-checked="true"]{background:none;box-shadow:none}
.opt .rad{width:20px;height:20px;border-radius:50%}
.opt[aria-checked="true"] .rad{border:6px solid var(--ink)}
.opt[aria-checked="true"] b{color:var(--deep)}
.stepper{border-radius:4px;background:none;border:1px solid var(--rule)}
.cta{border-radius:6px;min-height:56px;box-shadow:none}
.cta.aqua{background:var(--deep)}
.ghost{border-radius:6px;background:none;border:1px solid var(--rule)}
.btnrow{margin-top:18px}
/* home: two solid blocks, edge to edge */
.pick{border-radius:6px;box-shadow:none!important;padding:18px 16px}
.pick.find{background:var(--deep)}
.pick.find .ico{background:rgba(255,255,255,.14)}
.pick .ico{border-radius:4px;width:52px;height:52px}
.pick.saved{background:none;border:1px solid var(--rule)}
.pick + .pick{margin-top:10px}
.homehero{margin:0 -20px;height:96px;overflow:hidden}
.homehero svg{margin-top:-46px}
/* dial block: open, on the paper */
.dialwrap{background:none;border-radius:0;padding:8px 0 18px}
.answer{font-size:28px;max-width:16ch}
.pill{border-radius:3px;padding:6px 10px;font-size:13.5px}
.pill i{border-radius:1px;width:8px;height:8px}
.meters{gap:18px;padding-top:18px}
.bar{height:8px;border-radius:0;background:#e1e9eb}
.bar i{border-radius:0}
.m.ct .bar i{background:var(--aqua)} .m.act .bar i{background:var(--violet)} .m.over .bar i{background:var(--amber)}
.bar em{border-radius:0;width:2px;top:-4px;bottom:-4px}
.whatif .chip{min-height:38px;padding:8px 12px}
.checks div{font-size:14px}
/* saved */
.save-i{background:none;border-radius:0;border-top:1px solid var(--rule);padding:14px 0;animation:none}
.save-i button{border-radius:4px;background:none;border:1px solid var(--rule)}
.empty{background:none;border-radius:0;border-top:1px solid var(--rule);padding:28px 0;justify-items:start;text-align:left}
/* autopilot */
.seg{border-radius:6px;background:#e3ebed;padding:3px}
.seg .knob{border-radius:4px;box-shadow:none;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3)}
.seg button{border-radius:4px}
.tiles{gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.tile{background:none;border-radius:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 12px}
.live{border-radius:3px}
.live i{border-radius:1px}
.applyb{border-radius:6px}
.log div{border-top:1px solid var(--grid)}
/* tab bar */
.tabs{background:var(--paper);border-top:1px solid var(--rule);-webkit-backdrop-filter:none;backdrop-filter:none;padding-top:0}
.tabs a{border-radius:0;border-top:2px solid transparent;padding-top:9px}
.tabs a.on{border-top-color:var(--ink);color:var(--ink)}
.tabs a .dotc{display:none}
.tabs a.on svg{transform:none}
.toast{border-radius:4px}
.fine{text-align:left;padding:0}

/* ---- polish pass ---- */
:root{--muted:#5e7387}
.title{text-wrap:balance}
.answer{text-wrap:balance}
.train{margin:14px 0 0}
.train svg{display:block;overflow:visible}
.train text{font-family:var(--f-body);font-size:10.5px;font-weight:700;fill:var(--ink-2);text-anchor:middle}
.tpipe{stroke:var(--ink);stroke-width:3;fill:none}
.tflow{stroke:var(--aqua);stroke-width:3;fill:none;stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
.tflow2{stroke:var(--aqua);stroke-width:1.6;fill:none;stroke-dasharray:4 6;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.tbasin{fill:#dff3f6;stroke:var(--ink);stroke-width:1.6}
.tbaf{stroke:var(--ink);stroke-width:1.4}
.tnode{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.tln{stroke:var(--ink);stroke-width:1.4}
.tarr{fill:var(--ink)}
.flowrow{display:grid;grid-template-columns:repeat(4,1fr);position:relative;border-top:1px solid var(--rule);padding-top:16px}
.flowrow::before{content:"";position:absolute;left:12.5%;right:12.5%;top:21px;height:2px;background:repeating-linear-gradient(90deg,var(--aqua) 0 6px,transparent 6px 11px);animation:slide 1.2s linear infinite}
@keyframes slide{to{background-position:22px 0}}
.fst{display:grid;justify-items:center;text-align:center;gap:1px;position:relative}
.fst i{width:12px;height:12px;border:2px solid var(--ink);background:var(--paper);margin-bottom:8px;position:relative;z-index:1}
.fst span{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.fst b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.02em}
.fst small{font-size:10.5px;color:var(--muted);line-height:1.2;max-width:9ch}
.fst.bad b{color:var(--amber-ink)} .fst.bad i{border-color:var(--amber);background:var(--amber)}
.spark{display:block;overflow:visible}
.spark text{font-family:var(--f-body);font-size:10.5px;font-weight:600;fill:var(--muted)}

/* ---- landing + rounder pass ---- */
.land{display:grid;gap:0;min-height:100%;align-content:start}
.scene{width:calc(100% + 40px);margin:6px -20px 0;display:block;overflow:visible}
.scene .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.scene .pop{transform-box:fill-box;transform-origin:center bottom;opacity:0;animation:pop .6s var(--ease) forwards}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
.scene .bwater{transform:translateY(90px);animation:rise 1.6s .5s var(--ease) forwards}
@keyframes rise{to{transform:translateY(0)}}
.scene .bwave{transform:translateY(90px);animation:rise 1.6s .5s var(--ease) forwards,wv 3.2s 2.1s linear infinite}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-64px)}}
.scene .lbl text{font-family:var(--f-body);font-size:12px;font-weight:700;fill:var(--ink-2);text-anchor:middle;opacity:0;animation:fadein .5s 1.3s forwards}
@keyframes fadein{to{opacity:1}}
.ltitle{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.98;letter-spacing:-.045em;margin-top:8px;text-wrap:balance;opacity:0;animation:up .7s .35s var(--ease) forwards}
.land .by{opacity:0;animation:up .7s .5s var(--ease) forwards;margin-top:12px}
.lacts{display:grid;gap:10px;margin-top:26px;opacity:0;animation:up .7s .65s var(--ease) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cta{border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.cta.big{min-height:62px;font-size:18px;background:var(--deep)}
.ghost{border-radius:14px;min-height:54px;font-size:16px}
.lastc{margin-top:14px;border:0;background:none;text-align:left;padding:10px 0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline;opacity:0;animation:up .7s .8s var(--ease) forwards}
.lastc span{font-size:13.5px;color:var(--muted);font-weight:600} .lastc b{font-weight:700;color:var(--deep)}
.chip{border-radius:10px}
.whatif .chip{border-radius:10px}
.back{border-radius:12px}
.seg{border-radius:14px} .seg .knob,.seg button{border-radius:11px}
.tiles{border-radius:14px;overflow:hidden}
.pill,.live,.rowv .tag{border-radius:8px}
.stepper{border-radius:12px}
.save-i button{border-radius:10px}
.toast{border-radius:12px}
.applyb{border-radius:12px}
.opt{transition:background .2s}
.opt:active{background:var(--grid)}
.opt[aria-checked="true"] .rad{animation:tick .3s var(--ease)}
@keyframes tick{50%{transform:scale(1.2)}}
.cta:hover{filter:brightness(1.08)}
.ghost:hover{border-color:var(--ink-2)}

/* ---- big-motion pass ---- */
main{display:flex;flex-direction:column} main > .scr{flex:1;align-content:start} main > .scr:has(.land){align-content:stretch}
.land{min-height:100%}
.credit{margin-top:auto;padding-top:28px;font-size:12px;color:var(--muted);font-weight:600}
.fx{position:absolute;left:0;right:0;top:-48px;height:calc(100% + 96px);z-index:40;pointer-events:none;display:flex;flex-direction:column;transform:translateY(100%);will-change:transform}
.fxw{display:block;width:200%;height:48px;flex:none;fill:var(--deep);animation:fxw 1.1s linear infinite}
.fxbot{animation-direction:reverse}
@keyframes fxw{to{transform:translateX(-50%)}}
.fxb{flex:1;background:var(--deep);position:relative;overflow:hidden;display:grid;place-items:center}
.fxi{display:none;position:relative;justify-items:center;gap:18px}
.fx.intro .fxi{display:grid}
.fx.intro .fxdrop{animation:dropin .62s cubic-bezier(.5,0,.75,0) both,squash .5s .62s var(--ease) both}
@keyframes dropin{from{transform:translateY(-420px)}to{transform:none}}
@keyframes squash{0%{transform:scale(1.25,.7)}50%{transform:scale(.92,1.1)}100%{transform:none}}
.fxring{position:absolute;top:0;width:84px;height:84px;border-radius:50%;border:3px solid #b9e04a;opacity:0}
.fx.intro .fxring{animation:ring 1s .6s var(--ease) both} .fx.intro .fxring.r2{animation-delay:.78s}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(3.2);opacity:0}}
.fxi p{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.035em;color:#fff;opacity:0;animation:up .5s .75s var(--ease) forwards}
.bb{position:absolute;bottom:-20px;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.35);animation:bub 1.1s ease-in infinite}
@keyframes bub{to{transform:translateY(-900px)}}
.shk1{animation:shk1 .42s cubic-bezier(.36,.07,.19,.97)} .shk2{animation:shk2 .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk1{10%,90%{transform:translate3d(-1px,1px,0)}20%,80%{transform:translate3d(3px,-2px,0)}30%,50%,70%{transform:translate3d(-5px,2px,0)}40%,60%{transform:translate3d(5px,-1px,0)}}
@keyframes shk2{10%,90%{transform:translate3d(-2px,2px,0) rotate(-.4deg)}20%,80%{transform:translate3d(6px,-3px,0) rotate(.6deg)}30%,50%,70%{transform:translate3d(-9px,3px,0) rotate(-.8deg)}40%,60%{transform:translate3d(9px,-2px,0) rotate(.8deg)}}
.dialwrap{position:relative}
.rip{position:absolute;left:50%;top:126px;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:3px solid var(--aqua);opacity:0;pointer-events:none}
.dialwrap.landed .rip{animation:ring .9s var(--ease)}
.dialwrap.landed .dial{animation:thud .5s var(--ease)}
@keyframes thud{0%{transform:scale(1)}30%{transform:scale(1.08)}60%{transform:scale(.97)}100%{transform:scale(1)}}
/* drawn icons */
.ic .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s var(--ease) forwards}
.hd{display:flex;align-items:center;gap:10px}
.hico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#e1f4f6;color:var(--deep);flex:none}
.rowv .hd{flex:1}
.ib{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--deep);background:none;color:var(--deep);font:italic 700 13px/1 Georgia,"Times New Roman",serif;display:inline-grid;place-items:center;padding:0;margin-left:6px;vertical-align:middle;flex:none;transition:background .2s,color .2s,transform .15s}
.ib:hover{background:var(--deep);color:#fff} .ib:active{transform:scale(.9)}
.title .ib{width:26px;height:26px;font-size:14px;vertical-align:.25em}
.mh b{display:inline-flex;align-items:center}
.fst span{display:inline-flex;align-items:center} .fst .ib{width:18px;height:18px;font-size:10.5px;margin-left:3px;border-width:1.3px}
.tile span{display:flex;align-items:center;gap:6px} .tile .ic{color:var(--deep)} .tile .ib{margin-left:auto;width:20px;height:20px;font-size:11px}
/* pump */
.nopump .npico{width:64px;height:64px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--rule);opacity:0;animation:npin .45s var(--ease) forwards}
.nopump h3,.nopump p,.nopump ul{opacity:0;animation:npin .45s var(--ease) forwards}.nopump h3{animation-delay:.06s}.nopump p{animation-delay:.12s}.nopump ul{animation-delay:.18s}
.npl{list-style:none;margin:16px 0 6px;padding:0;border-top:1px solid var(--rule)}.npl li{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--rule);font-size:14px}.npl em{font-style:normal;color:var(--muted)}
@keyframes npin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.nopump *{animation:none!important;opacity:1!important}}

.tour{position:absolute;left:10px;right:10px;bottom:92px;z-index:60;max-height:56%;overflow-y:auto;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px 12px;box-shadow:0 18px 40px -16px rgba(13,43,69,.6)}
.tour .tk{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.tour h3{margin:4px 0 6px;font-size:18px;color:#fff}
.tour p{margin:0 0 12px;font-size:14.5px;line-height:1.45}
.tour .tb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tour .tb span{display:flex;gap:8px}
.tour button{border:0;border-radius:10px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px;background:rgba(255,255,255,.14);color:#fff}
.tour button.tn{background:var(--lime);color:#21300a}
.tour button.tx{background:none;padding:0 4px;opacity:.75}
.tour button:disabled{opacity:.35}
.tour-ring{outline:3px solid var(--lime);outline-offset:4px;border-radius:6px}
.tag.demo{background:var(--lime);color:#21300a;font-weight:800;letter-spacing:.04em}
.pump{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border:1px solid var(--rule);border-radius:14px;padding:10px 12px;margin-top:14px}
.pico{width:44px;height:44px;border-radius:12px;background:#eef1f2;display:grid;place-items:center;color:var(--ink-2)}
.pump b{display:flex;align-items:center;font-size:15px} .pump span#pumpst{font-size:13px;color:var(--muted);display:block}
.ghost.sm{min-height:40px;padding:0 14px;font-size:14.5px;border-radius:12px}
/* sheet */
.sh{position:absolute;inset:0;z-index:50}
.shb{position:absolute;inset:0;background:rgba(13,43,69,.45);opacity:0;transition:opacity .3s}
.shp{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:10px 22px 30px;transform:translateY(105%);transition:transform .5s cubic-bezier(.16,1.2,.3,1)}
.sh.on .shb{opacity:1} .sh.on .shp{transform:none}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 14px}
.shp h3{font-family:var(--f-display);font-size:26px;font-weight:800;letter-spacing:-.03em;margin:10px 0 8px}
.shp h4{font-size:13.5px;font-weight:700;color:var(--deep);margin:14px 0 4px}
.shp p{font-size:15px;line-height:1.5;color:var(--ink-2)}
.shp .cta{width:100%;margin-top:20px}
.shp .btnrow{margin-top:20px} .shp .btnrow .cta{margin-top:0}
.shp .ctr{text-align:center}
.shico{width:64px;height:64px;border-radius:18px;background:#e1f4f6;color:var(--deep);display:grid;place-items:center;animation:pop .5s var(--ease)}
.shico.bad{background:var(--coral-bg);color:var(--coral)}
.shp.nope{animation:shk2 .55s cubic-bezier(.36,.07,.19,.97)}
.scan{position:relative;width:150px;height:150px;margin:8px auto 4px;display:grid;place-items:center}
.scan span{position:absolute;inset:40px;border-radius:50%;border:2px solid var(--aqua);animation:sonar 2.1s ease-out infinite}
.scan span:nth-child(2){animation-delay:.7s} .scan span:nth-child(3){animation-delay:1.4s}
@keyframes sonar{from{transform:scale(.7);opacity:1}to{transform:scale(2.1);opacity:0}}
.scanc{width:70px;height:70px;border-radius:50%;background:var(--deep);color:#fff;display:grid;place-items:center;position:relative;animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--aqua);animation:dot 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-6px);opacity:.4}}

/* ---- light effects pass ---- */
.bloom{position:absolute;z-index:45;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--c) 0,rgba(255,255,255,0) 66%);opacity:0;transform:scale(calc(.3 * var(--s)));
  animation:bloom 1.2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes bloom{25%{opacity:.75}100%{opacity:0;transform:scale(calc(1.6 * var(--s)))}}
.spark{position:absolute;z-index:46;width:6px;height:10px;margin:-5px 0 0 -3px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;pointer-events:none;
  transform:rotate(var(--r));animation:spark .85s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) rotate(var(--r)) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4)}}
.pop1{animation:pop1 .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop1{40%{transform:scale(1.08)}}
.big{transform-origin:left bottom;display:inline-block}
.bar i{position:absolute}
.bar i.go::after{content:"";position:absolute;right:-4px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:inherit;filter:blur(5px);opacity:0;animation:tip 1.2s ease-out}
@keyframes tip{10%{opacity:1}100%{opacity:0}}
.dialwrap.landed .dial{animation:settle .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes settle{0%{transform:scale(.96)}50%{transform:scale(1.04)}100%{transform:none}}
.dialwrap.landed .rip{animation:ring 1.1s var(--ease)}
.lastused{font-style:normal;font-size:11.5px;font-weight:700;color:var(--deep);background:#e1f4f6;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:2px}
.opt[aria-checked="true"]{background:linear-gradient(90deg,rgba(18,181,201,.14),rgba(18,181,201,0))}
.opt[aria-checked="true"] .rad{animation:tick .35s cubic-bezier(.2,1.6,.4,1)}
#save.done{color:var(--violet);border-color:var(--violet)}
#save.done svg{fill:currentColor;animation:pop1 .35s cubic-bezier(.2,1.6,.4,1)}
.fxb::after{content:"";position:absolute;inset:-40%;background:
  radial-gradient(60px 30px at 20% 30%,rgba(255,255,255,.12),transparent 70%),radial-gradient(80px 40px at 70% 60%,rgba(255,255,255,.10),transparent 70%),
  radial-gradient(50px 26px at 40% 80%,rgba(255,255,255,.12),transparent 70%),radial-gradient(70px 34px at 85% 20%,rgba(185,224,74,.12),transparent 70%);
  animation:caustic 3s ease-in-out infinite alternate}
@keyframes caustic{to{transform:translate(30px,-20px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){.bloom,.spark{display:none}}
.q[hidden]{display:none}
.cta.reward{position:relative;overflow:hidden;width:100%;min-height:64px;margin:14px 0 4px;border-radius:20px;color:#fff;font-size:18px;background:linear-gradient(100deg,#12b5c9,#0a6f99 55%,#7b61ff);box-shadow:0 14px 30px -12px rgba(10,111,153,.7),inset 0 1px 0 rgba(255,255,255,.35);animation:rwpulse 2.2s ease-in-out infinite}
.cta.reward .rt{position:relative;z-index:1}
.cta.reward .rt::after{content:"  \2192"}
.cta.reward .rf{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.3)}
@keyframes rwpulse{0%,100%{transform:none}50%{transform:scale(1.025)}}
@media (prefers-reduced-motion:reduce){.cta.reward{animation:none}}
/* ---- impact screen: "what you protected" ---- */
.imp{display:grid;gap:0;align-content:start;min-height:100%}
.imp .sea{position:relative;height:310px;margin:-8px -20px 0;overflow:hidden;border-radius:0 0 40px 40px;background:linear-gradient(180deg,#a8f0f5 0%,#12b5c9 34%,#0a6f99 78%,#08507a 100%);box-shadow:0 18px 40px -18px rgba(10,111,153,.55)}
.imp .sea svg{position:absolute;inset:0;width:100%;height:100%}
.imp .sea .glow{position:absolute;left:50%;top:46%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:radial-gradient(circle,rgba(185,224,74,.55),rgba(185,224,74,0) 68%);opacity:0;animation:impglow 1.4s .5s ease-out forwards}
@keyframes impglow{0%{opacity:0;transform:scale(.4)}60%{opacity:1}100%{opacity:.55;transform:scale(1.15)}}
.imp .hl{text-align:center;padding:22px 0 0;display:grid;gap:6px;justify-items:center}
.imp .kick{font-size:12px;max-width:300px;line-height:1.35;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--deep)}
.imp .bignum{font-size:76px;padding:0 .08em .06em;line-height:1;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#12b5c9,#0a6f99 70%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(185,224,74,.55))}
.imp .bignum.pop1{animation:impnum .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes impnum{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.imp .unit{font-size:26px;font-weight:800;color:var(--ink)}
.imp .est{margin:2px 0 0;font-size:13px;color:var(--muted,#7a8a96)}
.imp .lede2{max-width:300px;margin:4px auto 0;font-size:15.5px;line-height:1.4;color:var(--ink-2)}
.imp .rise{opacity:0;transform:translateY(14px);animation:imprise .7s var(--ease) forwards}

<script>
// Removed Is Not Safe: chlorine + ciprofloxacin model (JavaScript port of ris/*.py)
// State: [FC, TA, MCA, CT, CIP, NCL, P1, P2, DCA]  (mol/L; CT in mg*min/L; DCA = dichloramine, added 10-15)
const RIS = (function () {
  const MW_CL2 = 70.9, MW_N = 14.0, MW_CIP = 331.35, NS = 9;
  const DEFAULTS = {
    pKa_HOCl: 7.54, pKa_NH4: 9.25, k_NH3_HOCl: 3.07e6, k_hyd_NH2Cl: 2.1e-5, k_demand: 2e-4,        // Morris 1966; Qiang & Adams 2004
    // Dichloramine (unified chloramine model, Jafvert & Valentine 1992 / Vikesland 2001; per-hour table values / 3600)
    k_HOCl_NH2Cl: 1.0e6 / 3600, k_hyd_NHCl2: 2.3e-3 / 3600, k_NHCl2_NH3: 2.2e8 / 3600,
    kd_H: 2.5e7 / 3600, kd_H2CO3: 4.0e4 / 3600, kd_HCO3: 8.0e2 / 3600, C_T_carbonate: 0,
    pKa1: 6.2, pKa2: 8.8,                                                      // Dodd 2005 Table 1
    k_HOCl_cation: 4.3e3, k_HOCl_neutral: 3.8e5, k_HOCl_anion: 4.9e7,          // Dodd 2005 Table 3
    k_frag_neutral: 2.4e-4, k_frag_anion: 7.6e-4, pKa_int: 6.2,                // Dodd 2005 p. 7071 (split = estimate)
    k_CC_cipro: 29, k_P1_HOCl: 13, n_Cl_P1: 2, k_rev_bisulfite: 0,             // Dodd p. 7074; Fig 3 estimate; unknown
  };
  const NU_WATER = 0.95e-6, D_CIPRO = 7e-10;                                   // m^2/s; cipro diffusivity is an ESTIMATE
  const acid = (pH, pKa) => 1 / (1 + Math.pow(10, pH - pKa));

  function consts(p, pH) {
    const h = Math.pow(10, -pH), K1 = Math.pow(10, -p.pKa1), K2 = Math.pow(10, -p.pKa2);
    const D = h * h + K1 * h + K1 * K2;
    const aCat = h * h / D, aNeu = K1 * h / D, aAn = K1 * K2 / D;
    const aInt = 1 - acid(pH, p.pKa_int);
    const C1 = Math.pow(10, -6.35), C2 = Math.pow(10, -10.33), dC = h * h + C1 * h + C1 * C2;
    const kd = p.kd_H * h + p.kd_H2CO3 * p.C_T_carbonate * h * h / dC + p.kd_HCO3 * p.C_T_carbonate * C1 * h / dC;
    return {
      aHOCl: acid(pH, p.pKa_HOCl), aNH3: 1 - acid(pH, p.pKa_NH4), kd,
      kH: aCat * p.k_HOCl_cation + aNeu * p.k_HOCl_neutral + aAn * p.k_HOCl_anion,
      kf: (1 - aInt) * p.k_frag_neutral + aInt * p.k_frag_anion,
      frac: [aCat, aNeu, aAn],
    };
  }

  function rates(y, p, c, out) {
    const FC = y[0], TA = y[1], MCA = y[2], CIP = y[4], NCL = y[5], P1 = y[6], DCA = y[8];
    const HOCl = c.aHOCl * FC, NH3 = c.aNH3 * TA, CC = MCA + DCA;
    const rMCA = p.k_NH3_HOCl * HOCl * NH3, rDem = p.k_demand * FC, rHyd = p.k_hyd_NH2Cl * MCA;
    const rDCA = p.k_HOCl_NH2Cl * HOCl * MCA, rHyd2 = p.k_hyd_NHCl2 * DCA;
    const rBack = p.k_NHCl2_NH3 * DCA * NH3, rDisp = c.kd * MCA * MCA;
    const rH = c.kH * HOCl * CIP, rCC = p.k_CC_cipro * CC * CIP, rF = c.kf * NCL, rP = p.k_P1_HOCl * HOCl * P1;
    const fM = CC > 0 ? MCA / CC : 0, fD = CC > 0 ? DCA / CC : 0;
    out[0] = -rMCA + rHyd - rDCA + rHyd2 - rDem - rH - p.n_Cl_P1 * rP;
    out[1] = -rMCA + rHyd - rBack + rDisp + rCC * fM;
    out[2] = rMCA - rHyd - rDCA + rHyd2 + 2 * rBack - 2 * rDisp + rCC * (fD - fM);
    out[3] = FC * MW_CL2 * 1000 / 60;
    out[4] = -rH - rCC;
    out[5] = rH + rCC - rF;
    out[6] = rF - rP;
    out[7] = rP;
    out[8] = rDCA - rHyd2 - rBack + rDisp - rCC * fD;
  }

  // ---- linear algebra for the implicit solver
  function solve(A, b) {
    const n = b.length;
    for (let i = 0; i < n; i++) {
      let piv = i;
      for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[piv][i])) piv = r;
      [A[i], A[piv]] = [A[piv], A[i]]; [b[i], b[piv]] = [b[piv], b[i]];
      const d = A[i][i] || 1e-300;
      for (let r = i + 1; r < n; r++) {
        const f = A[r][i] / d;
        if (f) { for (let k = i; k < n; k++) A[r][k] -= f * A[i][k]; b[r] -= f * b[i]; }
      }
    }
    const x = new Array(n);
    for (let i = n - 1; i >= 0; i--) {
      let s = b[i];
      for (let k = i + 1; k < n; k++) s -= A[i][k] * x[k];
      x[i] = s / (A[i][i] || 1e-300);
    }
    return x;
  }

  // One backward-Euler step: y_new = y + dt * F(y_new), F(y) = rates(y) + extra(y)
  // extra(y) adds flow terms for tanks: (yin - y)/th
  function beStep(y, dt, f) {
    const n = y.length, F0 = new Array(n), F1 = new Array(n);
    let z = y.slice();
    for (let it = 0; it < 8; it++) {
      f(z, F0);
      const G = z.map((v, i) => v - y[i] - dt * F0[i]);
      const J = [];
      for (let j = 0; j < n; j++) J.push(new Array(n).fill(0));
      for (let j = 0; j < n; j++) {
        const h = 1e-7 * Math.max(Math.abs(z[j]), 1e-12);
        const zj = z[j]; z[j] = zj + h; f(z, F1); z[j] = zj;
        for (let i = 0; i < n; i++) J[i][j] = (i === j ? 1 : 0) - dt * (F1[i] - F0[i]) / h;
      }
      const dz = solve(J, G.map(v => -v));
      let big = 0;
      for (let i = 0; i < n; i++) {
        z[i] += dz[i];
        if (i !== 3) big = Math.max(big, Math.abs(dz[i]) / (Math.abs(z[i]) + 1e-12));
      }
      if (big < 1e-9) break;
    }
    for (let i = 0; i < n; i++) if (z[i] < 0) z[i] = 0;
    return z;
  }

  // Time grid: geometric from 1e-4 s, then capped steps
  function grid(tEnd, dtMax) {
    const t = [0];
    let dt = 1e-4;
    while (t[t.length - 1] < tEnd) { t.push(Math.min(t[t.length - 1] + dt, tEnd)); dt = Math.min(dt * 1.15, dtMax); }
    return t;
  }

  function integrate(y0, p, pH, tEnd, dtMax = 5) {
    const c = consts(p, pH), f = (y, o) => rates(y, p, c, o);
    const T = grid(tEnd, dtMax), Y = [pad(y0)];
    let y = pad(y0);
    for (let i = 1; i < T.length; i++) { y = beStep(y, T[i] - T[i - 1], f); Y.push(y); }
    return { T, Y };
  }
  const pad = y => y.length >= NS ? y.slice() : y.concat(new Array(NS - y.length).fill(0));

  // After bisulfite: chlorine gone; NCL -> cipro (k_rev) or -> P1 (k_frag)
  function bisulfite(y, p, pH, minutes) {
    const kf = consts(p, pH).kf, kr = p.k_rev_bisulfite, k = kf + kr, t = minutes * 60;
    const left = y[5] * Math.exp(-k * t), gone = y[5] - left;
    const toCip = k > 0 ? gone * kr / k : 0;
    const out = y.slice();
    out[0] = 0; out[2] = 0; out[8] = 0; out[4] = y[4] + toCip; out[5] = left; out[6] = y[6] + gone - toCip;
    return out;
  }

  function initial(s) {
    const Cl = s.Cl_mgL / 1000 / MW_CL2, N = s.NH3_mgN_L / 1000 / MW_N, C = s.cipro_mgL / 1000 / MW_CIP;
    if (s.mode === 'preformed') return [Math.max(Cl - N, 0), Math.max(N - Cl, 0), Math.min(Cl, N), 0, C, 0, 0, 0, 0];
    if (s.mode === 'together') return [Cl, N, 0, 0, C, 0, 0, 0, 0];
    return [Cl, 0, 0, 0, C, 0, 0, 0, 0];
  }

  function summary(yEnd, yOut, C0) {
    const ug = v => Math.max(v, 0) * MW_CIP * 1e6;
    return {
      FC_end: yEnd[0] * MW_CL2 * 1000, CC_end: (yEnd[2] + 2 * yEnd[8]) * MW_CL2 * 1000,
      DCA_end: 2 * yEnd[8] * MW_CL2 * 1000, CT: yEnd[3],
      cipro_end: ug(yEnd[4]), NCL_end: ug(yEnd[5]), thio: ug(yEnd[4] + yEnd[5]),
      cipro_out: ug(yOut[4]), NCL_out: ug(yOut[5]), P1_out: ug(yOut[6]), P2_out: ug(yOut[7]),
      drugOnly: 100 * (1 - Math.max(yOut[4], 0) / C0),
      core: 100 * (yOut[4] + yOut[5] + yOut[6] + yOut[7]) / C0,
      returned: 100 * Math.max(yOut[4] - yEnd[4], 0) / C0,
    };
  }

  function runBatch(s, p) {
    const y0 = initial(s), tr = integrate(y0, p, s.pH, s.contact_min * 60);
    const yEnd = tr.Y[tr.Y.length - 1], yOut = bisulfite(yEnd, p, s.pH, s.after_min);
    return { tr, res: summary(yEnd, yOut, y0[4]) };
  }

  // Steady state through N tanks in series: pseudo-time implicit Euler per tank
  function runFlow(s, p, N) {
    const c = consts(p, s.pH), y0 = initial(s), th = s.contact_min * 60 / N;
    let yin = y0.slice();
    for (let k = 0; k < N; k++) {
      const yf = yin.slice(), R = new Array(NS);
      const f = (y, o) => { rates(y, p, c, R); for (let i = 0; i < NS; i++) o[i] = (yf[i] - y[i]) / th + R[i]; };
      let y = yf.slice(), dt = 1e-4;
      for (let it = 0; it < 120 && dt < 1e4 * th; it++) { y = beStep(y, dt, f); dt *= 1.35; }
      yin = y;
    }
    return summary(yin, bisulfite(yin, p, s.pH, s.after_min), y0[4]);
  }

  // ---- tube size + pump flow -> flow pattern (port of ris/flow_reactor.tube_hydraulics, added 10-15)
  // COIL_TABLE start: generated by scripts/build_coil_table.py from the particle model; do not edit by hand
  const COIL_TABLE = {"theta":[0.01,0.02,0.05,0.1,0.2,0.5,1,2,5,10,30],"S":[0,1,3,10,30,100,300,1000],"N":[[1.87,2.77,4.17,4.91,5.35,5.25,5.38,5.41],[2.23,3.49,5.45,6.25,6.64,6.83,6.76,7.22],[3.25,5.19,8.17,9.16,9.89,10.35,10.19,10.28],[4.49,7.29,11.74,13.98,14.98,15.47,15.85,15.75],[6.74,10.35,17.84,22.15,24.88,25.45,27.87,27.52],[13.25,17.46,31.21,45.35,53.56,60.26,59.74,63.05],[24.67,29.49,43.8,78.69,98.25,110.18,116.9,117.87],[47.59,52.41,65.8,120.61,174.02,203.49,221.9,232.79],[121.13,126.16,135.41,188.35,334.59,465.12,521.73,536.68],[251.37,251.76,250.82,297.81,468.19,757.06,956.38,1059.96],[729.48,735.85,718.2,751.32,871.53,1505.84,2242.75,2912.23]]};  // COIL_TABLE end
  // Spread N for a tube, read from the table (straight line between grid points on log scales; ends held)
  function coilN(theta, S) {
    const T = COIL_TABLE, cell = (axis, v) => {
      if (v <= axis[0]) return [0, 0]; const n = axis.length - 1; if (v >= axis[n]) return [n - 1, 1];
      let i = 0; while (axis[i + 1] < v) i++; return [i, (v - axis[i]) / (axis[i + 1] - axis[i])];
    };
    const [i, a] = cell(T.theta.map(Math.log), Math.log(Math.max(theta, 1e-9)));
    const [j, b] = cell(T.S.map(Math.log1p), Math.log1p(S));
    const L = (m, n) => Math.log(T.N[m][n]);
    return Math.exp((1 - a) * ((1 - b) * L(i, j) + b * L(i, j + 1)) + a * ((1 - b) * L(i + 1, j) + b * L(i + 1, j + 1)));
  }
  // Real PTFE sizes, inner -> outer diameter in mm (same as TUBE_OD_MM in ris/flow_reactor.py)
  const TUBE_OD_MM = { 0.79: 1.59, 1.59: 3.175, 2.38: 3.97, 3.175: 6.35, 4.76: 6.35, 6.35: 9.53 }, WALL_MM = 0.8, DEAN_LIMIT = 20;
  function tube(idMm, lengthM, flowMlMin, coilMm = 114, Dm = D_CIPRO) {   // coilMm = former the tube is wound on
    const R = idMm / 2000, area = Math.PI * R * R, Q = flowMlMin * 1e-6 / 60, u = Q / area;
    const tau = lengthM / u, Re = u * 2 * R / NU_WATER, theta = Dm * tau / (R * R);
    const odMm = TUBE_OD_MM[idMm] || idMm + 2 * WALL_MM, Rc = coilMm ? (coilMm + odMm) / 2000 : null;   // bend radius at the centreline
    const De = Rc ? Re * Math.sqrt(R / Rc) : null;
    const S = Rc && De <= DEAN_LIMIT ? R * u * u * tau / (72 * NU_WATER * Rc) : 0;      // above Dean 20: no swirl, widest spread
    let regime, D = null;
    if (Re > 2100) { regime = 'turbulent'; D = u * 2 * R * (3e7 / Math.pow(Re, 2.1) + 1.35 / Math.pow(Re, 0.125)); }
    else regime = S > 0 ? 'laminar, coil swirl and diffusion' : 'laminar, diffusion only';
    let N;
    if (D !== null) { const Pe = u * lengthM / D; N = 1 / (2 / Pe - 2 / (Pe * Pe) * (1 - Math.exp(-Pe))); }
    else N = coilN(theta, S);
    return { u, tau, tau_min: tau / 60, Re, theta, De, S, regime, N, volume_mL: area * lengthM * 1e6 };
  }
  const flowForContact = (idMm, lengthM, contactMin) => Math.PI * Math.pow(idMm / 2000, 2) * lengthM * 1e6 / contactMin;

  // Laminar convection, segregated flow: equal-flow slices leave at their exact mean exit time
  function runLaminar(s, p, n = 160) {
    const tau = s.contact_min * 60, y0 = initial(s);
    const tx = []; for (let i = 0; i < n; i++) tx.push(Math.max(tau / 2, tau * (Math.sqrt(1 - i / n) - Math.sqrt(1 - (i + 1) / n)) * n));
    const tr = integrate(y0, p, s.pH, Math.max(...tx), Math.max(5, tau / 60));
    const T = tr.T, Y = tr.Y, mean = new Array(NS).fill(0);
    let j = 1;
    tx.slice().sort((a, b) => a - b).forEach(t => {
      while (j < T.length - 1 && T[j] < t) j++;
      const f = (t - T[j - 1]) / (T[j] - T[j - 1]);
      for (let i = 0; i < NS; i++) mean[i] += (Y[j - 1][i] + f * (Y[j][i] - Y[j - 1][i])) / n;
    });
    return summary(mean, bisulfite(mean, p, s.pH, s.after_min), y0[4]);
  }

  // One call from the real tube: predicted flow pattern -> outlet. Returns {res, h}
  function runTube(s, p, idMm, lengthM, coilMm = 114) {
    const flow = flowForContact(idMm, lengthM, s.contact_min), h = tube(idMm, lengthM, flow, coilMm);
    const res = runFlow(s, p, Math.max(1, Math.min(200, Math.round(h.N))));
    return { res, h, flow };
  }

  // Dodd 2005 Fig 5a: thiosulfate-measured (cipro + N-chloro-cipro)/C0 in real waters
  function doddCurve(p, pH, FAC, tMin) {
    const tr = integrate([FAC, 0, 0, 0, 1.5e-6, 0, 0, 0, 0], p, pH, tMin * 60, 10);
    return tr.T.map((t, i) => [t / 60, (tr.Y[i][4] + tr.Y[i][5]) / 1.5e-6]);
  }

  return { DEFAULTS, consts, runBatch, runFlow, runLaminar, runTube, tube, flowForContact, bisulfite, doddCurve, integrate, initial, MW_CL2, MW_CIP };
})();
if (typeof module !== 'undefined') module.exports = RIS;

</script>
<script>
// Chlorination Settings Optimizer: search engine (global RISOPT). Interface: web/optimizer/CONTRACT.md
//
// Question answered: "What is the lowest chlorine dose that still disinfects (CT target) AND leaves the
// antibacterial activity of the water under the limit?"  Chemistry comes from web/model.js (global RIS), unchanged.
//
// How the grid is made fast: for each dose the model is integrated ONCE to the longest contact time, and every
// contact time is read off that one trajectory (straight line between solver steps, which are <= 5 s apart).
// Bisulfite + the wait before discharge is a closed formula (RIS.bisulfite), applied per cell.
// Trajectories are cached, so changing the CT target, the limit, potencies, k_rev or after_min costs nothing.
//
// PLACEHOLDERS, not measurements (the map moves when these change; see RISOPT.sensitivity):
//   - potency.NCL / P1 / P2: antibacterial strength of each product relative to ciprofloxacin = 1.
//     P1 = 0.4 is loosely based on Jaen-Gil et al. 2020 (TP296 keeps about 40 % of the activity);
//     NCL = 1.0 (worst case: as strong as the parent) and P2 = 0.01 (taken as nearly inactive) are guesses until
//     the bioassay is run. CONTRACT.md first listed P2 = 0.05; with that value and P1 = 0.4 no setting on the
//     default map gets under the limit, so P2 (the pure guess) was lowered and the literature-based P1 kept.
//   - k_demand (chlorine demand of the water) and k_rev (bisulfite turning N-chloro-cipro back into cipro, Gap 2).
//   - ctTarget default (300 mg*min/L) is an illustrative site-specific value, not a regulation.
const RISOPT = (function () {
  const RIS = (typeof module !== 'undefined' && module.exports && typeof require === 'function')
    ? require('../model.js')
    : (typeof globalThis !== 'undefined' ? globalThis.RIS : undefined) || (typeof window !== 'undefined' ? window.RIS : undefined);
  // In the page model.js declares `const RIS` at top level (a global binding, but not a window property).
  const M = RIS || (function () { try { return (0, eval)('RIS'); } catch (e) { return undefined; } })();
  if (!M) throw new Error('RISOPT: load model.js before optimizer/engine.js');

  const MW_CL2 = M.MW_CL2, MW_CIP = M.MW_CIP, NS = 9;
  const BISULFITE_PER_CL2 = 1.47;          // mg NaHSO3 per mg Cl2 (104.06 / 70.9)
  const K_REV_SLOW = 1e-4, K_REV_FAST = 1e-2;   // 1/s, for sensitivity(); model fragmentation is about 7e-4 1/s

  const DEFAULT_INPUTS = {
    pH: 7.5,
    NH3_mgN_L: 0,             // ammonia in the water; > 0 switches the model to mode 'together'
    cipro_ugL: 1.0,           // influent ciprofloxacin, ug/L
    k_demand_per_h: 0.72,     // chlorine demand decay (model k_demand 2e-4 1/s). PLACEHOLDER until fitted to DPD data
    after_min: 5,             // time between bisulfite and discharge
    ctTarget: 300,            // mg*min/L. Illustrative site-specific target (see header)
    ctBasis: 'residual',      // 'residual' = total chlorine residual at end x contact time (plant convention)
                              // 'integral' = model's integral of free chlorine
    minContact_min: 0,        // regulatory minimum contact time (Title 22 preset uses 90)
    maxContact_min: 120,      // basin limit
    activityLimit_ugL: 0.064, // ug/L ciprofloxacin-equivalents (Bengtsson-Palme & Larsson 2016 PNEC)
    potency: { NCL: 1.0, P1: 0.4, P2: 0.01 },   // relative to cipro = 1. PLACEHOLDERS until the bioassay
    k_rev: 0,                 // bisulfite reversal speed, 1/s. Unknown (Gap 2)
    doseRange: [0.5, 20], nDose: 40,            // mg/L as Cl2
    timeRange: [5, 120], nTime: 24,             // minutes
  };

  const PRESETS = [
    { id: 'secondary', label: 'Secondary effluent discharge',
      note: 'Site-specific CT of 300 mg*min/L, no minimum contact time, 1 ug/L ciprofloxacin coming in. ' +
            'The CT value is an example: use the one in your permit.',
      inputs: { ctTarget: 300, minContact_min: 0, maxContact_min: 120, cipro_ugL: 1.0, activityLimit_ugL: 0.064,
                doseRange: [0.5, 20], nDose: 40, timeRange: [5, 120], nTime: 24 } },
    { id: 'title22', label: 'Title 22 recycled water',
      note: 'California Title 22 disinfected tertiary: CT of at least 450 mg*min/L with at least 90 min modal ' +
            'contact time. Dose range widened to 30 mg/L because this CT needs a lot of chlorine.',
      inputs: { ctTarget: 450, minContact_min: 90, maxContact_min: 120, cipro_ugL: 1.0, activityLimit_ugL: 0.064,
                doseRange: [1, 30], nDose: 30, timeRange: [60, 120], nTime: 13 } },
    // San Jose-Santa Clara plant (plant's written answers, Nov 2026; mirrors ris/plant.py SAN_JOSE). Chloramine:
    // 1.8 mg/L (assumed to be the dose) with ammonia, pH 7.0, ~40 min. CT target 72 = 1.8 mg/L x 40 min, what the plant
    // runs today (CALCULATED, not a permit value). Ammonia 0.5 mg N/L is an ESTIMATE (Zone 2, below 5:1 Cl2:N).
    { id: 'sanjose', label: 'San Jose-Santa Clara plant (chloramine)',
      note: 'Chloramine like the San Jose-Santa Clara plant: pH 7.0, ammonia 0.5 mg N/L (estimate), CT target ' +
            '72 mg*min/L = its 1.8 mg/L for 40 min today. 1 ug/L ciprofloxacin coming in.',
      inputs: { pH: 7.0, NH3_mgN_L: 0.5, ctTarget: 72, minContact_min: 0, maxContact_min: 120, cipro_ugL: 1.0,
                activityLimit_ugL: 0.064, doseRange: [0.5, 20], nDose: 40, timeRange: [5, 120], nTime: 24 } },
    { id: 'bench', label: 'Bench batch reactor',
      note: 'The school lab run: 1000 ug/L ciprofloxacin in a beaker at pH 7.0 (the plant\'s pH), so HPLC can see it. ' +
            'The limit is scaled to the same fraction of the starting amount (6.4 % = 64 ug/L).',
      inputs: { pH: 7.0, NH3_mgN_L: 0, cipro_ugL: 1000, activityLimit_ugL: 64, ctTarget: 300, minContact_min: 0,
                maxContact_min: 120, doseRange: [0.5, 20], nDose: 40, timeRange: [5, 120], nTime: 24 } },
  ];

  // ---------------------------------------------------------------- input checking
  const LIMITS = {
    pH: [6, 9], NH3_mgN_L: [0, 50], cipro_ugL: [1e-4, 1e5], k_demand_per_h: [0, 20], after_min: [0, 1440],
    ctTarget: [0, 1e5], minContact_min: [0, 480], maxContact_min: [1, 480], activityLimit_ugL: [0, 1e6],
    potency: [0, 100], k_rev: [0, 1], dose: [0.01, 100], time: [0.5, 480], nDose: [2, 80], nTime: [2, 60],
  };
  const num = (v, dflt) => { const x = typeof v === 'string' && v.trim() !== '' ? Number(v) : v; return typeof x === 'number' && isFinite(x) ? x : dflt; };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const field = (src, key, limKey) => clamp(num(src[key], DEFAULT_INPUTS[key]), LIMITS[limKey || key][0], LIMITS[limKey || key][1]);
  const fin = v => (typeof v === 'number' && isFinite(v) ? v : 0);
  const round = (v, dp) => { const f = Math.pow(10, dp); return Math.round(v * f) / f; };

  function range(src, key, lim) {
    const d = DEFAULT_INPUTS[key], r = Array.isArray(src[key]) ? src[key] : d;
    let lo = clamp(num(r[0], d[0]), lim[0], lim[1]), hi = clamp(num(r[1], d[1]), lim[0], lim[1]);
    if (lo > hi) { const t = lo; lo = hi; hi = t; }
    if (!(hi > lo)) { lo = d[0]; hi = d[1]; }           // an empty range is not a range: fall back to the default
    return [lo, hi];
  }

  // Returns a complete, safe copy of the inputs: defaults filled in, everything clamped to a workable range.
  function normalize(inputs) {
    const s = inputs && typeof inputs === 'object' ? inputs : {};
    const pot = s.potency && typeof s.potency === 'object' ? s.potency : {};
    const P = k => clamp(num(pot[k], DEFAULT_INPUTS.potency[k]), LIMITS.potency[0], LIMITS.potency[1]);
    const out = {
      pH: field(s, 'pH'), NH3_mgN_L: field(s, 'NH3_mgN_L'), cipro_ugL: field(s, 'cipro_ugL'),
      k_demand_per_h: field(s, 'k_demand_per_h'), after_min: field(s, 'after_min'),
      ctTarget: field(s, 'ctTarget'), ctBasis: s.ctBasis === 'integral' ? 'integral' : 'residual',
      minContact_min: field(s, 'minContact_min'), maxContact_min: field(s, 'maxContact_min'),
      activityLimit_ugL: field(s, 'activityLimit_ugL'),
      potency: { NCL: P('NCL'), P1: P('P1'), P2: P('P2') },
      k_rev: field(s, 'k_rev'),
      doseRange: range(s, 'doseRange', LIMITS.dose), nDose: Math.round(field(s, 'nDose')),
      timeRange: range(s, 'timeRange', LIMITS.time), nTime: Math.round(field(s, 'nTime')),
    };
    // The basin limit caps the time axis: a contact time the basin cannot give is not an option.
    out.timeRange[1] = Math.min(out.timeRange[1], out.maxContact_min);
    if (out.timeRange[0] >= out.timeRange[1]) out.timeRange[0] = Math.max(round(out.timeRange[1] / out.nTime, 1), 0.1);
    return out;
  }

  // Evenly spaced, rounded to tidy values (dp decimals), duplicates removed.
  function axis(lo, hi, n, dp) {
    if (!(hi > lo)) return [round(lo, dp)];
    const out = [];
    for (let i = 0; i < n; i++) {
      const v = round(lo + (hi - lo) * i / (n - 1), dp);
      if (!out.length || v > out[out.length - 1]) out.push(v);
    }
    return out;
  }
  const doseAxis = s => axis(s.doseRange[0], s.doseRange[1], s.nDose, 2);
  const timeAxis = s => axis(s.timeRange[0], s.timeRange[1], s.nTime, 1);

  // ---------------------------------------------------------------- model runs (cached)
  // Model parameters for these inputs. A copy: RIS.DEFAULTS is never changed.
  function params(s) {
    return Object.assign({}, M.DEFAULTS, { k_demand: s.k_demand_per_h / 3600, k_rev_bisulfite: s.k_rev });
  }

  const cache = new Map(), CACHE_MAX = 160;      // key -> { tEnd (s), T: Float64Array, Y: Float64Array (NS per step) }
  const chemKey = (s, dose) => [s.pH, s.NH3_mgN_L, s.cipro_ugL, s.k_demand_per_h, dose].join('|');

  // Whole contact-period trajectory for one dose, at least tEndMin minutes long.
  function trajectory(s, dose, tEndMin) {
    const key = chemKey(s, dose), tEnd = Math.max(tEndMin, 1e-3) * 60;
    const hit = cache.get(key);
    if (hit && hit.tEnd >= tEnd - 1e-9) { cache.delete(key); cache.set(key, hit); return hit; }
    const y0 = M.initial({ Cl_mgL: dose, NH3_mgN_L: s.NH3_mgN_L, cipro_mgL: s.cipro_ugL / 1000,
                           mode: s.NH3_mgN_L > 0 ? 'together' : 'free' });
    const tr = M.integrate(y0, params(s), s.pH, tEnd);
    const n = tr.T.length, T = Float64Array.from(tr.T), Y = new Float64Array(n * NS);
    for (let i = 0; i < n; i++) for (let k = 0; k < NS; k++) Y[i * NS + k] = fin(tr.Y[i][k]);
    const entry = { tEnd, T, Y };
    cache.delete(key); cache.set(key, entry);
    while (cache.size > CACHE_MAX) cache.delete(cache.keys().next().value);
    return entry;
  }

  // State at time tSec, straight line between solver steps.
  function stateAt(tr, tSec) {
    const T = tr.T, Y = tr.Y, n = T.length, y = new Array(NS);
    if (tSec >= T[n - 1]) { for (let k = 0; k < NS; k++) y[k] = Y[(n - 1) * NS + k]; return y; }
    if (tSec <= 0) { for (let k = 0; k < NS; k++) y[k] = Y[k]; return y; }
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (T[mid] <= tSec) lo = mid; else hi = mid; }
    const f = (tSec - T[lo]) / (T[hi] - T[lo]);
    for (let k = 0; k < NS; k++) y[k] = Y[lo * NS + k] + f * (Y[hi * NS + k] - Y[lo * NS + k]);
    return y;
  }

  const mgCl2 = v => Math.max(fin(v), 0) * MW_CL2 * 1000;     // mol/L -> mg/L as Cl2
  const ugCip = v => { const u = Math.max(fin(v), 0) * MW_CIP * 1e6; return u < 1e-12 ? 0 : u; };   // mol/L -> ug/L as ciprofloxacin; solver dust -> 0
  const totalResidual = y => mgCl2(y[0]) + mgCl2(y[2]) + 2 * mgCl2(y[8]);   // free + monochloramine + dichloramine
  const activityOf = (s, c, n, p1, p2) => c + s.potency.NCL * n + s.potency.P1 * p1 + s.potency.P2 * p2;

  // One cell from the state at the end of contact. s must already be normalized; p = params(s).
  function cellFrom(s, p, dose, t, y) {
    const residual = totalResidual(y), freeResidual = mgCl2(y[0]);
    const ct = fin(s.ctBasis === 'integral' ? Math.max(y[3], 0) : residual * t);
    const out = M.bisulfite(y, p, s.pH, s.after_min);
    const cipro = ugCip(out[4]), ncl = ugCip(out[5]), p1 = ugCip(out[6]), p2 = ugCip(out[7]);
    const activity = fin(activityOf(s, cipro, ncl, p1, p2));
    const passCT = ct >= s.ctTarget && t >= s.minContact_min - 1e-9 && t <= s.maxContact_min + 1e-9;
    const passActivity = activity <= s.activityLimit_ugL;
    return {
      dose, t, ct, residual, freeResidual,
      cipro_ugL: cipro, ncl_ugL: ncl, p1_ugL: p1, p2_ugL: p2, activity_ugL: activity,
      passCT, passActivity, pass: passCT && passActivity,
      ctMet: ct >= s.ctTarget,          // CT alone; passCT also needs the contact time inside the allowed range
      passDrugOnly: passCT && cipro <= s.activityLimit_ugL,
      bisulfite_mgL: BISULFITE_PER_CL2 * residual,
    };
  }

  function evaluate(inputs, dose, contact_min) {
    const s = normalize(inputs);
    const d = clamp(num(dose, s.doseRange[0]), LIMITS.dose[0], LIMITS.dose[1]);
    const t = clamp(num(contact_min, s.timeRange[0]), 1e-3, LIMITS.time[1]);
    return cellFrom(s, params(s), d, t, stateAt(trajectory(s, d, t), t * 60));
  }

  // ---------------------------------------------------------------- grid
  function plan(inputs) {
    const s = normalize(inputs), doses = doseAxis(s), times = timeAxis(s);
    return { s, p: params(s), doses, times, tMax: times[times.length - 1], cells: [] };
  }
  function doseRow(g, i) {
    const tr = trajectory(g.s, g.doses[i], g.tMax), row = [];
    for (let j = 0; j < g.times.length; j++) {
      const c = cellFrom(g.s, g.p, g.doses[i], g.times[j], stateAt(tr, g.times[j] * 60));
      c.iDose = i; c.iTime = j; row.push(c);
    }
    g.cells.push(row);
  }
  function finish(g, t0) {
    const counts = { pass: 0, failCT: 0, failActivity: 0, failBoth: 0 };
    let recommended = null, drugOnly = null;
    for (const row of g.cells) for (const c of row) {      // doses ascending, then times ascending
      if (c.pass) counts.pass++;
      else if (c.passCT) counts.failActivity++;
      else if (c.passActivity) counts.failCT++;
      else counts.failBoth++;
      if (c.pass && !recommended) recommended = c;
      if (c.passDrugOnly && !drugOnly) drugOnly = c;
    }
    return { inputs: g.s, doses: g.doses, times: g.times, cells: g.cells, recommended, drugOnly, counts, ms: now() - t0 };
  }
  const now = () => (typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now());

  function runGridSync(inputs) {
    const t0 = now(), g = plan(inputs);
    for (let i = 0; i < g.doses.length; i++) doseRow(g, i);
    return finish(g, t0);
  }

  // Same work as runGridSync, but gives the page a turn between doses whenever ~12 ms have gone by.
  // opts.onProgress(frac) is called after every dose (frac 0..1). opts.signal (AbortSignal) is optional:
  // if it aborts, the promise rejects with an Error named 'AbortError'.
  const pause = () => new Promise(res => setTimeout(res, 0));
  async function runGrid(inputs, opts) {
    const o = opts || {}, t0 = now(), g = plan(inputs);
    const aborted = () => { if (o.signal && o.signal.aborted) { const e = new Error('grid run cancelled'); e.name = 'AbortError'; throw e; } };
    let last = now();
    await pause(); aborted();
    for (let i = 0; i < g.doses.length; i++) {
      doseRow(g, i);
      if (typeof o.onProgress === 'function') { try { o.onProgress((i + 1) / g.doses.length); } catch (e) { /* a broken progress bar must not stop the search */ } }
      if (now() - last > 12 && i < g.doses.length - 1) { await pause(); aborted(); last = now(); }
    }
    return finish(g, t0);
  }

  // ---------------------------------------------------------------- time course for one setpoint
  // Contact period, then after_min past the bisulfite. The quench time appears twice in t_min: once with the
  // residual still there, once with it removed (so a line chart draws the drop as a vertical step).
  function timecourse(inputs, dose, contact_min) {
    const s = normalize(inputs), p = params(s);
    const d = clamp(num(dose, s.doseRange[0]), LIMITS.dose[0], LIMITS.dose[1]);
    const tc = clamp(num(contact_min, s.timeRange[0]), 1e-3, LIMITS.time[1]);
    const tr = trajectory(s, d, tc);
    const out = { t_min: [], residual: [], cipro: [], ncl: [], p1: [], p2: [], activity: [], quenchAt_min: tc };
    const push = (t, y, res) => {
      const c = ugCip(y[4]), n = ugCip(y[5]), a = ugCip(y[6]), b = ugCip(y[7]);
      out.t_min.push(t); out.residual.push(res); out.cipro.push(c); out.ncl.push(n); out.p1.push(a); out.p2.push(b);
      out.activity.push(fin(activityOf(s, c, n, a, b)));
    };
    // The parent drug goes in the first seconds, so the first minute gets extra points.
    const ts = [0], early = Math.min(1, tc / 4);
    for (let i = 1; i <= 12; i++) ts.push(early * i / 12);
    const nMain = 96;
    for (let i = 1; i <= nMain; i++) ts.push(early + (tc - early) * i / nMain);
    for (const t of ts) { const y = stateAt(tr, t * 60); push(t, y, totalResidual(y)); }
    const yEnd = stateAt(tr, tc * 60);
    const nAfter = s.after_min > 0 ? 20 : 0;
    for (let i = 0; i <= nAfter; i++) {
      const dt = nAfter ? s.after_min * i / nAfter : 0;
      push(tc + dt, M.bisulfite(yEnd, p, s.pH, dt), 0);
    }
    return out;
  }

  // ---------------------------------------------------------------- what if the assumptions are wrong
  // The SAME dose and contact time, re-evaluated under other assumptions. Nothing is re-optimized.
  function sensitivity(inputs, cell) {
    const s = normalize(inputs);
    if (!cell || !isFinite(cell.dose) || !isFinite(cell.t)) return [];
    const pot = f => ({ NCL: clamp(s.potency.NCL * f, 0, 100), P1: clamp(s.potency.P1 * f, 0, 100), P2: clamp(s.potency.P2 * f, 0, 100) });
    const cases = [
      { id: 'rev_slow', label: 'Bisulfite reversal, slow', change: { k_rev: K_REV_SLOW } },
      { id: 'rev_fast', label: 'Bisulfite reversal, fast', change: { k_rev: K_REV_FAST } },
      { id: 'potency_x2', label: 'Products twice as potent', change: { potency: pot(2) } },
      { id: 'potency_half', label: 'Products half as potent', change: { potency: pot(0.5) } },
      // doubling zero tests nothing, so with (near) zero demand compare against the model's default instead
      s.k_demand_per_h < 0.05
        ? { id: 'demand_x2', label: 'Chlorine decay rate 0.72 per h', change: { k_demand_per_h: 0.72 } }
        : { id: 'demand_x2', label: 'Chlorine decay rate doubled', change: { k_demand_per_h: Math.min(s.k_demand_per_h * 2, LIMITS.k_demand_per_h[1]) } },
    ];
    return cases.map(k => {
      const c = evaluate(Object.assign({}, s, k.change), cell.dose, cell.t);
      return { id: k.id, label: k.label, activity_ugL: c.activity_ugL, ct: c.ct, pass: c.pass,
               passCT: c.passCT, passActivity: c.passActivity, cipro_ugL: c.cipro_ugL };
    });
  }

  // ---------------------------------------------------------------- export
  const CSV_HEADER = ['dose_mgL_Cl2', 'contact_min', 'ct_mg_min_per_L', 'total_residual_mgL_Cl2', 'free_residual_mgL_Cl2',
    'cipro_ugL', 'n_chloro_cipro_ugL_as_cipro', 'p1_ugL_as_cipro', 'p2_ugL_as_cipro', 'activity_ugL_cipro_eq',
    'pass_ct', 'pass_activity', 'pass', 'pass_drug_only', 'bisulfite_mgL_NaHSO3'];
  const sig = (v, n) => (isFinite(v) ? String(Number(Number(v).toPrecision(n))) : '');
  function toCSV(grid) {
    const lines = [CSV_HEADER.join(',')];
    if (grid && Array.isArray(grid.cells)) for (const row of grid.cells) for (const c of row) {
      lines.push([sig(c.dose, 6), sig(c.t, 6), sig(c.ct, 6), sig(c.residual, 6), sig(c.freeResidual, 6),
        sig(c.cipro_ugL, 6), sig(c.ncl_ugL, 6), sig(c.p1_ugL, 6), sig(c.p2_ugL, 6), sig(c.activity_ugL, 6),
        c.passCT ? 1 : 0, c.passActivity ? 1 : 0, c.pass ? 1 : 0, c.passDrugOnly ? 1 : 0, sig(c.bisulfite_mgL, 6)].join(','));
    }
    return lines.join('\n') + '\n';
  }

  // One line for this repo's blind-test script. --kind batch runs ris.cipro_model.run_batch(**params), which
  // always uses the committed model's own chlorine demand and k_rev, so the claim says when the page used others.
  function lockCommand(inputs, cell) {
    const s = normalize(inputs);
    if (!cell || !isFinite(cell.dose) || !isFinite(cell.t)) return '';
    const c = evaluate(s, cell.dose, cell.t);
    const tag = v => sig(v, 4).replace('.', 'p').replace(/[^0-9a-z]/g, '');
    const name = ['opt', 'cl' + tag(c.dose), 't' + tag(c.t), 'ph' + tag(s.pH)]
      .concat(s.NH3_mgN_L > 0 ? ['nh' + tag(s.NH3_mgN_L)] : []).join('-').slice(0, 60);
    const prm = [['pH', s.pH], ['Cl_dose_mgL', c.dose], ['NH3_mgN_L', s.NH3_mgN_L], ['cipro_mgL', s.cipro_ugL / 1000],
      ['contact_min', c.t], ['after_bisulfite_min', s.after_min]].map(kv => '--param ' + kv[0] + '=' + sig(kv[1], 8)).join(' ');
    let claim = 'Optimizer setpoint ' + fmt(c.dose, 'dose') + ' mg/L Cl2 for ' + fmt(c.t, 'time') + ' min at pH ' + sig(s.pH, 3) +
      ': predicted ciprofloxacin ' + fmt(c.cipro_ugL, 'ugL') + ' ug/L and antibacterial activity ' + fmt(c.activity_ugL, 'ugL') +
      ' ug/L cipro-equivalents after bisulfite plus ' + fmt(s.after_min, 'time') + ' min (limit ' + fmt(s.activityLimit_ugL, 'ugL') +
      ' ug/L; placeholder potencies NCL ' + sig(s.potency.NCL, 3) + ', P1 ' + sig(s.potency.P1, 3) + ', P2 ' + sig(s.potency.P2, 3) +
      '); CT ' + fmt(c.ct, 'ct') + ' mg*min/L' + (s.ctBasis === 'residual'
        ? ' as total residual x contact time (the file records CT as the integral of free chlorine, a different and larger number).'
        : ' as the integral of free chlorine.');
    const off = [];
    if (Math.abs(s.k_demand_per_h / 3600 - M.DEFAULTS.k_demand) > 1e-9) off.push('chlorine demand ' + sig(s.k_demand_per_h, 3) + ' per h');
    if (s.k_rev !== M.DEFAULTS.k_rev_bisulfite) off.push('k_rev ' + sig(s.k_rev, 3) + ' per s');
    if (off.length) claim += ' Page used ' + off.join(' and ') + ', not the committed model values, so the predicted block of this file differs from the claim.';
    claim = claim.replace(/["'`$\\!\n\r]/g, '');       // nothing a shell could trip over inside double quotes
    return 'python scripts/lock_prediction.py ' + name + ' --kind batch ' + prm + ' --claim "' + claim + '"';
  }

  // ---------------------------------------------------------------- number formatting (no units)
  const trim = str => (str.indexOf('.') >= 0 ? str.replace(/0+$/, '').replace(/\.$/, '') : str);
  function fmt(value, kind) {
    const v = typeof value === 'string' ? Number(value) : value;
    if (typeof v !== 'number' || !isFinite(v)) return '–';
    const a = Math.abs(v);
    if (a === 0) return '0';
    switch (kind) {
      case 'dose': return trim(v.toFixed(a < 10 ? 2 : 1));
      case 'time': return trim(v.toFixed(a < 10 ? 1 : (Math.abs(v - Math.round(v)) < 0.05 ? 0 : 1)));
      case 'ct': return a >= 100 ? v.toFixed(0) : trim(v.toFixed(a >= 10 ? 1 : 2));
      case 'mgL': return a < 0.005 ? '<0.01' : trim(v.toFixed(a < 10 ? 2 : 1));
      case 'ugL':
      default:
        if (a < 0.0005) return '<0.001';
        if (a >= 1000) return v.toFixed(0);
        return String(Number(v.toPrecision(3)));
    }
  }

  return {
    DEFAULT_INPUTS, PRESETS, runGrid, runGridSync, evaluate, timecourse, sensitivity, toCSV, lockCommand, fmt,
    // extras (not in the contract, safe to ignore): cleaned-up inputs, preset merge, cache control
    normalize, withPreset: id => { const p = PRESETS.find(x => x.id === id); return normalize(Object.assign({}, DEFAULT_INPUTS, p ? p.inputs : {})); },
    clearCache: () => cache.clear(),
  };
})();
if (typeof globalThis !== 'undefined') globalThis.RISOPT = RISOPT;   // a top-level const is not a window property; the charts look it up there
if (typeof module !== 'undefined') module.exports = RISOPT;

</script>
<script>
/* Chlorination Settings Optimizer: charts. Global RISCHART. No dependencies, plain ES2020, runs from file://.
 *
 *   RISCHART.operatingMap(container, grid, { selected, onSelect }) -> { update(grid, opts), destroy() }
 *   RISCHART.timecourse(container, tc, { limit_ugL })              -> { update(tc, opts), destroy() }
 *
 * Colours come from the CSS custom properties in tokens.css, read with getComputedStyle(container) at draw time.
 * Both charts redraw on container resize and on theme change (prefers-color-scheme, data-theme on <html>).
 * Nothing here animates, so prefers-reduced-motion is respected by construction.
 */
(function (global) {
  'use strict';

  // ---------------------------------------------------------------------------------------------------------------
  // Species colours for the timecourse (the only colours not taken from tokens.css). Chosen away from the status
  // blue / amber / red, and checked with dataviz validate_palette.js --pairs all (lines cross, so every pair counts):

  // Redraw on container resize, theme change and late font loads. Returns a disposer.

  // ---------------------------------------------------------------------------------------------------------------

      const gLines = s('g', { fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, gStatic);
      const toPath = (chains) => chains.map((ch_) => ch_.map((p, k) => (k ? 'L' : 'M') + (px(p[0]) - (gap ? 0.5 : 0)) + ' ' + py(p[1])).join('')).join('');

      function chip(text, x, y, w) {     // x, y = top-left of an 18px-high chip

        s('text', { x: r1(x + w / 2), y: r1(y + 13), 'text-anchor': 'middle', fill: tok.ink, 'font-family': fLabel, 'font-size': 12, 'font-weight': 500 }, gChip, text);
      }
      // A marker label may not hide the pass region: at most a quarter of it. A region smaller than the label
      // therefore gets the label outside it, or none.
      let passArea = 0;
      for (let i = 0; i < nD; i++) for (let j = 0; j < nT; j++) { const c = g.cells[i][j]; if (c && c.pass) passArea += cw * ch; }

        let a = 0;

          const c = g.cells[i][j];
